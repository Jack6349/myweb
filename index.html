<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✈️</text></svg>">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0f1923">
<title>生活總管</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
:root {
  --bg: #0f1923;
  --bg2: #162030;
  --bg3: #1e2d3d;
  --bg4: #243447;
  --accent: #e8b84b;
  --accent2: #f0cc7a;
  --text: #eef2f7;
  --text2: #e0d4c0;
  --text3: #c8b89a;
  --border: rgba(255,255,255,0.08);
  --border2: rgba(255,255,255,0.14);
  --radius: 18px;
  --font: 'Noto Sans TC', sans-serif;
}
html, body {
  min-height: 100%;
  background: var(--bg);
  color: var(--text);
  font-family: var(--font);
  overflow-x: hidden;
}

/* ── HEADER ── */
.header {
  padding: 52px 24px 8px;
  background: linear-gradient(180deg, #0d1a26 0%, var(--bg) 100%);
}
.header-greeting {
  font-size: 13px;
  color: var(--text3);
  letter-spacing: .5px;
  margin-bottom: 6px;
}
.header-title {
  font-size: 32px;
  font-weight: 700;
  letter-spacing: -.5px;
  color: var(--text);
}
.header-date {
  font-size: 13px;
  color: var(--text2);
  margin-top: 6px;
}

/* ── SECTION ── */
.section { padding: 28px 20px 0; }
.section-title {
  font-size: 12px;
  font-weight: 600;
  color: #c8b89a;
  letter-spacing: 1px;
  text-transform: uppercase;
  margin-bottom: 14px;
}

/* ── APP GRID ── */
.app-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 14px;
}
.app-card {
  background: var(--bg3);
  border-radius: var(--radius);
  border: 1px solid var(--border);
  padding: 20px 18px 18px;
  cursor: pointer;
  text-decoration: none;
  display: flex;
  flex-direction: column;
  gap: 14px;
  transition: background .15s, border-color .15s, transform .1s;
  position: relative;
  overflow: hidden;
}
.app-card::before {
  content: '';
  position: absolute;
  inset: 0;
  background: var(--card-glow, transparent);
  opacity: .07;
  pointer-events: none;
}
.app-card:active {
  transform: scale(.97);
  background: var(--bg4);
}
.app-icon {
  width: 48px; height: 48px;
  border-radius: 14px;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
}
.app-name {
  font-size: 15px;
  font-weight: 700;
  line-height: 1.3;
  color: #f0e6d3;
}
.app-desc {
  font-size: 12px;
  color: #b0a898;
  margin-top: 2px;
  line-height: 1.5;
}
.app-arrow {
  position: absolute;
  bottom: 16px; right: 16px;
  color: var(--text3);
  opacity: .5;
}

/* ── WIDE CARD ── */
.app-card.wide {
  grid-column: span 2;
  flex-direction: row;
  align-items: center;
  gap: 16px;
  padding: 18px 20px;
}
.app-card.wide .app-info { flex: 1; }

/* ── COMING SOON ── */
.coming-soon {
  position: absolute;
  top: 12px; right: 12px;
  background: rgba(255,255,255,.06);
  color: var(--text3);
  font-size: 10px;
  font-weight: 600;
  padding: 3px 8px;
  border-radius: 10px;
  letter-spacing: .3px;
}

/* ── FOOTER ── */
.footer {
  padding: 32px 24px 48px;
  text-align: center;
}
.footer-text {
  font-size: 12px;
  color: var(--text3);
}

/* ── RATE BAR ── */
.rate-bar {
  margin: 0 20px;
  background: var(--bg3);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 14px 18px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}
.rate-bar-title {
  font-size: 11px;
  font-weight: 600;
  color: var(--text3);
  letter-spacing: .5px;
  flex-shrink: 0;
}
.rate-items {
  display: flex;
  gap: 16px;
  flex-wrap: wrap;
  justify-content: flex-end;
}
.rate-item {
  text-align: right;
}
.rate-pair {
  font-size: 10px;
  color: var(--text3);
  letter-spacing: .3px;
}
.rate-value {
  font-size: 15px;
  font-weight: 700;
  color: var(--accent2);
  font-variant-numeric: tabular-nums;
}
.rate-value.loading { color: var(--text3); font-size: 12px; font-weight: 400; }
.rate-refresh {
  background: none;
  border: none;
  color: var(--text3);
  cursor: pointer;
  padding: 4px;
  flex-shrink: 0;
  transition: color .15s;
}
.rate-refresh:active { color: var(--accent); }
@keyframes spin { to { transform: rotate(360deg); } }
.spinning { animation: spin .6s linear infinite; display: inline-block; }

/* ── DIVIDER ── */
.divider {
  height: 1px;
  background: var(--border);
  margin: 28px 20px 0;
}
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>

<script>
var GAS_URL = 'https://script.google.com/macros/s/AKfycbz8j18olygkPUIsqXEUptyrt7XwDQWEwOcoz81nrLvHCE3HJrDindFnCZ4344o4QT8N1w/exec';
var RATE_CACHE_KEY = 'rate_cache';
var RATE_PAIRS = ['JPYTWD','JPYUSD','USDTWD'];
var rateTimer = null;

// Date display
(function() {
  var days = ['日','一','二','三','四','五','六'];
  var now = new Date();
  document.getElementById('header-date').textContent =
    now.getFullYear() + ' 年 ' + (now.getMonth()+1) + ' 月 ' + now.getDate() + ' 日（' + days[now.getDay()] + '）';
})();

function getRateCache() {
  try { return JSON.parse(localStorage.getItem(RATE_CACHE_KEY)) || {}; }
  catch(e) { return {}; }
}
function setRateCache(d) { localStorage.setItem(RATE_CACHE_KEY, JSON.stringify(d)); }

async function fetchRate(pair) {
  var cache = getRateCache();
  var now = Date.now();
  var TTL = 15 * 60 * 1000; // 15 min
  if (cache[pair] && (now - cache[pair].ts) < TTL) return cache[pair].data;
  var res = await fetch(GAS_URL + '?rate=' + encodeURIComponent(pair));
  if (!res.ok) throw new Error('HTTP ' + res.status);
  var data = await res.json();
  if (data.stat !== 'OK') throw new Error(data.error || '查無資料');
  cache[pair] = { ts: now, data: data };
  setRateCache(cache);
  return data;
}

function fmtRate(pair, price) {
  // JPY pairs: show 4 decimal places; USD/TWD: 3
  if (pair === 'JPYTWD') return price.toFixed(4);
  if (pair === 'JPYUSD') return price.toFixed(6);
  if (pair === 'USDTWD') return price.toFixed(3);
  return price.toFixed(4);
}

async function loadRate(pair, force) {
  var el = document.getElementById('rate-' + pair);
  if (!el) return;
  if (force) {
    var cache = getRateCache();
    delete cache[pair];
    setRateCache(cache);
  }
  try {
    var data = await fetchRate(pair);
    el.textContent = fmtRate(pair, data.price);
    el.classList.remove('loading');
  } catch(e) {
    el.textContent = '—';
    el.classList.add('loading');
  }
}

function refreshRates() {
  var btn = document.getElementById('rate-refresh-btn');
  var svg = btn ? btn.querySelector('svg') : null;
  if (svg) svg.classList.add('spinning');
  Promise.all(RATE_PAIRS.map(function(p) { return loadRate(p, true); }))
    .finally(function() { if (svg) svg.classList.remove('spinning'); });
}

function startRateAutoRefresh() {
  // Load immediately
  RATE_PAIRS.forEach(function(p) { loadRate(p, false); });
  // Auto refresh every 15 min
  if (rateTimer) clearInterval(rateTimer);
  rateTimer = setInterval(function() {
    RATE_PAIRS.forEach(function(p) { loadRate(p, true); });
  }, 15 * 60 * 1000);
}

// Start on load
document.addEventListener('DOMContentLoaded', function() {
  startRateAutoRefresh();
});
// ── 旅行行程卡片動態資訊 ──
(function() {
  try {
    var trips = JSON.parse(localStorage.getItem('travel_trips') || '[]');
    var desc = document.getElementById('travel-card-desc');
    if (!desc) return;
    if (!trips.length) { desc.textContent = '新增旅行行程'; return; }
    
    var now = new Date();
    // 找進行中的行程
    var active = trips.find(function(t) {
      var s = new Date(t.startDate), e = new Date(t.endDate);
      return now >= s && now <= e;
    });
    if (active) {
      var start = new Date(active.startDate);
      var dayNum = Math.floor((now - start) / 86400000) + 1;
      var total = Math.floor((new Date(active.endDate) - start) / 86400000) + 1;
      var remain = total - dayNum;
      desc.textContent = 'D' + dayNum + '・' + active.name + ('・還有 ' + remain + ' 天');
      desc.style.color = '#7bed9f';
      return;
    }
    // 找最近未來行程
    var future = trips.filter(function(t){ return new Date(t.startDate) > now; })
      .sort(function(a,b){ return new Date(a.startDate)-new Date(b.startDate); })[0];
    if (future) {
      var days = Math.ceil((new Date(future.startDate) - now) / 86400000);
      desc.textContent = '共 ' + trips.length + ' 個行程・' + days + '天後出發';
      return;
    }
    desc.textContent = '共 ' + trips.length + ' 個行程';
  } catch(e) {}
})();

</script>
