<!doctype html>
<html lang="zh-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>夜推股票 單檔瀏覽測試</title>
<style>
:root{
  --bg:#0e1621; --bg2:#16202e; --bg3:#1b2736; --border:#3a4f68;
  --text:#e8eef5; --text2:#9db0c4; --text3:#7b8ea4;
  --accent:#e8b84b; --accent2:#f0cc7a; --up:#ff5252; --down:#26d962;
  --th:#c9955a; --sub:#e07fae; --note:#7fc8db; --sum:#a5e9f7;
  --accent3:#5aa9ff; --warn:#ff9f43; --caution:#f5d87a;
  --border-strong:#435a78;
}
*{box-sizing:border-box}
body{margin:0;padding:18px 20px 40px;background:var(--bg);color:var(--text);
  font:14px/1.55 "Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;
  font-variant-numeric:tabular-nums}
h1{font-size:18px;font-weight:700;color:var(--accent2);margin:0 0 4px;
  padding-left:9px;border-left:4px solid var(--accent)}
.lead{font-size:12px;color:var(--note);margin:0 0 12px;max-width:1100px;line-height:1.8}

/* ── 排序列 ── */
.sortbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:0 0 14px}
.slb{font-size:13.5px;color:var(--th);font-weight:600}
.sb{background:var(--bg3);border:1px solid var(--border);color:var(--text2);
  border-radius:6px;padding:4px 12px;font:600 13px/1 inherit;cursor:pointer}
.sb.on{border-color:var(--accent3);color:var(--text)}

/* ── 兩欄 ── */
.wrap{display:flex;gap:18px;align-items:flex-start}
.side{width:430px;flex:none;display:flex;flex-direction:column;gap:6px}
.main{flex:1;min-width:0}

/* ── 左側清單 ── */
.row{position:relative;background:var(--bg2);border:1px solid var(--border);
  border-radius:8px;padding:7px 11px 8px 13px;cursor:pointer;text-align:left;
  color:inherit;font:inherit;display:block;width:100%}
.row::before{content:"";position:absolute;left:0;top:8px;bottom:8px;width:3px;
  border-radius:0 3px 3px 0;background:transparent}
.row:hover{border-color:var(--border-strong)}
.row.on{background:var(--bg3);border-color:var(--accent3)}
.row.on::before{background:var(--accent3)}
.r1{display:flex;align-items:baseline;gap:7px}
.r1 .cd{font-size:15px;font-weight:700;color:var(--text)}
.r1 .nm{font-size:12.5px;color:var(--text2);overflow:hidden;text-overflow:ellipsis;
  white-space:nowrap}
.tagh{margin-left:auto;font-size:10.5px;font-weight:700;color:var(--accent2);
  border:1px solid var(--accent2);border-radius:4px;padding:0 5px;flex:none}
.r2{display:flex;align-items:baseline;gap:6px;margin-top:3px;white-space:nowrap}
.r2 .k{font-size:11px;color:var(--th);font-weight:600}
.r2 b{font-weight:700;color:var(--text)}
.r2 .sep{color:var(--border-strong);margin:0 3px}
.r2 .flat{color:var(--text3)}
.dn{color:var(--down)} .upc{color:var(--up)}

/* ── 右側 ── */
.panel{background:var(--bg2);border:1px solid var(--border-strong);border-radius:10px;
  padding:14px 16px 10px}
.ptitle{display:flex;align-items:baseline;gap:9px;margin-bottom:2px}
.ptitle .cd{font-size:19px;font-weight:700}
.ptitle .nm{font-size:14px;color:var(--text2)}
.ptitle .sp{margin-left:auto;font-size:15px}
.ptitle .sp .k{font-size:12px;color:var(--th);font-weight:600;margin-right:5px}
.ptitle .sp b{font-weight:700;margin-right:12px}

.lg{display:flex;gap:18px;align-items:center;flex-wrap:wrap;margin:12px 0 0;padding-left:36px}
.lg i{display:flex;align-items:center;gap:6px;font-style:normal;font-size:12px;
  font-weight:700;white-space:nowrap}
.lg u{display:inline-block;width:20px;height:0;text-decoration:none;border-top-width:2.4px}
.u1{border-top-style:solid;border-top-color:var(--accent2)}
.u2{border-top-style:dashed;border-top-color:var(--sum)}
.u3{border-top-style:solid;border-top-color:var(--accent3)}

.ch{position:relative;margin:4px 0 0;padding:0 60px 0 36px}
.pa{position:relative}
.pa svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.hl{position:absolute;left:0;right:0;border-top:1px solid var(--border);opacity:.4}
.hl.h50{border-top-style:dashed;opacity:.85;border-color:var(--border-strong)}
.hl.h0{opacity:.9}
.yl{position:absolute;right:calc(100% + 7px);transform:translateY(50%);
  font-size:11px;color:var(--text3);white-space:nowrap}

.cv{fill:none;stroke-linecap:round;vector-effect:non-scaling-stroke}
.cvl{stroke:var(--accent2);stroke-width:3.4}
.cvl-d{stroke:color-mix(in srgb,var(--accent2) 42%,#0b1119);stroke-width:1.8}
.cvc{stroke:var(--sum);stroke-width:2.4;stroke-dasharray:5 3}
.cvc-d{stroke:color-mix(in srgb,var(--sum) 38%,#0b1119);stroke-width:1.4;stroke-dasharray:5 3}
.ar{fill:var(--accent2);opacity:.09;stroke:none}

.pt{position:absolute;width:8px;height:8px;border-radius:50%;
  transform:translate(-50%,50%);border:1.5px solid var(--bg2)}
.pt.ptk{width:11px;height:11px;border-width:2px}
.ptl{position:absolute;font-size:12.5px;font-weight:700;white-space:nowrap;line-height:13px;
  text-shadow:0 0 4px var(--bg2),0 0 3px var(--bg2),0 0 2px var(--bg2),0 0 1px var(--bg2)}
.ptl.lft{transform:translate(-100%,50%);padding-right:9px}
.ptl.rgt{transform:translate(0,50%);padding-left:9px}

.vl{position:absolute;bottom:0;width:0;border-left-width:2px;border-left-style:solid}
.vd{position:absolute;width:11px;height:11px;transform:translate(-50%,50%) rotate(45deg);
  border:1.5px solid var(--bg2)}
.vt{position:absolute;transform:translate(-50%,0);font-size:12.5px;font-weight:700;
  white-space:nowrap;text-align:center;line-height:1.3;
  text-shadow:0 0 4px var(--bg2),0 0 3px var(--bg2),0 0 2px var(--bg2),0 0 1px var(--bg2)}

.gp{margin-top:6px}
.gn{position:relative;height:20px}
.gn span{position:absolute;transform:translateX(-50%);top:4px;font-size:13px;
  font-weight:700;white-space:nowrap}
.tk{position:absolute;top:0;width:1px;height:4px;background:var(--border)}
.gb{position:relative;height:14px}
.gb em{position:absolute;top:3px;height:6px;border-left-width:1px;border-right-width:1px;
  border-top-width:1.5px;border-left-style:solid;border-right-style:solid;border-top-style:solid}
.gb b{position:absolute;top:0;left:0;font-size:11px;line-height:12px;font-weight:700;
  white-space:nowrap}
.c1{color:var(--accent2);border-color:var(--accent2)}
.c2{color:var(--sum);border-color:var(--sum)}

.foot{display:flex;gap:16px;flex-wrap:wrap;border-top:1px solid var(--border);
  margin-top:10px;padding-top:7px;font-size:13px;color:var(--text2)}
.foot b{color:var(--text);font-weight:700;margin-left:4px}
.note{font-size:11.5px;color:var(--note);line-height:1.85;margin:14px 0 0}
.note b{color:var(--accent2)}
</style>
</head>

var px = function (v) { return v == null ? '—' : v.toFixed(2); };

function cdf(zq, base, mid, sd) {
  if (!zq || !(base > 0) || mid == null || !(sd > 0)) return null;
  var n = zq.length - 1;
  return function (p) {
    var z = ((p / base - 1) * 100 - mid) / sd;
    if (z <= zq[0]) return 0;
    if (z >= zq[n]) return 100;
    for (var i = 1; i <= n; i++) {
      if (z <= zq[i]) {
        var w = zq[i] - zq[i - 1];
        return (i - 1 + (w > 0 ? (z - zq[i - 1]) / w : 0)) / n * 100;
      }
    }
    return 100;
  };
}
function tick(p) { return p < 10 ? 0.01 : (p < 50 ? 0.05 : (p < 100 ? 0.1 : 0.5)); }

function win(r) {
  var P = function (v) { return (v / r.b - 1) * 100; };
  var pad = Math.max(r.lh - r.ll, r.ch - r.cl) * 0.55;
  var a = [P(r.ll - pad), P(r.lh + pad), P(r.cl - pad), P(r.ch + pad), P(r.lp), P(r.cp)];
  if (r.live) a.push(P(r.live));
  if (r.liveLo) a.push(P(r.liveLo));
  return { mn: Math.min.apply(null, a), mx: Math.max.apply(null, a) };
}

  var P = function (v) { return (v / r.b - 1) * 100; };
  var w = win(r), LO = (w.mn + w.mx) / 2 - SPAN / 2;
  var X = function (p) { return Math.max(0, Math.min(100, (p - LO) / SPAN * 100)); };
  var XV = function (v) { return X(P(v)); };
  var fL = cdf(r.zl, r.b, r.lm, r.sl), fC = cdf(r.zc, r.b, r.cm, r.sc);
  var d = r.sp == null ? null : r.sp - r.b;
  var scls = d == null ? 'flat' : (d > 0 ? 'upc' : (d < 0 ? 'dn' : 'flat'));

  var M = [];
  if (r.live) M.push({ k: '現價', v: r.live, c: 'var(--accent3)' });
  if (r.liveLo) M.push({ k: '今低', v: r.liveLo, c: 'var(--sum)' });
  M.sort(function (a, b) { return XV(a.v) - XV(b.v); });
  var grp = [];
  M.forEach(function (m) {
    var g = grp[grp.length - 1];
    if (g && Math.abs(XV(m.v) - XV(g[0].v)) < 7) g.push(m); else grp.push([m]);
  });
  grp.forEach(function (g) {
    g.x = g.reduce(function (a, m) { return a + XV(m.v); }, 0) / g.length;
    g.f = fL ? fL(g[0].v) : 50;
    g.down = g.f > 80;
    // 標記那一塊字的上下緣（距離圖底的 px）。節點標價要拿它來判斷會不會撞上。
    g.y0 = g.f * PH / 100 + (g.down ? -(9 + 16 * g.length) : 9);
    g.y1 = g.y0 + 16 * g.length;
  });
  var mkX = M.map(function (m) { return XV(m.v); });
  var busy = function (x, dir) {
    return mkX.some(function (u) { return (u - x) * dir > -1.5 && Math.abs(u - x) < 9; });
  };

  var h = '<div class="ptitle"><span class="cd">' + r.c + '</span>'
    + '<span class="nm">' + r.nm + '</span>'
    + '<span class="sp"><span class="k">現價</span><b class="' + scls + '">'
    + px(r.sp) + '</b></span></div>';

  h += '<div class="lg"><i><u class="u1"></u><span style="color:var(--accent2)">掛買成交機率</span></i>'
    + '<i><u class="u2"></u><span style="color:var(--sum)">收盤跌破機率</span></i>'
    + (M.length ? '<i><u class="u3"></u><span style="color:var(--accent3)">現價</span></i>' : '')
    + '</div>';

  h += '<div class="ch"><div class="pa" style="height:' + PH + 'px">';
  [0, 25, 50, 75, 100].forEach(function (g) {
    h += '<div class="hl' + (g === 50 ? ' h50' : (g === 0 ? ' h0' : ''))
      + '" style="bottom:' + g + '%"></div><div class="yl" style="bottom:' + g + '%">' + g + '%</div>';
  });
  var path = function (fn, x0, x1) {
    var dd = '', N = 140;
    for (var i = 0; i <= N; i++) {
      var xs = x0 + (x1 - x0) * i / N, p = r.b * (1 + (LO + SPAN * xs) / 100);
      dd += (i ? 'L' : 'M') + (xs * 1000).toFixed(1) + ','
        + (100 - Math.max(0, Math.min(100, fn(p)))).toFixed(2);
    }
    return dd;
  };
  var seg = function (fn, a, b, cls) {
    var xa = XV(a) / 100, xb = XV(b) / 100;
    return '<path class="cv ' + cls + '-d" d="' + path(fn, 0, xa) + '"/>'
      + '<path class="cv ' + cls + '-d" d="' + path(fn, xb, 1) + '"/>'
      + '<path class="cv ' + cls + '" d="' + path(fn, xa, xb) + '"/>';
  };
  h += '<svg viewBox="0 0 1000 100" preserveAspectRatio="none">'
    + '<path class="ar" d="' + path(fL, 0, 1) + ' L1000,100 L0,100 Z"/>'
    + seg(fC, r.cl, r.ch, 'cvc') + seg(fL, r.ll, r.lh, 'cvl') + '</svg>';

  var nodes = [
    { p: r.ll, f: fL(r.ll), c: 'var(--accent2)' },
    { p: r.lp, f: fL(r.lp), c: 'var(--accent2)', key: 1 },
    { p: r.lh, f: fL(r.lh), c: 'var(--accent2)' },
    { p: r.cl, f: fC(r.cl), c: 'var(--sum)' },
    { p: r.ch, f: fC(r.ch), c: 'var(--sum)' }];
  nodes.forEach(function (nd) {
    nd.x = X(P(nd.p));
    nd.side = (nd.f < 50) ? -1 : 1;
    if (busy(nd.x, nd.side) && !busy(nd.x, -nd.side)) nd.side = -nd.side;
    nd.lift = (busy(nd.x, 1) && busy(nd.x, -1)) ? 15 : 0;
    nd.dup = M.some(function (m) { return Math.abs(m.v - nd.p) < tick(nd.p) * 0.5; });

  });
  nodes.slice().sort(function (a, b) { return a.f - b.f; }).forEach(function (nd, i, arr) {
    var pv = arr[i - 1];
    if (pv && Math.abs(nd.f - pv.f) < 11 && Math.abs(nd.x - pv.x) < 9 && nd.side === pv.side) {
      if (nd.x >= pv.x) { pv.side = -1; nd.side = 1; } else { pv.side = 1; nd.side = -1; }
    }
  });
  nodes.forEach(function (nd) {
    h += '<div class="pt' + (nd.key ? ' ptk' : '') + '" style="left:' + nd.x.toFixed(2)
      + '%;bottom:' + nd.f.toFixed(1) + '%;background:' + nd.c + '"></div>'
      + (nd.dup ? '' : '<div class="ptl ' + (nd.side < 0 ? 'lft' : 'rgt') + '" style="left:'
        + nd.x.toFixed(2) + '%;bottom:calc(' + nd.f.toFixed(1) + '% + ' + nd.lift + 'px);color:'
        + nd.c + '">' + px(nd.p) + '</div>');
  });
  grp.forEach(function (g) {
    h += '<div class="vl" style="left:' + g.x.toFixed(2) + '%;height:' + g.f.toFixed(1)
      + '%;border-left-color:' + g[0].c + '"></div>'
      + '<div class="vd" style="left:' + g.x.toFixed(2) + '%;bottom:' + g.f.toFixed(1)
      + '%;background:' + g[0].c + '"></div>'
      + '<div class="vt" style="left:' + g.x.toFixed(2) + '%;bottom:calc(' + g.f.toFixed(1) + '% '
      + (g.down ? '- ' + (9 + 16 * g.length) + 'px' : '+ 9px') + ')">'
      + g.map(function (m) { return '<span style="color:' + m.c + '">' + m.k + ' ' + px(m.v) + '</span>'; })
        .join('<br>') + '</div>';
  });
  h += '</div>';

  var bar = function (a, b, cls, lab) {
    var g = '<div class="gp"><div class="gn">';
    [a, b].forEach(function (v) {
      g += '<div class="tk" style="left:' + XV(v).toFixed(2) + '%"></div>'
        + '<span class="' + cls + '" style="left:' + XV(v).toFixed(2) + '%">' + px(v) + '</span>';
    });
    return g + '</div><div class="gb"><b class="' + cls + '">' + lab + '</b>'
      + '<em class="' + cls + '" style="left:' + XV(a).toFixed(2) + '%;width:'
      + (XV(b) - XV(a)).toFixed(2) + '%"></em></div></div>';
  };
  h += bar(r.ll, r.lh, 'c1', '掛買區間') + bar(r.cl, r.ch, 'c2', '收盤區間') + '</div>';

  h += '<div class="foot"><span>前收<b>' + px(r.b) + '</b></span>'
    + '<span>成本<b>' + px(r.co) + '</b></span>'
    + '<span>量能<b>' + r.vx.toFixed(2) + ' 倍</b></span>'
    + '<span>說明力<b>' + r.r2.toFixed(2) + '</b></span>'
    + '<span>樣本<b>' + r.n + ' 天</b></span>'
    + '<span>估收<b>' + px(r.cp) + '</b></span></div>';
  return h;
}

// ── 畫完之後量一次，真的疊到才拿掉 ──
//
// 字框的高度跟著字型與行高跑，用公式推永遠會差幾個像素，而差幾個像素就是疊到。
// 一次只畫一張圖，量一次的成本可以忽略。
// 拿掉的是節點的價，不是標記：標記講的是「現在在哪」，它比區間端點急；
// 而端點的價在下方那條 Bar 上還看得到，拿掉不會讓資訊消失。
function fixLabels(root) {
  var mk = [].slice.call(root.querySelectorAll('.vt')).map(function (e) { return e.getBoundingClientRect(); });
  [].slice.call(root.querySelectorAll('.ptl')).forEach(function (e) {
    var a = e.getBoundingClientRect();
    if (mk.some(function (b) {
      return a.left < b.right + 2 && b.left - 2 < a.right && a.top < b.bottom + 2 && b.top - 2 < a.bottom;
    })) { e.style.display = 'none'; }
  });
}

var SORTS = [
  { k: 'lp', t: '掛買參考' }, { k: 'width', t: '區間寬度' },
  { k: 'vx', t: '量能' }, { k: 'fi', t: '成交機率' },
  { k: 'r2', t: '說明力' }, { k: 'c', t: '代號' }];
var sk = 'lp', sel = DATA[0].c, live = false;

function sortVal(r, k) {
  if (k === 'c') return r.c;
  if (k === 'lp') return (r.lp / r.b - 1) * 100;
  if (k === 'width') return (r.ch - r.cl) / r.b * 100;
  return r[k];
}
function draw() {
  DATA.forEach(function (r) {
    r.live = live ? r.b * 0.996 : null;
    r.liveLo = live ? r.ll * 1.004 : null;
  });
  var rows = DATA.slice().sort(function (a, b) {
    if (a.hd !== b.hd) return b.hd - a.hd;
    var x = sortVal(a, sk), y = sortVal(b, sk);
    if (sk === 'c') return x < y ? -1 : (x > y ? 1 : 0);
    return y - x;
  });
  document.getElementById('side').innerHTML =
    rows.map(function (r) { return rowHtml(r, r.c === sel); }).join('');
  var r = DATA.filter(function (x) { return x.c === sel; })[0];
  var SPAN = axis(r);
  document.getElementById('panel').innerHTML = panelHtml(r, SPAN);
  fixLabels(document.getElementById('panel'));
  document.getElementById('sorts').innerHTML = SORTS.map(function (s) {
    return '<button class="sb' + (sk === s.k ? ' on' : '') + '" data-k="' + s.k + '">'
      + s.t + '</button>';
  }).join(' ');
  document.getElementById('mk').className = 'sb' + (live ? ' on' : '');
  document.getElementById('note').innerHTML =
    '<b>怎麼看</b>：橫軸是價位，縱軸是機率。金線是掛買成交機率，'
    + '定義為限價委買掛在某一價位時，當日最低價觸及該價位的機率。'
    + '價位越低越不容易觸及，所以金線由左下往右上遞增。'
    + '金線上兩個空心點是掛買區間的上下緣，實心那顆是掛買參考，與圖下金色 Bar 的兩端同一組價位。'
    + '青色虛線是收盤跌破機率，50% 所在的價位就是估收。'
    + '<br>橫軸寬度這一檔是 ' + SPAN + ' 個百分點，每一檔各自算，所以每張圖都鋪滿版面；'
    + '代價是換檔之後長度不能直接互比，要看數字。';
}
document.addEventListener('click', function (e) {
  var b = e.target.closest('button');
  if (!b) return;
  if (b.id === 'mk') { live = !live; draw(); return; }
  if (b.dataset.k) { sk = b.dataset.k; draw(); return; }
  if (b.dataset.c) { sel = b.dataset.c; draw(); }
});
draw();
</script>
</body>
