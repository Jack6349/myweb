// 儲存後靜默檢查後段衝突，有衝突則顯示警示
function checkNextSegmentConflict(stopIdx, d) {
  if (!d || stopIdx === null) return;
  var stops = d.stops || [];
  var stop = stops[stopIdx];
  if (!stop || !stop.transit) return;

  var planned = (stop.transit.routes || []).find(function(r){ return r.tag === 'planned'; });
  if (!planned || !planned.arriveTime) return;

  var arrTime = planned.arriveTime;
  var nextStop = stops[stopIdx + 1];
  if (!nextStop || !nextStop.transit) return;

  var nextPlanned = (nextStop.transit.routes || []).find(function(r){ return r.tag === 'planned'; });
  if (!nextPlanned || !nextPlanned.departTime) return;

  var legs = nextPlanned.legs || [];
  var nextMode = legs.length ? legs[0].mode : '';
  var isCustom = ['walk','shuttle','car','taxi'].indexOf(nextMode) >= 0;
  if (isCustom) return; // 自訂交通不警示

  var arrM = timeToMins(arrTime);
  var depM = timeToMins(nextPlanned.departTime);
  if (arrM === null || depM === null) return;
  var gap = depM - arrM;
  if (gap < -120) gap += 1440;

  if (gap < 0) {
    showScheduleWarning(stopIdx, arrTime, nextStop.name, nextPlanned.departTime, '衝突');
  } else if (gap < _scheduleTransferMins) {
    showScheduleWarning(stopIdx, arrTime, nextStop.name, nextPlanned.departTime, '時間緊迫');
  }
}

// 顯示排程衝突警示（在時間軸下方）
function showScheduleWarning(stopIdx, arrTime, nextStopName, nextDepTime, type) {
  var existing = document.getElementById('schedule-warning-banner');
  if (existing) existing.remove();
  var msg = type === '衝突'
    ? '⚠️ 班次衝突：抵達 ' + arrTime + '，但「' + nextStopName + '」' + nextDepTime + ' 出發，時間不足'
    : '⚠️ 換乘時間緊迫：抵達 ' + arrTime + '，下段 ' + nextDepTime + ' 出發';
  var el = document.createElement('div');
  el.id = 'schedule-warning-banner';
  el.style.cssText = 'position:fixed;bottom:0;left:0;right:0;background:rgba(232,184,75,.15);border-top:1px solid rgba(232,184,75,.4);padding:10px 16px;z-index:100;display:flex;align-items:center;justify-content:space-between;gap:8px';
  el.innerHTML = '<span style="font-size:12px;color:#e8b84b;flex:1">' + msg + '</span>' +
    '<button onclick="openScheduleCheck(' + stopIdx + ')" style="font-size:12px;padding:5px 10px;background:rgba(232,184,75,.2);border:1px solid rgba(232,184,75,.4);border-radius:6px;color:#e8b84b;cursor:pointer;white-space:nowrap">🔄 檢查排程</button>' +
    '<button onclick="this.parentElement.remove()" style="background:none;border:none;color:#c8b89a;cursor:pointer;font-size:16px">✕</button>';
  appRoot().appendChild(el);
  // 10秒後自動消失
  setTimeout(function(){ if(el.parentElement) el.remove(); }, 10000);
}

// 手動觸發完整排程檢查
function openScheduleCheck(stopIdx) {
  var existing = document.getElementById('schedule-warning-banner');
  if (existing) existing.remove();
  var savedStopIdx = S.stopIdx;
  var d = day();
  if (!d) return;
  var stop = (d.stops || [])[stopIdx];
  if (!stop || !stop.transit) {
    alert('此站點無交通方案，無法執行排程檢查');
    return;
  }
  var planned = (stop.transit.routes || []).find(function(r){ return r.tag === 'planned'; });
  if (!planned) {
    alert('此站點無預定交通方案，請先設定預定班次');
    return;
  }

  // 若在地點編輯頁（尚未儲存），從 DOM time picker 讀取最新值覆蓋
  var riIdx = (stop.transit.routes || []).indexOf(planned);
  var depDomEl = document.getElementById('tp-v-srd-' + riIdx + '-dep');
  var arrDomEl = document.getElementById('tp-v-srd-' + riIdx + '-arr');
  var depTime = (depDomEl && depDomEl.value) ? depDomEl.value : planned.departTime || '';
  var arrTime = (arrDomEl && arrDomEl.value) ? arrDomEl.value : planned.arriveTime || '';

  var fakeTb = {
    from: stop.transit.fromPlace || stop.name || '',
    to: stop.transit.toPlace || '',
    departTime: depTime,
    arriveTime: arrTime,
    duration: planned.duration || 0,
    transfers: planned.transfers || 0,
    legs: planned.legs || []
  };
  var result = runAutoSchedule(stopIdx, fakeTb);
  showSchedulePreview(stopIdx, fakeTb, result);
}

// ════ 自動排程 ════

var _scheduleResult = null; // 排程結果暫存
var _scheduleTransferMins = 10; // 換乘緩衝（分鐘）

// 時間字串 HH:MM 轉分鐘數
function timeToMins(t) {
  if (!t) return null;
  var p = t.split(':');
  return parseInt(p[0]) * 60 + parseInt(p[1]);
}

// 分鐘數轉 HH:MM
function minsToTime(m) {
  if (m === null || m === undefined) return '';
  m = ((m % 1440) + 1440) % 1440; // 處理跨日
  return String(Math.floor(m/60)).padStart(2,'0') + ':' + String(m%60).padStart(2,'0');
}

// 模糊比對地點名稱與班次起訖站
function fuzzyMatch(stopName, timetableName) {
  if (!stopName || !timetableName) return false;
  var a = stopName.trim(), b = timetableName.trim();
  if (a === b) return true;
  // 取較短者做包含比對
  if (a.length <= b.length) return b.includes(a);
  return a.includes(b);
}

// 從班次庫搜尋可銜接的最早班次（同時搜尋 t.timetables 和站點 routes 候補）
function findNextTimetable(fromStop, toStop, afterTime, dayDate, stopRoutes) {
  var t = trip(); if (!t) return null;
  var afterMins = timeToMins(afterTime) + _scheduleTransferMins;


  // 從 t.timetables 搜尋（fare:-1 僅影響顯示列表，不影響排程搜尋）
  var tbCandidates = (t.timetables || []).filter(function(tb) {
    if (tb.date && tb.date !== dayDate) return false;
    if (!fuzzyMatch(fromStop, tb.from)) return false;
    if (!fuzzyMatch(toStop, tb.to)) return false;
    var depMins = timeToMins(tb.departTime);
    if (depMins === null) return false;
    return depMins >= afterMins;
  });

  // 從站點 routes 候補搜尋（backup / planned 均納入）
  var routeCandidates = (stopRoutes || []).filter(function(r) {
    var depMins = timeToMins(r.departTime);
    if (depMins === null) return false;
    return depMins >= afterMins;
  }).map(function(r) {
    // 轉成 timetable 格式
    return {
      from: fromStop,
      to: toStop,
      departTime: r.departTime,
      arriveTime: r.arriveTime,
      duration: r.duration || 0,
      trainName: (r.legs && r.legs[0] ? r.legs[0].line || '' : ''),
      legs: r.legs || [],
      _fromRoute: r  // 保留原始 route 參照
    };
  });

  var allCandidates = tbCandidates.concat(routeCandidates);
  if (!allCandidates.length) return null;
  allCandidates.sort(function(a, b) {
    return timeToMins(a.departTime) - timeToMins(b.departTime);
  });
  return allCandidates[0];
}

// 執行自動排程
function runAutoSchedule(changedStopIdx, newTimetable) {
  var t = trip();
  var d = day();
  if (!t || !d) return null;

  var stops = d.stops || [];
  var dayDate = '';
  var dd = new Date(t.startDate);
  dd.setDate(dd.getDate() + S.dayIdx);
  dayDate = dd.getFullYear() + '-' + String(dd.getMonth()+1).padStart(2,'0') + '-' + String(dd.getDate()).padStart(2,'0');

  var results = []; // 每段的調整結果
  var warnings = []; // 警告
  var errors = []; // 無法銜接
  var currentArrTime = newTimetable.arriveTime; // 從新班次的抵達時間開始

  // 從 changedStopIdx+1 開始往後遞推
  for (var i = changedStopIdx + 1; i < stops.length; i++) {
    var stop = stops[i];
    var transit = stop.transit;
    if (!transit || !transit.routes || !transit.routes.length) continue;

    var planned = transit.routes.find(function(r){ return r.tag === 'planned'; });
    if (!planned) continue;

    // 遇到錨點：三段式判斷後停止
    if (stop.anchor) {
      var anchorDepTime = planned.departTime || (stop.hotel && stop.hotel.checkIn);
      if (anchorDepTime && currentArrTime) {
        var arrMins   = timeToMins(currentArrTime);
        var anchorMins = timeToMins(anchorDepTime);
        var gapToAnchor = anchorMins - arrMins;
        if (arrMins > anchorMins) {
          // 狀況 3：抵達時間超過錨點出發 → 衝突，阻止套用
          errors.push({
            type: 'anchor',
            stopName: stop.name,
            message: '抵達「' + stop.name + '」預計 ' + currentArrTime + '，已超過錨點出發時間（' + anchorDepTime + '），無法銜接'
          });
        } else if (gapToAnchor < _scheduleTransferMins) {
          // 狀況 2：緩衝時間不足（抵達趕得上但換乘緊張）→ 警告
          warnings.push({
            type: 'anchor_buffer',
            stopName: stop.name,
            message: '抵達「' + stop.name + '」預計 ' + currentArrTime + '，距離錨點出發（' + anchorDepTime + '）僅剩 ' + gapToAnchor + ' 分鐘，換乘緩衝不足'
          });
        }
        // 狀況 1：時間充裕 → 無動作，直接 break
      }
      break; // 錨點後停止調整
    }

    // 判斷交通類型
    var legs = planned.legs || [];
    var legMode = legs.length ? legs[0].mode : '';
    // legMode 為空字串視為手動自訂交通，歸類為自訂
    var isCustom = !legMode || ['walk','shuttle','car','taxi','car','自訂'].indexOf(legMode) >= 0;
    var isFlight = legMode === 'flight';
    // 已有 legs 且有 line_name 的視為班次型（從班次匯入）
    if (legs.length && legs[0].line_name) isCustom = false;

    if (isCustom) {
      // 自訂交通：出發 = 前站抵達 + 換乘緩衝，保持原路程時長
      var origDep = timeToMins(planned.departTime);
      var origArr = timeToMins(planned.arriveTime);
      var duration = (origDep !== null && origArr !== null) ? (origArr - origDep) : 0;
      var newDepMins = timeToMins(currentArrTime) + _scheduleTransferMins;
      var newArrMins = newDepMins + duration;
      var newDep = minsToTime(newDepMins);
      var newArr = minsToTime(newArrMins);
      // 時間未實際變動時不加入結果
      if (newDep === planned.departTime && newArr === planned.arriveTime) {
        currentArrTime = planned.arriveTime;
      } else {
        results.push({
          stopIdx: i,
          type: 'custom',
          stop: stop,
          oldDep: planned.departTime,
          oldArr: planned.arriveTime,
          newDep: newDep,
          newArr: newArr,
          planned: planned
        });
        currentArrTime = newArr;
      }
    } else if (isFlight) {
      // 航班：不自動調整，只提示
      warnings.push({
        stopIdx: i,
        stopName: stop.name,
        message: '「' + stop.name + '」的航班時間需手動確認'
      });
      currentArrTime = planned.arriveTime;
    } else {
      // 班次型：搜尋可銜接班次
      var prevStop = stops[i - 1];
      var fromName = transit.fromPlace || (prevStop ? prevStop.name : '');
      var toName = transit.toPlace || stop.name;
      var found = findNextTimetable(fromName, toName, currentArrTime, dayDate, transit.routes);

      if (!found) {
        // 班次表中也沒有 → 真正無班次
        var needAfterMins = timeToMins(currentArrTime);
        var needAfter = needAfterMins !== null ? minsToTime(needAfterMins + _scheduleTransferMins) : '';
        var curArrValid = currentArrTime && needAfterMins !== null;
        errors.push({
          type: 'notfound',
          stopIdx: i,
          fromName: fromName,
          toName: toName,
          afterTime: needAfter,
          message: curArrValid
            ? '「' + fromName + ' → ' + toName + '」在 ' + needAfter + ' 後無可銜接班次，請匯入更多班次或手動調整'
            : '「' + fromName + ' → ' + toName + '」無法計算換乘時間，請確認前一段交通的抵達時間已設定'
        });
        break;
      }

      // 檢查找到的班次是否已在站點的 routes 候補中
      var foundInRoutes = !!(found._fromRoute) || !!(transit.routes.find(function(r) {
        return r.departTime === found.departTime && r.arriveTime === found.arriveTime;
      }));

      if (found.departTime === planned.departTime && found.arriveTime === planned.arriveTime) {
        // 找到的就是現有 planned，時間吻合，直接沿用
        currentArrTime = planned.arriveTime;
      } else if (foundInRoutes) {
        // 找到的班次已在候補中 → 只需切換為預定，不需建子行程
        results.push({
          stopIdx: i,
          type: 'timetable',
          stop: stop,
          oldDep: planned.departTime,
          oldArr: planned.arriveTime,
          oldTimetable: planned,
          newTimetable: found,
          newDep: found.departTime,
          newArr: found.arriveTime,
          foundInRoutes: true, // 標記：不需建子行程
          planned: planned
        });
        currentArrTime = found.arriveTime;
      } else {
        // 找到的班次不在候補中 → 需從班次表引入
        // 計算停留時間
        var layoverMins = timeToMins(found.departTime) - timeToMins(currentArrTime);
        if (layoverMins > 60) {
          warnings.push({
            stopIdx: i,
            stopName: fromName,
            layoverMins: layoverMins,
            message: '「' + fromName + '」停留 ' + Math.floor(layoverMins/60) + '小時' + (layoverMins%60) + '分，超過1小時，請確認是否合適'
          });
        }
        results.push({
          stopIdx: i,
          type: 'timetable',
          stop: stop,
          oldDep: planned.departTime,
          oldArr: planned.arriveTime,
          oldTimetable: planned,
          newTimetable: found,
          newDep: found.departTime,
          newArr: found.arriveTime,
          foundInRoutes: false,
          planned: planned
        });
        currentArrTime = found.arriveTime;
      }
    }
  }

  return { results: results, warnings: warnings, errors: errors };
}

// 顯示排程預覽畫面
function showSchedulePreview(changedStopIdx, newTimetable, scheduleData) {
  var results = scheduleData.results;
  var warnings = scheduleData.warnings;
  var errors = scheduleData.errors;

  var html = '<div style="position:'+ovPos()+';inset:0;background:rgba(0,0,0,.7);z-index:9999;display:flex;align-items:flex-end">' +
    '<div style="width:100%;max-height:85vh;background:var(--bg2);border-radius:16px 16px 0 0;overflow-y:auto">' +
    '<div style="padding:16px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center">' +
    '<div style="font-size:15px;font-weight:700;color:#e0d4c0">🔄 排程預覽</div>' +
    '<button onclick="document.getElementById(\'schedule-preview\').remove()" style="background:none;border:none;color:#c8b89a;font-size:20px;cursor:pointer">✕</button>' +
    '</div>' +
    '<div style="padding:12px 16px">';

  // 變更的班次
  html += '<div style="font-size:12px;font-weight:700;color:#6ec6f0;margin-bottom:8px">變更班次</div>';
  html += '<div style="background:var(--bg3);border-radius:8px;padding:10px 12px;margin-bottom:12px;font-size:13px;color:#e0d4c0">' +
    newTimetable.from + ' → ' + newTimetable.to + '<br>' +
    '<span style="color:#6ec6f0;font-weight:700">' + newTimetable.departTime + ' → ' + newTimetable.arriveTime + '</span>' +
    '</div>';

  // 調整結果
  if (results.length) {
    html += '<div style="font-size:12px;font-weight:700;color:#6ec6f0;margin-bottom:8px">後續調整</div>';
    results.forEach(function(r) {
      var isWarn = scheduleData.warnings.some(function(w){ return w.stopIdx === r.stopIdx; });
      var badge = '';
      if (r.type === 'timetable') {
        if (r.foundInRoutes) {
          badge = '<span style="font-size:10px;padding:1px 5px;border-radius:4px;background:rgba(110,198,240,.15);color:#6ec6f0;border:1px solid rgba(110,198,240,.3);margin-left:4px">候補切換</span>';
        } else {
          badge = '<span style="font-size:10px;padding:1px 5px;border-radius:4px;background:rgba(232,184,75,.15);color:#e8b84b;border:1px solid rgba(232,184,75,.3);margin-left:4px">從班次表引入</span>';
        }
      }
      html += '<div style="background:var(--bg3);border-radius:8px;padding:10px 12px;margin-bottom:6px">' +
        '<div style="font-size:12px;color:#c8b89a;margin-bottom:4px;display:flex;align-items:center">' + esc(r.stop.name) + badge + '</div>' +
        '<div style="display:flex;gap:8px;align-items:center;font-size:13px">' +
        '<span style="color:#c8b89a;text-decoration:line-through">' + (r.oldDep||'') + ' → ' + (r.oldArr||'') + '</span>' +
        '<span style="color:#c8b89a">→</span>' +
        '<span style="color:#7bed9f;font-weight:700">' + r.newDep + ' → ' + r.newArr + '</span>' +
        (isWarn ? ' <span style="color:#e8b84b">⚠️</span>' : '') +
        '</div>' +
        (r.type==='timetable' ? '<div style="font-size:11px;color:#c8b89a;margin-top:2px">' + esc(r.newTimetable.trainName||'') + '</div>' : '') +
        '</div>';
    });
  }

  // 警告
  if (warnings.length) {
    html += '<div style="font-size:12px;font-weight:700;color:#e8b84b;margin:8px 0">⚠️ 警告</div>';
    warnings.forEach(function(w) {
      var isAnchorWarn = w.type === 'anchor_buffer';
      var bg  = isAnchorWarn ? 'rgba(255,140,0,.15)' : 'rgba(232,184,75,.1)';
      var bdr = isAnchorWarn ? 'rgba(255,140,0,.4)'  : 'rgba(232,184,75,.3)';
      var col = isAnchorWarn ? '#ff8c00'              : '#e8b84b';
      var icon = isAnchorWarn ? '⚠️ ' : '';
      html += '<div style="background:' + bg + ';border:1px solid ' + bdr + ';border-radius:8px;padding:8px 12px;margin-bottom:6px;font-size:12px;color:' + col + '">' + icon + w.message + '</div>';
    });
  }

  // 錯誤
  if (errors.length) {
    html += '<div style="font-size:12px;font-weight:700;color:#ff6b6b;margin:8px 0">⛔ 無法銜接</div>';
    errors.forEach(function(e) {
      html += '<div style="background:rgba(255,107,107,.1);border:1px solid rgba(255,107,107,.3);border-radius:8px;padding:8px 12px;margin-bottom:6px;font-size:12px;color:#ff6b6b">' + e.message + '</div>';
    });
  }

  // 換乘緩衝設定
  html += '<div style="display:flex;align-items:center;gap:8px;margin:12px 0;font-size:12px;color:#c8b89a">' +
    '換乘緩衝：<input type="number" id="transfer-mins-input" value="' + _scheduleTransferMins + '" min="0" max="60" style="width:50px;padding:4px 8px;background:var(--bg3);border:1px solid var(--border2);border-radius:6px;color:#e0d4c0;text-align:center"> 分鐘' +
    '<button onclick="rerunSchedule(' + changedStopIdx + ')" style="padding:4px 10px;background:rgba(110,198,240,.15);border:1px solid rgba(110,198,240,.3);border-radius:6px;color:#6ec6f0;font-size:12px;cursor:pointer">重新計算</button>' +
    '</div>';

  // 操作按鈕
  html += '<div style="display:flex;gap:8px;padding-bottom:20px">';
  var tbChangeCount = results.filter(function(r){ return r.type === 'timetable' && !r.foundInRoutes; }).length;
  var hasErrors = errors.length > 0;
  if (hasErrors) {
    // 有衝突錯誤時不可套用
    html += '<button disabled style="flex:1;padding:12px;background:rgba(255,107,107,.1);border:1px solid rgba(255,107,107,.3);border-radius:8px;color:#ff6b6b;font-size:14px;font-weight:700;cursor:not-allowed;opacity:.6">⛔ 無法套用</button>';
  } else if (tbChangeCount >= 2) {
    html += '<button onclick="applySchedule(' + changedStopIdx + ', true)" style="flex:1;padding:12px;background:rgba(123,237,159,.2);border:1px solid rgba(123,237,159,.4);border-radius:8px;color:#7bed9f;font-size:14px;font-weight:700;cursor:pointer">✅ 套用並儲存為子行程</button>';
    html += '<button onclick="applySchedule(' + changedStopIdx + ', false)" style="padding:12px 16px;background:rgba(110,198,240,.1);border:1px solid rgba(110,198,240,.3);border-radius:8px;color:#6ec6f0;font-size:14px;cursor:pointer">僅套用</button>';
  } else {
    html += '<button onclick="applySchedule(' + changedStopIdx + ', false)" style="flex:1;padding:12px;background:rgba(123,237,159,.2);border:1px solid rgba(123,237,159,.4);border-radius:8px;color:#7bed9f;font-size:14px;font-weight:700;cursor:pointer">✅ 套用</button>';
  }
  html += '<button onclick="document.getElementById(\'schedule-preview\').remove()" style="padding:12px 16px;background:none;border:1px solid var(--border2);border-radius:8px;color:#c8b89a;font-size:14px;cursor:pointer">放棄</button>';
  html += '</div>';

  html += '</div></div></div>';

  var el = document.createElement('div');
  el.id = 'schedule-preview';
  el.innerHTML = html;
  appRoot().appendChild(el);

  // 儲存排程資料供套用使用
  _scheduleResult = { changedStopIdx: changedStopIdx, newTimetable: newTimetable, data: scheduleData };
}

// 重新計算（換乘緩衝變更後）
function rerunSchedule(changedStopIdx) {
  var input = document.getElementById('transfer-mins-input');
  if (input) _scheduleTransferMins = parseInt(input.value) || 10;
  if (_scheduleResult) {
    var newData = runAutoSchedule(_scheduleResult.changedStopIdx, _scheduleResult.newTimetable);
    document.getElementById('schedule-preview').remove();
    showSchedulePreview(_scheduleResult.changedStopIdx, _scheduleResult.newTimetable, newData);
  }
}

// 套用排程並建立子行程
function applySchedule(changedStopIdx, withSubTrip) {
  if (!_scheduleResult) return;
  var results = _scheduleResult.data.results;
  var d = day();
  if (!d) return;

  // ≥ 2 站班次型（從班次表引入）調整才需建子行程
  var tbChangeCount = results.filter(function(r){ return r.type === 'timetable' && !r.foundInRoutes; }).length;
  var sub = (tbChangeCount >= 2 && withSubTrip !== false) ? createSubTrip(S.dayIdx) : null;

  // 套用到母行程
  // 第一段：直接套用新班次
  var firstStop = d.stops[changedStopIdx];
  if (firstStop && firstStop.transit) {
    var oldPlanned = firstStop.transit.routes.find(function(r){ return r.tag==='planned'; });
    if (oldPlanned) {
      var nt = _scheduleResult.newTimetable;
      // 若新班次和現有 planned 完全相同，不需要重複新增
      var isDuplicate = (oldPlanned.departTime === nt.departTime && oldPlanned.arriveTime === nt.arriveTime);
      if (!isDuplicate) {
        // 原預定降為候補
        oldPlanned.tag = 'backup';
        // 以新班次建立新的預定（使用共用轉換函式，確保 leg 格式正確）
        var newRoute = timetableToRoute(nt, 'planned');
        newRoute.id = uid();
        // 重新排序：新預定在最前
        firstStop.transit.routes = firstStop.transit.routes.filter(function(r){ return r.tag!=='planned'; });
        firstStop.transit.routes.unshift(newRoute);
      }
    }
  }

  // 後續各段套用
  results.forEach(function(r) {
    var stop = d.stops[r.stopIdx];
    if (!stop || !stop.transit) return;
    var planned = stop.transit.routes.find(function(rt){ return rt.tag==='planned'; });
    if (!planned) return;

    if (r.type === 'custom') {
      // 自訂交通：更新時間
      planned.departTime = r.newDep;
      planned.arriveTime = r.newArr;
      if (planned.legs && planned.legs.length) {
        planned.legs[0].departTime = r.newDep;
        planned.legs[0].arriveTime = r.newArr;
      }
    } else if (r.type === 'timetable') {
      // 班次型：若新班次和現有 planned 不同才替換
      var nt2 = r.newTimetable;
      var isSame = (planned.departTime === nt2.departTime && planned.arriveTime === nt2.arriveTime);
      if (!isSame) {
        planned.tag = 'backup';
        var newRoute2 = timetableToRoute(nt2, 'planned');
        newRoute2.id = uid();
        stop.transit.routes = stop.transit.routes.filter(function(rt){ return rt.tag!=='planned'; });
        stop.transit.routes.unshift(newRoute2);
      }
    }
  });

  save(S.trips);
  _scheduleResult = null;
  document.getElementById('schedule-preview').remove();
  renderDayTL();
  if (sub) {
    renderList();
    alert('排程已套用！子行程「' + sub.name + '」已建立，可在行程列表查看。');
  } else {
    alert('排程已套用！');
  }
}

// ════ 子行程功能 ════

// 建立子行程（從當日行程產生）
function createSubTrip(dayIdx) {
  var t = trip(); if(!t) return;
  if(t.isSubTrip) { alert('子行程不可再產生子行程'); return; }
  var d = t.days[dayIdx]; if(!d) return;
  // 計算子行程編號
  var siblings = S.trips.filter(function(st){
    return st.isSubTrip && st.parentTripId===t.id && st.subDayIdx===dayIdx;
  });
  var seq = siblings.length + 1;
  // 計算日期
  var dd = new Date(t.startDate);
  dd.setDate(dd.getDate() + dayIdx);
  var dateStr = dd.getFullYear()+'-'+String(dd.getMonth()+1).padStart(2,'0')+'-'+String(dd.getDate()).padStart(2,'0');
  // 深拷貝當日資料
  var dayClone = JSON.parse(JSON.stringify(d));
  var subName = t.name + '-D' + (dayIdx+1) + '-' + seq;
  var subTrip = {
    id: uid(),
    name: subName,
    isSubTrip: true,
    parentTripId: t.id,
    subDayIdx: dayIdx,
    startDate: dateStr,
    endDate: dateStr,
    currencies: (t.currencies||['TWD','JPY']).slice(),
    members: JSON.parse(JSON.stringify(t.members||[])),
    expenses: [],
    days: [dayClone],
    createdAt: new Date().toISOString()
  };
  S.trips.push(subTrip);
  save(S.trips);
  return subTrip;
}

// 覆蓋：對調母行程指定天 ←→ 子行程的那一天
function swapSubTrip(subId) {
  var subTrip = S.trips.find(function(t){ return t.id===subId; });
  if(!subTrip||!subTrip.isSubTrip) return;
  var parent = S.trips.find(function(t){ return t.id===subTrip.parentTripId; });
  if(!parent) { alert('找不到母行程'); return; }
  var dayIdx = subTrip.subDayIdx;
  if(!confirm('將「'+subTrip.name+'」覆蓋母行程 D'+(dayIdx+1)+'？\n（兩者行程資料將互相對調，可再次覆蓋還原）')) return;
  // 對調（費用和代辦一起對調）
  var parentDay = JSON.parse(JSON.stringify(parent.days[dayIdx]));
  var subDay = JSON.parse(JSON.stringify(subTrip.days[0]));
  parent.days[dayIdx] = subDay;
  subTrip.days[0] = parentDay;
  // 子行程名稱更新（標示已覆蓋狀態）
  save(S.trips);
  renderList();
  alert('覆蓋完成！原 D'+(dayIdx+1)+'已保存在「'+subTrip.name+'」中。');
}

// 刪除子行程
function deleteSubTrip(subId) {
  var subTrip = S.trips.find(function(t){ return t.id===subId; });
  if(!subTrip) return;
  if(!confirm('刪除「'+subTrip.name+'」？此操作無法復原。')) return;
  S.trips = S.trips.filter(function(t){ return t.id!==subId; });
  save(S.trips);
  renderList();
}

function saveStop(){

  var _oldStopName = S.stopIdx !== null ? ((d.stops||[])[S.stopIdx]||{}).name || '' : '';

    id:(S.stopIdx!==null?(d.stops||[])[S.stopIdx]||{id:uid()}:{id:uid()}).id,
    type:type, name:name,
    anchor:!!(document.getElementById('sf-anchor')||{checked:false}).checked,

      amount:parseFloat((document.getElementById('sf-hamount')||{value:'0'}).value)||0,

      meal:(document.getElementById('sf-hmeal')||{value:''}).value.trim(),
      phone:(document.getElementById('sf-hphone')||{value:''}).value.trim(),
      address:(document.getElementById('sf-haddr')||{value:''}).value.trim(),
      payMethod:(document.getElementById('sf-hpaymethod')||{value:''}).value,
      payerId:(document.getElementById('sf-hpayer')||{value:''}).value,
      importFare:(document.getElementById('sf-himport')||{checked:false}).checked,
    };
  }
  if(type==='airport'){

      terminal:(document.getElementById('sf-terminal')||{value:''}).value.trim(),

  // Save transit
  var fromEl=document.getElementById('sf-transit-from');

  if(fromEl&&toEl){
    var existingStop=S.stopIdx!==null?(d.stops||[])[S.stopIdx]:null;

    // Sync time picker values back to routes
    var routes=existingTransit?existingTransit.routes||[]:[];
    // Airport: use direct flight time inputs
    var flightDepEl=document.getElementById('tp-v-sf-flight-dep');
    var flightArrEl=document.getElementById('tp-v-sf-flight-arr');
    if(flightDepEl||flightArrEl){
      // Airport mode - create/update single route
      var flightDep=flightDepEl?flightDepEl.value:'';
      var flightArr=flightArrEl?flightArrEl.value:'';
      var existAirport=routes[0];
      var airlineVal=(document.getElementById('sf-airline')||{value:''}).value.trim();
      var flightNoVal=(document.getElementById('sf-flight')||{value:''}).value.trim();
      // Read fare/duration/importFare from DOM (route index 0)
      var fareEl0=document.getElementById('srd-fare-0');
      var fareCurEl0=document.getElementById('srd-farecur-0');
      var importEl0=document.getElementById('srd-import-0');
      // Auto-calc duration from flight dep/arr
      var calcDur=existAirport?existAirport.duration||0:0;
      if(flightDep&&flightArr){
        var dp=flightDep.split(':'),ap=flightArr.split(':');
        var dm=parseInt(dp[0])*60+parseInt(dp[1]),am=parseInt(ap[0])*60+parseInt(ap[1]);
        var dd=am-dm; if(dd<0)dd+=1440; calcDur=dd;
      }
      routes=[{
        id:existAirport?existAirport.id:uid(),
        tag:'planned',
        departTime:flightDep,
        arriveTime:flightArr,
        duration:calcDur,transfers:0,
        fare:fareEl0?parseFloat(fareEl0.value)||0:(existAirport?existAirport.fare||0:0),
        fareCurrency:fareCurEl0?fareCurEl0.value:(existAirport?existAirport.fareCurrency||'TWD':'TWD'),
        importFare:importEl0?importEl0.checked:(existAirport?existAirport.importFare||false:false),
        payMethod:(function(){var el=document.getElementById('srd-paymethod-0');return el?el.value:(existAirport?existAirport.payMethod||'':'');})(),
        legs:[{mode:'flight',fromStop:fromEl.value,toStop:toEl.value,
          departTime:flightDep,arriveTime:flightArr,
          line:airlineVal+(flightNoVal?' '+flightNoVal:''),platform:''}]
      }];
    } else {
      routes.forEach(function(r,ri){
        var depEl=document.getElementById('tp-v-srd-'+ri+'-dep');
        var arrEl=document.getElementById('tp-v-srd-'+ri+'-arr');
        if(depEl) r.departTime=depEl.value;
        if(arrEl) r.arriveTime=arrEl.value;
        // Sync fare, duration, fareCurrency, importFare from DOM
        var fareEl=document.getElementById('srd-fare-'+ri);
        var fareCurEl=document.getElementById('srd-farecur-'+ri);
        var importEl=document.getElementById('srd-import-'+ri);
        if(fareEl) r.fare=parseFloat(fareEl.value)||0;
        if(fareCurEl) r.fareCurrency=fareCurEl.value;
        if(importEl) r.importFare=importEl.checked;
        var pmEl=document.getElementById('srd-paymethod-'+ri);
        if(pmEl) r.payMethod=pmEl.value;
      });
    }
    stop.transit={
      fromPlace:fromEl.value.trim(),
      toPlace:toEl.value.trim(),
      routes:routes
    };

    // ── 同步自訂交通 leg 的 fromStop / toStop ──
    // 若站點名稱有變更，且 leg 的 fromStop/toStop 仍指向舊名稱，則一併更新
    var d2 = day();
    var stops2 = d2 ? (d2.stops || []) : [];
    var nextStop2 = S.stopIdx !== null ? stops2[S.stopIdx + 1] : null;
    var oldNextName = nextStop2 ? (nextStop2.name || '') : '';

    stop.transit.routes.forEach(function(r) {
      (r.legs || []).forEach(function(leg) {
        var isCustom = ['walk','shuttle','car','taxi'].indexOf(leg.mode) >= 0;
        if (!isCustom) return;
        if (_oldStopName && leg.fromStop === _oldStopName) leg.fromStop = name;
        if (oldNextName && leg.toStop === oldNextName) leg.toStop = toEl.value.trim();
      });
    });
  } else {
    // Last stop - preserve existing transit if any
    var existingStop2=S.stopIdx!==null?(d.stops||[])[S.stopIdx]:null;
    if(existingStop2&&existingStop2.transit) stop.transit=existingStop2.transit;
  }

  if(!d.stops) d.stops=[];
  if(S.stopIdx!==null){
    d.stops[S.stopIdx]=stop;
  } else {
    var at=S.insertAt!==null?S.insertAt:d.stops.length;
    d.stops.splice(at,0,stop);
  }
  // 帶入費用記錄
  importStopExpenses(d, stop);

  // ── 同步前一站的 transit.toPlace ──
  // 若當前站點名稱有變更，前一站的 toPlace 若仍指向舊名稱，則同步更新
  if (S.stopIdx !== null && S.stopIdx > 0 && name !== _oldStopName) {
    var prevStop2 = (d.stops || [])[S.stopIdx - 1];
    if (prevStop2 && prevStop2.transit) {
      if (prevStop2.transit.toPlace === _oldStopName) {
        prevStop2.transit.toPlace = name;
      }
      // 同步 leg 的 toStop
      (prevStop2.transit.routes || []).forEach(function(r) {
        (r.legs || []).forEach(function(leg) {
          var isCustom = ['walk','shuttle','car','taxi'].indexOf(leg.mode) >= 0;
          if (isCustom && leg.toStop === _oldStopName) leg.toStop = name;
        });
      });
    }
  }

  save(S.trips);
  _stopDirty=false;
  goBack('sc-day');
  // 強制從 S.trips 重新讀取後渲染
  var _savedStopIdx = S.stopIdx;
  setTimeout(function(){
    renderDayTL();
    renderTripDays();
    updateTodoBadge();
    checkNextSegmentConflict(_savedStopIdx, day());
  }, 0);
}

// ── GitHub 同步：讀取 ──
// 從 GitHub raw content 讀取（不需 token，公開 repo 即可）
async function syncRead() {
  try {
    var token = localStorage.getItem(GH_TOKEN_KEY);
    var headers = { 'Accept': 'application/vnd.github.v3+json' };
    if (token) headers['Authorization'] = 'token ' + token;
    // 用 Contents API 讀取（支援 private repo）
    var res = await fetch(GITHUB_API, { headers: headers });
    if (!res.ok) return null;
    var meta = await res.json();
    // 快取 SHA
    if (meta.sha) localStorage.setItem(GH_SHA_KEY, meta.sha);
    // 解碼 base64 內容
    var content = meta.content ? decodeURIComponent(escape(atob(meta.content.replace(/\n/g,'')))) : null;
    if (!content) return null;
    var data = JSON.parse(content);
    if (!data || !data.trips) return null;
    var remoteTs = data.updatedAt || '';
    var localTs = localStorage.getItem(SYNC_KEY) || '';
    if (!localTs || remoteTs > localTs) {
      localStorage.setItem(STORE_KEY, JSON.stringify(data.trips));
      localStorage.setItem(SYNC_KEY, remoteTs);
      return data.trips;
    }
    return null;
  } catch(e) {
    console.log('sync read error:', e);
    return null;
  }
}

// ── GitHub 同步：寫入 ──
// 需要 Personal Access Token（classic，repo scope）
async function syncWrite(trips, isRetry) {
  var token = localStorage.getItem(GH_TOKEN_KEY);
  if (!token) return; // 無 token 跳過
  try {
    var ts = new Date().toISOString();
    // SYNC_KEY 在成功後才更新，避免誤判

    // 先取最新 SHA（寫入時必須提供）
    var sha = localStorage.getItem(GH_SHA_KEY) || '';
    if (!sha) {
      var metaRes = await fetch(GITHUB_API, {
        headers: { 'Authorization': 'token ' + token, 'Accept': 'application/vnd.github.v3+json' }
      });
      if (metaRes.ok) {
        var meta = await metaRes.json();
        sha = meta.sha || '';
        localStorage.setItem(GH_SHA_KEY, sha);
      }
    }

    var content = JSON.stringify({ trips: trips, updatedAt: ts }, null, 0);
    var b64 = btoa(unescape(encodeURIComponent(content)));

    var body = { message: 'sync: ' + ts.slice(0,16), content: b64 };
    if (sha) body.sha = sha;

    var res = await fetch(GITHUB_API, {
      method: 'PUT',
      headers: {
        'Authorization': 'token ' + token,
        'Accept': 'application/vnd.github.v3+json',
        'Content-Type': 'application/json'
      },
      body: JSON.stringify(body)
    });

    if (res.ok) {
      var result = await res.json();
      if (result.content && result.content.sha) {
        localStorage.setItem(GH_SHA_KEY, result.content.sha);
      }
      localStorage.setItem(SYNC_KEY, ts);
      showSyncStatus('已同步', 'var(--success)');
      setTimeout(function(){ showSyncStatus('',''); }, 2000);
    } else {
      var err = await res.json();
      // SHA 衝突：重新 fetch 最新 SHA 後重試一次
      if ((res.status === 409 || res.status === 422) && !isRetry) {
        localStorage.removeItem(GH_SHA_KEY);
        showSyncStatus('重新同步中…', 'var(--info)');
        try {
          var freshRes = await fetch(GITHUB_API, {
            headers: { 'Authorization': 'token ' + token, 'Accept': 'application/vnd.github.v3+json' }
          });
          if (freshRes.ok) {
            var freshMeta = await freshRes.json();
            if (freshMeta.sha) localStorage.setItem(GH_SHA_KEY, freshMeta.sha);
          }
        } catch(e2) { /* ignore */ }
        await syncWrite(trips, true);
      } else if (res.status === 409 || res.status === 422) {
        showSyncStatus('同步衝突，請稍後再試', '#ff6b6b');
        setTimeout(function(){ showSyncStatus('',''); }, 3000);
      } else if (res.status === 401 || res.status === 403) {
        // Token 過期或無效，清除後提示重新輸入
        localStorage.removeItem(GH_TOKEN_KEY);
        localStorage.removeItem(GH_SHA_KEY);
        var ghBtn = document.getElementById('gh-token-btn');
        if (ghBtn) ghBtn.style.color = '#c8b89a';
        showSyncStatus('Token 已過期', '#ff6b6b');
        // 延遲一秒後彈出重新輸入視窗
        setTimeout(function() {
          var newToken = prompt('GitHub Token 已過期或無效，請重新輸入：\n（Settings → Developer settings → Personal access tokens → classic）');
          if (newToken) {
            newToken = newToken.trim();
            localStorage.setItem(GH_TOKEN_KEY, newToken);
            if (ghBtn) ghBtn.style.color = '#7bed9f';
            showSyncStatus('Token 已更新，重新同步中…', 'var(--info)');
            syncWrite(trips);
          }
        }, 1000);
      } else {
        console.log('sync write error:', err.message);
        showSyncStatus('同步失敗：' + (err.message||res.status), '#ff6b6b');
      }
    }
  } catch(e) {
    console.log('sync write error:', e);
  }
}

// Split state
var _splitBlocks = {};  // {mid: {totalAmt, slices:[{pid,amt,locked}]}}

function initSplitBlocks(total, members){
  _splitBlocks = {};
  var n = members.length;
  var base = Math.floor(total/n);
  var rem = total - base*n;
  members.forEach(function(m,i){
    _splitBlocks[m.id] = {totalAmt: i===0?base+rem:base, slices:[]};
  });
}
function splitBlockUsed(mid){ return (_splitBlocks[mid].slices||[]).reduce(function(s,sl){return s+sl.amt;},0); }
function splitBlockRem(mid){ return _splitBlocks[mid].totalAmt - splitBlockUsed(mid); }
function splitPayerTotal(pid){
  var sum=0;
  Object.keys(_splitBlocks).forEach(function(mid){
    (_splitBlocks[mid].slices||[]).forEach(function(sl){if(sl.pid===pid)sum+=sl.amt;});
  });
  return sum;
}
function splitAllAssigned(){
  return Object.keys(_splitBlocks).every(function(mid){return splitBlockRem(mid)<=0;});
}

function getExpenseByCtx(ctx){
  if(!ctx) return null;
  if(ctx.source==='trip'&&ctx.expIdx!==undefined) return (trip()&&trip().expenses||[])[ctx.expIdx]||null;
  var d = trip()&&trip().days?trip().days[ctx.dayIdx]:null; if(!d)return null;
  if(ctx.source==='day'&&ctx.expIdx!==undefined) return (d.expenses||[])[ctx.expIdx]||null;
  if(ctx.source==='stop'&&ctx.stopIdx!==undefined&&ctx.expIdx!==undefined){
    var stop=(d.stops||[])[ctx.stopIdx]; return stop?(stop.expenses||[])[ctx.expIdx]||null:null;

  return null;

  if(!exp.amount){alert('\u8acb\u8f38\u5165\u91d1\u984d');return;}

    var t=trip(); if(!t)return;

    if(ctx.expIdx!==undefined)t.expenses[ctx.expIdx]=exp;

    if(!d.expenses)d.expenses=[];

    else d.expenses.push(exp);

// 從地點的 importFare 設定自動建立/更新費用表
function importStopExpenses(d, stop) {
  if (!d || !stop) return;
  if (!d.expenses) d.expenses = [];

  // ── 交通費用（transit routes 中 planned 且 importFare=true）──
  var transit = stop.transit;
  if (transit && transit.routes) {
    var planned = transit.routes.find(function(r){ return r.tag === 'planned'; });
    if (planned && planned.importFare && planned.fare && planned.fare > 0) {
      var sourceId = stop.id + '_transit';
      var cat = classifyTransport(planned);
      var title = esc(transit.fromPlace||stop.name||'') + ' → ' + esc(transit.toPlace||'') + '（' + cat.label + '）';
      var payer = members_findById(planned.payerId);
      upsertExpense(d, sourceId, {
        sourceId: sourceId,
        category: 'transport',
        desc: title,
        amount: planned.fare,
        currency: planned.fareCurrency || 'JPY',
        payMethod: planned.payMethod || '',
        paidBy: planned.payerId || '',
        splitType: 'shared',
        splits: []
      });
    } else {
      // importFare=false 或無費用：移除已帶入的費用
      removeExpenseBySourceId(d, stop.id + '_transit');
    }
  }

  // ── 住宿費用（Airport 不適用，費用在交通路線方案中）──
  if (stop.type === 'hotel' && stop.hotel) {
    var hotel = stop.hotel;
    if (hotel.importFare && hotel.amount && hotel.amount > 0) {
      var hotelSourceId = stop.id + '_hotel';
      upsertExpense(d, hotelSourceId, {
        sourceId: hotelSourceId,
        category: 'hotel',
        desc: stop.name || '住宿費',
        amount: hotel.amount,
        currency: hotel.currency || 'JPY',
        payMethod: hotel.payMethod || '',
        paidBy: hotel.payerId || '',
        splitType: 'shared',
        splits: []
      });
    } else {
      removeExpenseBySourceId(d, stop.id + '_hotel');
    }
  }
}

// 新增或更新費用（以 sourceId 為唯一鍵）
function upsertExpense(d, sourceId, expData) {
  if (!d.expenses) d.expenses = [];
  var idx = d.expenses.findIndex(function(e){ return e.sourceId === sourceId; });
  if (idx >= 0) {
    // 更新金額/幣別/付款資訊，保留已設定的分配
    var existing = d.expenses[idx];
    existing.amount = expData.amount;
    existing.currency = expData.currency;
    existing.payMethod = expData.payMethod;
    existing.paidBy = expData.paidBy;
    existing.title = expData.title;
    existing.category = expData.category;
  } else {
    d.expenses.push(Object.assign({ id: uid() }, expData));
  }
}

// 移除帶入的費用（importFare 取消時）
// 若已有分配資料則保留記錄，只清空 sourceId 讓其成為手動費用
function removeExpenseBySourceId(d, sourceId) {
  if (!d.expenses) return;
  d.expenses = d.expenses.filter(function(e) {
    if (e.sourceId !== sourceId) return true;
    // 檢查是否有已設定的分配
    var hasAlloc = e.splits && e.splits.some(function(s){
      return s.slices && s.slices.length > 0;
    });
    if (hasAlloc) {
      // 保留記錄，移除 sourceId 使其成為獨立費用
      delete e.sourceId;
      return true;
    }
    return false; // 無分配資料才刪除
  });
}

// 輔助：by member id
function members_findById(id) {
  var members = tripMembers();
  return members.find(function(m){ return m.id === id; }) || null;
}


// 一次性補跑：掃描所有地點，補建 importFare 費用記錄
function migrateImportFareOnce() {
  var MIGRATE_KEY = 'travel_import_fare_migrated_v2';
  if (localStorage.getItem(MIGRATE_KEY)) return; // 已跑過
  var t = trip(); if (!t) return;
  var changed = false;
  (t.days || []).forEach(function(d) {
    (d.stops || []).forEach(function(stop) {
      // 交通
      var transit = stop.transit;
      if (transit && transit.routes) {
        var planned = transit.routes.find(function(r){ return r.tag === 'planned'; });
        if (planned && planned.importFare && planned.fare && planned.fare > 0) {
          importStopExpenses(d, stop);
          changed = true;
        }
      }
      // 住宿
      if (stop.type === 'hotel' && stop.hotel && stop.hotel.importFare && stop.hotel.amount > 0) {
        importStopExpenses(d, stop);
        changed = true;
      }
    });
  });
  if (changed) save(S.trips);
  localStorage.setItem(MIGRATE_KEY, '1');
}

function updateTwdRate(cur, val) {
  var rates = JSON.parse(localStorage.getItem('twd_rates') || '{}');
  val = parseFloat(val) || 0;
  if (val > 0) rates[cur] = val; else delete rates[cur];

function getAllExpenses(){
  var t = trip(); if(!t) return [];
  var result = [];
  (t.days||[]).forEach(function(d, di){
    // Day-level expenses
    (d.expenses||[]).forEach(function(exp,ei){
      result.push(Object.assign({}, exp, {dayIdx:di, stopIdx:null, expIdx:ei, dayTitle:d.title||(di+1)+'\u65e5'}));
    });
    // Stop-level expenses
    (d.stops||[]).forEach(function(stop, si){
      (stop.expenses||[]).forEach(function(exp,ei){
        result.push(Object.assign({}, exp, {dayIdx:di, stopIdx:si, expIdx:ei,
          dayTitle:d.title||(di+1)+'\u65e5', stopName:stop.name||''}));
      });
    });
  });
  // 行程費用（不屬於特定日期）
  (t.expenses||[]).forEach(function(exp,ei){
    result.push(Object.assign({}, exp, {source:'trip', expIdx:ei, dayTitle:'\u884c\u7a0b\u8cbb\u7528', dayIdx:null}));
  });
  return result;
}

  else if(_reportTab === 'person') body.innerHTML = renderPersonReport(exps, members, curs);

}

function fmtReportAmt(n, cur){

}


function onChangeCalcDuration(ri){
  var depEl=document.getElementById('tp-v-srd-'+ri+'-dep');
  var arrEl=document.getElementById('tp-v-srd-'+ri+'-arr');
  if(!depEl||!arrEl||!depEl.value||!arrEl.value)return;
  var dep=depEl.value.split(':'), arr=arrEl.value.split(':');
  var depMin=parseInt(dep[0])*60+parseInt(dep[1]);
  var arrMin=parseInt(arr[0])*60+parseInt(arr[1]);
  var diff=arrMin-depMin;
  if(diff<0)diff+=1440; // cross midnight
  var durEl=document.querySelector('[data-ri="'+ri+'"][data-field="duration"]');
  setStopRouteField(ri,'duration',diff);
  var fmt=document.getElementById('dur-fmt-'+ri);if(fmt)fmt.textContent=fmtDuration(diff);
  _stopDirty=true;
}

var _ttSelectorStopIdx = null;
var _prevArrTime = null; // 前段交通的到達時間，供班次選擇器衝突檢查
var _ttSelectorMulti = false;   // 是否為多選模式
var _ttSelectedIdxs = [];        // 已選班次的 index 陣列
 // 當前正在編輯的 stop index

// 開啟班次選擇畫面（從地點編輯頁呼叫）
function openTimetableSelector() {
  var d = day(); if (!d) return;
  // 取得當前 stop index
  _ttSelectorStopIdx = S.stopIdx;
  var stop = (d.stops || [])[_ttSelectorStopIdx];
  // 計算前段到達時間（此站的前一個站點的交通方案）
  _prevArrTime = null;
  if (_ttSelectorStopIdx > 0) {
    var prevStop = (d.stops || [])[_ttSelectorStopIdx - 1];
    if (prevStop && prevStop.transit) {
      var prevPlanned = (prevStop.transit.routes || []).find(function(r){ return r.tag === 'planned'; });
      if (prevPlanned) _prevArrTime = prevPlanned.arriveTime || null;
    }
  }

  // 單選模式
  _ttSelectorMulti = false;
  _ttSelectedIdxs = [];
  renderTimetableSelector(d);
  goTo('sc-timetable-selector');
}

// 關閉選擇器，返回地點編輯
function closeTimetableSelector() {
  goBack('sc-stop');
}

// 渲染班次選擇卡片（當天所有班次）
function renderTimetableSelector(d) {
  var body = document.getElementById('timetable-selector-body');
  if (!body) return;
  var t = trip();
  var schedules = (t && t.timetables) || [];
  // 動態計算當天日期（優先用 S.dayIdx，備用 indexOf）
  var t2 = trip();
  var dayDate = '';
  if (t2 && t2.startDate) {
    var dayIdx = (S.dayIdx !== null && S.dayIdx !== undefined) ? S.dayIdx : (t2.days ? t2.days.indexOf(d) : -1);
    if (dayIdx >= 0) {
      var dd2 = new Date(t2.startDate);
      dd2.setDate(dd2.getDate() + dayIdx);
      dayDate = dd2.getFullYear() + '-' +
        String(dd2.getMonth()+1).padStart(2,'0') + '-' +
        String(dd2.getDate()).padStart(2,'0');
    }
  }

  // 篩選當天班次（有日期就比對，無日期的全部顯示）
  var filtered = schedules.filter(function(s) {
    if (!s.date) return true;
    return s.date === dayDate;
  });

  if (!filtered.length) {
    body.innerHTML = '<div style="padding:32px 20px;text-align:center;color:#c8b89a;font-size:14px">' +
      '當天無匯入班次。<br><br>' +
      '<button onclick="goBack(\u0027sc-timetable-selector\u0027);openTimetable();" style="padding:10px 20px;background:rgba(110,198,240,.15);border:1px solid rgba(110,198,240,.3);border-radius:8px;color:#6ec6f0;font-size:13px;cursor:pointer">\u524d\u5f80\u532f\u5165\u73ed\u6b21</button>' +
      '</div>';
    return;
  }

  var isMulti = _ttSelectorMulti || false;

  // 建立已選 timetableIdx → tag 的對照表
  var stop2 = _ttSelectorStopIdx !== null ? ((d && d.stops || [])[_ttSelectorStopIdx]) : null;
  var existRoutes = (stop2 && stop2.transit && stop2.transit.routes) || [];
  var selectedMap = {}; // origIdx -> tag label
  var plannedCount = 0, backupCount = 0;
  existRoutes.forEach(function(r) {
    // 找對應的 timetable index（用 departTime+from+to 比對）
    if (!r.legs || !r.legs.length) return;
    schedules.forEach(function(s, si) {
      var match = (s.departTime === r.departTime && s.arriveTime === r.arriveTime);
      if (match) {
        if (r.tag === 'planned') {
          selectedMap[si] = '已選 ★預定';
        } else {
          backupCount++;
          selectedMap[si] = '已選 候補' + backupCount;
        }
      }
    });
  });

  var html = '<div style="padding:12px 16px 0">' +
    '<div style="font-size:12px;color:#c8b89a;margin-bottom:12px">' + (isMulti ? '可複選班次，選好後點「套用」' : '選擇要套用到此段交通的班次：') + '</div>';

  filtered.forEach(function(s, idx) {
    // 找原始 index
    var origIdx = schedules.indexOf(s);
    // 建立 legs 詳細資訊
    var legsHtml = '';
    if (s.legs && s.legs.length) {
      s.legs.forEach(function(leg, li) {
        var legLine = leg.line_name || '';
        var legDest = leg.destination_for || '';
        var legDep = leg.departure_station || '';
        var legArr = leg.arrival_station || '';
        var legDepTime = leg.departure_time || '';
        var legArrTime = leg.arrival_time || '';
        var legDepPlatform = leg.departure_platform || '';
        var legArrPlatform = leg.arrival_platform || '';
        var isDirect = leg.is_through_service ? '直通' : '';
        legsHtml += '<div style="margin-top:8px;padding-top:8px;border-top:1px solid var(--border)">' +
          '<div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:3px">' +
            '<div style="font-size:11px;color:#c8b89a">&#9312;</div>'.replace('&#9312;', '&#' + (9311+li+1) + ';') +
            '<div style="font-size:12px;font-weight:600;color:#e0d4c0">' + esc(legLine) + '</div>' +
            (legDest ? '<div style="font-size:11px;color:#c8b89a">(' + esc(legDest) + ')</div>' : '') +
            (isDirect ? '<div style="font-size:10px;color:#7bed9f;background:rgba(123,237,159,.1);border:1px solid rgba(123,237,159,.3);padding:1px 6px;border-radius:4px">直通</div>' : '') +
          '</div>' +
          '<div style="font-size:11px;color:#c8b89a;padding-left:14px">' +
            esc(legDep) + (legDepPlatform ? '（' + esc(legDepPlatform) + '）' : '') + ' ' + esc(legDepTime) +
            ' → ' + esc(legArr) + (legArrPlatform ? '（' + esc(legArrPlatform) + '）' : '') + ' ' + esc(legArrTime) +
          '</div>' +
        '</div>';
      });
    }

    // IC/現金票價分開顯示（-1 視為無資料）
    var fareHtml = '';
    var sic = s.fare_ic && s.fare_ic > 0 ? s.fare_ic : 0;
    var stk = s.fare_ticket && s.fare_ticket > 0 ? s.fare_ticket : 0;
    if (sic && stk) fareHtml = '¥' + sic + '（IC）/ ¥' + stk + '（現金）';
    else if (sic) fareHtml = '¥' + sic + '（IC）';
    else if (s.fare && s.fare > 0) fareHtml = '¥' + esc(String(s.fare));

    var isSelected = _ttSelectedIdxs && _ttSelectedIdxs.indexOf(origIdx) >= 0;
    var alreadyTag = selectedMap[origIdx] || null;
    var isDisabled = !!alreadyTag;
    var cat2 = classifyTransport(s);
    // 檢查前段到達時間衝突
    var prevConflict = '';
    if (s.departTime && _prevArrTime) {
      var depM = timeToMins(s.departTime);
      var prevM = timeToMins(_prevArrTime);
      if (depM !== null && prevM !== null) {
        var gap = depM - prevM;
        if (gap < -120) gap += 1440;
        if (gap < 0) prevConflict = '⚠️ 與前段到達時間衝突（' + _prevArrTime + ' 到）';
        else if (gap < _scheduleTransferMins) prevConflict = '⚠️ 換乘時間僅 ' + gap + ' 分，可能不足';
      }
    }
    html += '<div ' + (isDisabled ? '' : 'onclick="toggleTimetableSelect(' + origIdx + ')"') + ' style="background:' + (isDisabled ? 'var(--bg2)' : 'var(--bg3)') + ';border:2px solid ' + (isDisabled ? 'var(--border)' : isSelected ? '#6ec6f0' : 'rgba(110,198,240,.25)') + ';border-radius:12px;padding:14px 16px;margin-bottom:10px;' + (isDisabled ? 'opacity:.45' : 'cursor:pointer') + ';position:relative">' +
      (alreadyTag ? '<div style="position:absolute;top:10px;right:12px;font-size:10px;padding:2px 7px;border-radius:6px;background:rgba(110,198,240,.15);color:#6ec6f0;border:1px solid rgba(110,198,240,.3)">' + alreadyTag + '</div>' : '') +
      (!isDisabled && isSelected ? '<div style="position:absolute;top:10px;right:12px;width:18px;height:18px;background:#6ec6f0;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;color:#0f1923">✓</div>' : '') +
      '<div style="font-size:11px;color:#c8b89a;margin-bottom:6px">' + cat2.icon + ' ' + cat2.label + '</div>' +
      // 標題行：出發→到達 + 乘換
      '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">' +
        '<div style="font-size:13px;font-weight:700;color:#e0d4c0">' + esc(s.from || '') + ' → ' + esc(s.to || '') + '</div>' +
        (s.transfers !== undefined ? '<div style="font-size:11px;color:#c8b89a">乘換 ' + s.transfers + ' 次</div>' : '') +
      '</div>' +
      // 時間 + 所需時間
      '<div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:4px">' +
        '<div style="font-size:16px;font-weight:700;color:#6ec6f0">' + esc(s.departTime || '') + ' → ' + esc(s.arriveTime || '') + '</div>' +
        (s.duration ? '<div style="font-size:12px;color:#c8b89a">' + esc(s.duration) + '</div>' : '') +
      '</div>' +
      // 票價
      (fareHtml ? '<div style="font-size:12px;color:#c8b89a;margin-bottom:2px">' + fareHtml + '</div>' : '') +
      // Legs 詳情
      legsHtml +
      (prevConflict ? '<div style="margin-top:6px;padding:4px 8px;background:rgba(232,184,75,.12);border:1px solid rgba(232,184,75,.3);border-radius:6px;font-size:11px;color:#e8b84b">' + prevConflict + '</div>' : '') +
    '</div>';
  });

  html += '</div>';
  // 套用按鈕（多選模式）
  if (_ttSelectorMulti) {
    html += '<div style="padding:12px 16px"><button onclick="applyMultiTimetable()" style="width:100%;padding:12px;background:var(--accent);border:none;border-radius:var(--radius-sm);color:#0f1923;font-size:14px;font-weight:700;cursor:pointer">套用已選方案</button></div>';
  }
  body.innerHTML = html;
}


// 切換班次選取狀態（多選模式）
function toggleTimetableSelect(origIdx) {
  if (!_ttSelectorMulti) {
    // 單選模式：直接套用
    applyTimetable(origIdx);
    return;
  }
  // 多選模式：toggle
  var pos = _ttSelectedIdxs.indexOf(origIdx);
  if (pos >= 0) {
    _ttSelectedIdxs.splice(pos, 1);
  } else {
    _ttSelectedIdxs.push(origIdx);
  }
  renderTimetableSelector(day());
}

// 套用多選的班次（每筆各建立一個方案）
function applyMultiTimetable() {
  if (!_ttSelectedIdxs.length) { alert('請先選擇班次'); return; }
  var d = day(); if (!d) return;
  var stop = (d.stops || [])[_ttSelectorStopIdx];
  if (!stop) return;
  var t = trip();
  if (!stop.transit) stop.transit = {
    fromPlace: (document.getElementById('sf-transit-from') || {value:''}).value,
    toPlace: (document.getElementById('sf-transit-to') || {value:''}).value,
    routes: []
  };

  _ttSelectedIdxs.forEach(function(origIdx) {
    var s = t && t.timetables ? t.timetables[origIdx] : null;
    if (!s) return;
    var multiTag = stop.transit.routes.length === 0 ? 'planned' : 'backup';
    stop.transit.routes.push({
      id: uid(),
      tag: multiTag,
      departTime: s.departTime || '',
      arriveTime: s.arriveTime || '',
      duration: s.duration ? parseInt(s.duration) || 0 : 0,
      transfers: s.transfers || 0,
      fare: s.fare ? parseFloat(s.fare) || 0 : 0,
      fareCurrency: 'JPY',
      importFare: false,
      legs: (s.legs && s.legs.length ? s.legs : [{
        departure_station: s.from, arrival_station: s.to,
        departure_time: s.departTime, arrival_time: s.arriveTime,
        line_name: s.trainName
      }]).map(function(l) {
        return {
          mode: 'train',
          fromStop: l.departure_station || s.from || '',
          toStop: l.arrival_station || s.to || '',
          departTime: l.departure_time || '',
          arriveTime: l.arrival_time || '',
          line: l.line_name || s.trainName || '',
          platform: l.departure_platform || '',
          arrPlatform: l.arrival_platform || '',
          headsign: l.destination_for || ''
        };
      })
    });
  });

  save(S.trips);
  _stopDirty = false;
  _ttSelectedIdxs = [];
  goBack('sc-stop');
  renderStopForm(stop, _ttSelectorStopIdx);
}

// 班次表物件 → route 物件（供 applyTimetable 和 applySchedule 共用）
function timetableToRoute(s, tag) {
  return {
    id: uid(),
    tag: tag || 'planned',
    departTime: s.departTime || '',
    arriveTime: s.arriveTime || '',
    duration: s.duration ? parseInt(s.duration) || 0 : 0,
    transfers: s.transfers || 0,
    fare: s.fare ? parseFloat(s.fare) || 0 : 0,
    fareCurrency: s.fareCurrency || 'JPY',
    importFare: false,
    legs: (s.legs && s.legs.length ? s.legs : [{
      departure_station: s.from, arrival_station: s.to,
      departure_time: s.departTime, arrival_time: s.arriveTime,
      line_name: s.trainName
    }]).map(function(l) {
      // 若 leg 已是 route 格式（有 mode 欄位）直接複製
      if (l.mode) return Object.assign({}, l);
      // 否則從原始 GAS 格式轉換
      return {
        mode: 'train',
        fromStop: l.departure_station || l.fromStop || s.from || '',
        toStop:   l.arrival_station  || l.toStop  || s.to   || '',
        departTime: l.departure_time || l.departTime || '',
        arriveTime: l.arrival_time   || l.arriveTime  || '',
        line:      l.line_name || l.line || s.trainName || '',
        platform:  l.departure_platform || l.platform || '',
        arrPlatform: l.arrival_platform || l.arrPlatform || '',
        headsign:  l.destination_for || l.headsign || ''
      };
    })
  };
}

// 套用選擇的班次到地點路線方案
function applyTimetable(origIdx) {
  var d = day(); if (!d) return;
  var stop = (d.stops || [])[_ttSelectorStopIdx];
  if (!stop) return;
  var t = trip();
  var s = (t && t.timetables) ? t.timetables[origIdx] : null;
  if (!s) return;

  // 記錄選擇
  stop.selectedTimetableId = origIdx;

  // 同步建立路線方案
  if (!stop.transit) stop.transit = { fromPlace: s.from || '', toPlace: s.to || '', routes: [] };
  stop.transit.fromPlace = s.from || stop.transit.fromPlace;
  stop.transit.toPlace = s.to || stop.transit.toPlace;

  // 第一筆為 planned，後續為 backup；若已存在相同時間則跳過
  var alreadyExists = stop.transit.routes.some(function(r) {
    return r.departTime === (s.departTime || '') && r.arriveTime === (s.arriveTime || '');
  });
  if (alreadyExists) {
    alert('此班次已存在，不重複新增');
    return;
  }
  var newTag = (stop.transit.routes && stop.transit.routes.length > 0) ? 'backup' : 'planned';

  stop.transit.routes.push({
    id: uid(),
    tag: newTag,
    departTime: s.departTime || '',
    arriveTime: s.arriveTime || '',
    duration: s.duration ? parseInt(s.duration) || 0 : 0,
    transfers: s.transfers || 0,
    fare: s.fare ? parseFloat(s.fare) || 0 : 0,
    fareCurrency: 'JPY',
    importFare: false,
    legs: (s.legs && s.legs.length ? s.legs : [{
      departure_station: s.from, arrival_station: s.to,
      departure_time: s.departTime, arrival_time: s.arriveTime,
      line_name: s.trainName
    }]).map(function(l) {
      return {
        mode: 'train',
        fromStop: l.departure_station || s.from || '',
        toStop: l.arrival_station || s.to || '',
        departTime: l.departure_time || '',
        arriveTime: l.arrival_time || '',
        line: l.line_name || s.trainName || '',
        platform: l.departure_platform || '',
        arrPlatform: l.arrival_platform || '',
        headsign: l.destination_for || ''
      };
    })
  });

  save(S.trips);
  _stopDirty = false;
  goBack('sc-stop');
  // 重新渲染地點編輯頁
  renderStopForm(stop, _ttSelectorStopIdx);
}

// 重新選擇（清除已選班次）
function resetTimetableSelection() {
  var d = day(); if (!d) return;
  var stop = (d.stops || [])[_ttSelectorStopIdx !== null ? _ttSelectorStopIdx : S.stopIdx];
  if (!stop) return;
  if (!confirm('清除已選班次並重新選擇？')) return;
  delete stop.selectedTimetableId;
  if (stop.transit) stop.transit.routes = [];
  save(S.trips);
  _ttSelectorStopIdx = S.stopIdx;
  _ttSelectorMulti = false;
  _ttSelectedIdxs = [];
  renderTimetableSelector(d);
  goTo('sc-timetable-selector');
}

// 執行解析匯入
async function doTimetableImport() {
  var t = trip(); if (!t) return;
  var textInput = document.getElementById('tt-text-input').value.trim();
  var btn = document.querySelector('#sc-timetable-import .btn-primary');
  if (btn) { btn.textContent = '解析中…'; btn.disabled = true; }

  try {
    var result;
    if (_ttFile) {
      // 圖片或 PDF → base64 → Gemini
      var b64 = await new Promise(function(res, rej) {
        var r = new FileReader();
        r.onload = function() { res(r.result.split(',')[1]); };
        r.onerror = rej;
        r.readAsDataURL(_ttFile);
      });
      alert('圖片/PDF 匯入目前不支援，請改用 AI 整理後的 JSON 文字貼上。');
      return;
    } else if (textInput) {
      // 先嘗試直接解析 JSON（如 AI 預先整理好的格式）
      try {
        var parsed = JSON.parse(textInput);
        // 支援 {routes:[...]} 或 {schedules:[...]} 兩種格式
        if (parsed.schedules) {
          result = { stat: 'OK', schedules: parsed.schedules };
        } else if (parsed.routes) {
          // 將 routes 格式轉換為 schedules 格式
          result = { stat: 'OK', schedules: parsed.routes.map(function(r) {
            var firstLeg = (r.legs || [])[0] || {};
            var lastLeg = (r.legs || []).slice(-1)[0] || {};
            return {
              from: firstLeg.departure_station || '',
              to: lastLeg.arrival_station || '',
              departTime: r.departure_time || firstLeg.departure_time || '',
              arriveTime: r.arrival_time || lastLeg.arrival_time || '',
              trainName: (r.legs || []).map(function(l){return l.line_name||'';}).filter(Boolean).join(' → '),
              duration: r.duration_minutes ? r.duration_minutes + '分' : '',
              fare: r.fare ? (r.fare.ic_yen || r.fare.ticket_yen || '') : '',
              fare_ic: r.fare && r.fare.ic_yen > 0 ? r.fare.ic_yen : '',
              fare_ticket: r.fare && r.fare.ticket_yen > 0 ? r.fare.ticket_yen : '',
              date: (parsed.search_meta && parsed.search_meta.search_departure_date) || '',
              transfers: r.transfers || 0,
              legs: r.legs || []
            };
          })};
        } else {
          throw new Error('未知格式');
        }
      } catch(jsonErr) {
        // 非 JSON 格式：提示使用者先用 AI 整理
        alert('請貼上 JSON 格式的班次資料。\n可使用 AI（如 ChatGPT/Gemini）將 Navitime 時刻表整理成 JSON 後再貼入。');
        return;
      }
    } else {
      alert('請選擇檔案或貼上文字');
      return;
    }

    if (!result || result.stat !== 'OK' || !result.schedules || !result.schedules.length) {
      alert('解析失敗：' + (result && result.error ? result.error : '無法取得班次資料'));
      return;
    }

    // 合併到行程的 timetables 陣列
    if (!t.timetables) t.timetables = [];
    // 去重複：以 from+to+departTime+date 為唯一鍵
    var existing = t.timetables.map(function(s){
      return (s.from||'')+'|'+(s.to||'')+'|'+(s.departTime||'')+'|'+(s.date||'');
    });
    var added = 0;
    result.schedules.forEach(function(s) {
      var key = (s.from||'')+'|'+(s.to||'')+'|'+(s.departTime||'')+'|'+(s.date||'');
      if (existing.indexOf(key) < 0) {
        t.timetables.push(s);
        existing.push(key);
        added++;
      }
    });
    save(S.trips);
    alert(added > 0 ? '成功匯入 ' + added + ' 筆班次' + (result.schedules.length - added > 0 ? '，略過 ' + (result.schedules.length - added) + ' 筆重複' : '') : '所有班次已存在，無新增');
    goBack('sc-timetable');
    renderTimetable();
  } catch(e) {
    alert('匯入失敗：' + e.message);
  } finally {
    if (btn) { btn.textContent = '解析匯入'; btn.disabled = false; }
  }
}


// 從路線名稱判斷交通工具類別
function classifyTransport(s) {
  // 優先用 legs[0].mode（手動路線）
  var legMode = s.legs && s.legs[0] ? s.legs[0].mode || '' : '';
  var modeMap = {
    walk:     { icon: '🚶', label: '步行' },
    shuttle:  { icon: '🚐', label: '接送車' },
    car:      { icon: '🚗', label: '私家車' },
    taxi:     { icon: '🚕', label: '計程車' },
    ferry:    { icon: '⛴️', label: '渡輪' },
    flight:   { icon: '✈️', label: '航班' },
  };
  if (modeMap[legMode]) return modeMap[legMode];
  // 用路線名稱判斷（匯入班次）— 同時檢查 line_name 和 line（顯示用欄位）
  var leg0 = s.legs && s.legs[0] ? s.legs[0] : null;
  var orig = (s.trainName || '') + ' ' + (leg0 ? (leg0.line_name || '') + ' ' + (leg0.line || '') : '');
  if (/高速バス|高速巴士|highwaybus/i.test(orig)) return { icon: '🚌', label: '高速巴士' };
  if (/新幹線|はやぶさ|のぞみ|こまち|やまびこ|つばさ|かがやき|はくたか|あさま/i.test(orig)) return { icon: '🚄', label: '新幹線' };
  if (/特急|limited express/i.test(orig)) return { icon: '🚆', label: '特急' };
  if (/快速/i.test(orig)) return { icon: '🚆', label: '快速電車' };
  if (/地下鉄|地鐵|subway|metro/i.test(orig)) return { icon: '🚇', label: '地鐵' };
  if (/バス|巴士|bus/i.test(orig)) return { icon: '🚌', label: '巴士' };
  if (/空港線|airport/i.test(orig)) return { icon: '🚃', label: '機場線' };
  if (/モノレール|monorail/i.test(orig)) return { icon: '🚝', label: '單軌列車' };
  if (/フェリー|ferry|渡輪/i.test(orig)) return { icon: '⛴️', label: '渡輪' };
  if (legMode === 'bus') return { icon: '🚌', label: '巴士' };
  if (legMode === 'shinkansen') return { icon: '🚄', label: '新幹線' };
  if (legMode === 'train') return { icon: '🚃', label: '電車' };
  return { icon: '🚃', label: '電車' };
}

// 渲染班次列表
function renderTimetable() {
  var t = trip();
  var body = document.getElementById('timetable-body');
  if (!body) return;
  var schedules = (t && t.timetables) || [];
  var now = new Date();

  if (!schedules.length) {
    body.innerHTML = '<div style="padding:32px 20px;text-align:center;color:#c8b89a;font-size:14px">尚無班次，點右上角「匯入」新增</div>';
    return;
  }

  // 依出發時間排序
  var sorted = schedules.slice().sort(function(a, b) {
    return (a.departTime || '').localeCompare(b.departTime || '');
  });

  // 計算當日日期（只顯示當日班次）
  var dayDate = '';
  if (t && t.startDate && S.dayIdx !== null && S.dayIdx !== undefined) {
    var dd2 = new Date(t.startDate);
    dd2.setDate(dd2.getDate() + S.dayIdx);
    dayDate = dd2.getFullYear() + '-' +
      String(dd2.getMonth()+1).padStart(2,'0') + '-' +
      String(dd2.getDate()).padStart(2,'0');
  }
  // 篩選當日班次
  var filtered = dayDate ? sorted.filter(function(s){ return !s.date || s.date === dayDate; }) : sorted;

  // 依 from→to 分組
  var groups = {};
  var groupOrder = [];
  filtered.forEach(function(s) {
    var key = (s.from || '') + ' → ' + (s.to || '');
    if (!groups[key]) { groups[key] = []; groupOrder.push(key); }
    groups[key].push(s);
  });

  if (!filtered.length) {
    body.innerHTML = '<div style="padding:32px 20px;text-align:center;color:#c8b89a;font-size:14px">當日無班次資料</div>';
    return;
  }

  var html = '<div style="padding:12px 16px 0">';
  groupOrder.forEach(function(groupKey) {
    var groupItems = groups[groupKey];
    // 分組標題
    html += '<div style="font-size:12px;font-weight:700;color:#6ec6f0;margin:8px 0 6px;padding-bottom:4px;border-bottom:1px solid rgba(110,198,240,.2)">'
      + esc(groupKey) + '</div>';
    groupItems.forEach(function(s) {
    var idx = t.timetables.indexOf(s);
    // 判斷班次是否已過
    var isPast = false;
    if (s.date && s.departTime) {
      var depDt = new Date(s.date + 'T' + s.departTime);
      isPast = depDt < now;
    }

    // fare 顯示
    var fareStr = '';
    var fareIc = s.fare_ic && s.fare_ic > 0 ? s.fare_ic : 0;
    var fareTk = s.fare_ticket && s.fare_ticket > 0 ? s.fare_ticket : 0;
    if (fareIc && fareTk) fareStr = '¥' + fareIc + '（IC）/ ¥' + fareTk + '（現金）';
    else if (fareIc) fareStr = '¥' + fareIc + '（IC）';
    else if (s.fare && s.fare > 0) fareStr = '¥' + s.fare;
    // legs 摘要
    var legsSummary = '';
    if (s.legs && s.legs.length) {
      legsSummary = '<div style="margin-top:6px">';
      s.legs.forEach(function(leg, li) {
        legsSummary += '<div style="font-size:11px;color:#c8b89a;margin-top:2px">' +
          '&#' + (9311+li+1) + '; ' + esc(leg.line_name||'') +
          (leg.destination_for ? '（' + esc(leg.destination_for) + '）' : '') +
          (leg.is_through_service ? ' <span style="color:#7bed9f">直通</span>' : '') + ' ' +
          esc(leg.departure_station||'') + (leg.departure_platform ? '（' + esc(leg.departure_platform) + '）' : '') +
          ' → ' + esc(leg.arrival_station||'') + (leg.arrival_platform ? '（' + esc(leg.arrival_platform) + '）' : '') +
        '</div>';
      });
      legsSummary += '</div>';
    }
    var cat1 = classifyTransport(s);
    html += '<div style="background:var(--bg3);border:1px solid ' + (isPast ? 'var(--border)' : 'rgba(110,198,240,.3)') + ';border-radius:12px;padding:14px 16px;margin-bottom:10px;opacity:' + (isPast ? '.55' : '1') + '">' +
      '<div style="font-size:11px;color:#c8b89a;margin-bottom:6px">' + cat1.icon + ' ' + cat1.label + '</div>' +
      '<div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:6px">' +
        '<div style="font-size:13px;font-weight:700;color:#e0d4c0">' + esc(s.from || '') + ' → ' + esc(s.to || '') + '</div>' +
        '<button onclick="deleteTimetable(' + idx + ')" style="background:none;border:none;color:#c8b89a;font-size:16px;cursor:pointer;padding:0 0 0 8px">&times;</button>' +
      '</div>' +
      '<div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap">' +
        '<div style="font-size:15px;font-weight:700;color:' + (isPast ? '#c8b89a' : '#6ec6f0') + '">' + esc(s.departTime || '') + ' → ' + esc(s.arriveTime || '') + '</div>' +
        (s.duration ? '<div style="font-size:12px;color:#c8b89a">' + esc(s.duration) + '</div>' : '') +
        (s.transfers !== undefined ? '<div style="font-size:11px;color:#c8b89a">乘換 ' + s.transfers + ' 次</div>' : '') +
      '</div>' +
      (fareStr ? '<div style="font-size:12px;color:#c8b89a;margin-top:3px">' + fareStr + '</div>' : '') +
      legsSummary +
      (s.date ? '<div style="font-size:11px;color:#c8b89a;margin-top:4px">' + esc(s.date) + '</div>' : '') +
      (isPast ? '<div style="margin-top:8px;display:flex;gap:8px">' +
        '<button onclick="openNavitime(\'' + encodeURIComponent(s.from||'') + '\',\'' + encodeURIComponent(s.to||'') + '\')" style="flex:1;padding:8px;background:rgba(110,198,240,.12);border:1px solid rgba(110,198,240,.3);border-radius:8px;color:#6ec6f0;font-size:12px;cursor:pointer">連結 NAVITime</button>' +
      '</div>' : '') +
    '</div>';
    }); // end groupItems.forEach
  }); // end groupOrder.forEach
  html += '</div>';
  body.innerHTML = html;
}

// 刪除班次
function deleteTimetable(origIdx) {
  var t = trip();
  if (!t || !t.timetables) return;
  if (origIdx < 0 || origIdx >= t.timetables.length) return;
  if (!confirm('刪除此班次？')) return;
  t.timetables.splice(origIdx, 1);
  save(S.trips);
  renderTimetable();
}

// 開啟 Google Maps（自動判斷手機/PC）
function openGoogleMap(name) {
  if (!name) return;
  var isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
  var q = encodeURIComponent(name);
  if (isMobile) {
    // 嘗試呼叫 Google Maps App，若未安裝則 fallback 到網頁版
    var appUrl = 'comgooglemaps://?q=' + q + '&zoom=16';
    var webUrl = 'https://maps.google.com/maps?q=' + q;
    var start = Date.now();
    window.location.href = appUrl;
    setTimeout(function() {
      // 若 App 沒有開啟（頁面仍在前景），fallback 到網頁版
      if (Date.now() - start < 2000) {
        window.open(webUrl, '_blank');
      }
    }, 1200);
  } else {
    window.open('https://www.google.com/maps/search/' + q, '_blank');
  }
}

// 開啟 NAVItime（自動判斷手機/PC）
function openNavitime(from, to) {
  var isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
  var f = decodeURIComponent(from), t2 = decodeURIComponent(to);
  var url;
  if (isMobile) {
    url = 'https://transfer.navitime.biz/5931bus/smart/transfer/Top?startName=' +
      encodeURIComponent(f) + '&goalName=' + encodeURIComponent(t2);
  } else {
    url = 'https://transfer.navitime.biz/5931bus/pc/transfer/Top?startName=' +
      encodeURIComponent(f) + '&goalName=' + encodeURIComponent(t2);
  }
  window.open(url, '_blank');
}

renderList();
initDayMode();
migrateImportFareOnce();
