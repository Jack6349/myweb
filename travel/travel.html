  html += '<div class="fs"><div class="frow">'+
    '<div><div class="fl">\u91d1\u984d</div><input class="fi" type="number" id="ef-amount" placeholder="0" value="'+ea(exp&&exp.amount?exp.amount:'')+'" oninput="_expDirty=true;refreshSplitAmounts()"></div>'+
    '<div><div class="fl">\u5e63\u5225</div><select class="fsel" id="ef-currency" onchange="_expDirty=true">';
  var curs = (trip()?trip().currencies:null)||['TWD','JPY'];
  curs.forEach(function(cur){ html += '<option value="'+cur+'"'+(exp&&exp.currency===cur?' selected':'')+'>'+cur+'</option>'; });
  html += '</select></div></div></div>';

  // Payer
  html += '<div class="fs"><div class="fl">\u4ed8\u6b3e\u4eba</div>';
  html += '<div style="display:flex;gap:6px;flex-wrap:wrap" id="ef-payer-row">';
  members.forEach(function(m,i){
    var mc = mcolor(i);

      'style="'+(payerId===m.id?'border-color:'+mc.color+';background:'+mc.bg+';color:'+mc.color:'')+'">'+
      '<div style="width:20px;height:20px;border-radius:50%;background:'+mc.bg+';color:'+mc.color+';display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700">'+m.name[0]+'</div>'+
      esc(m.name)+'</div>';

  html += '<div class="share-type-row">';
  html += '<button class="share-btn'+(shareType==='shared'?' sel':'')+'" id="sb-shared" onclick="selShareType(\'shared\')">\u5171\u7528\u5206\u914d</button>';
  html += '<button class="share-btn'+(shareType==='personal'?' sel':'')+'" id="sb-personal" onclick="selShareType(\'personal\')">\u79c1\u4eba\u8cbb\u7528</button>';
  html += '</div>';

  // Split / Personal area
  html += '<div id="ef-share-area">';
  html += shareType==='shared' ? buildSplitArea(members,exp) : buildPersonalArea(exp);
  html += '</div>';

  html += '</div>';
  document.getElementById('expense-body').innerHTML = html;

  // Listeners
  document.getElementById('expense-body').querySelectorAll('input,select,textarea').forEach(function(el){
    el.addEventListener('input',function(){_expDirty=true;});

function buildSplitArea(members, exp){
  var total = parseInt((document.getElementById('ef-amount')||{value:'0'}).value)||0;
  if(members.length===0) return '<div style="padding:0 16px;font-size:12px;color:#c8b89a">\u8acb\u5148\u8a2d\u5b9a\u884c\u7a0b\u6210\u54e1</div>';
  var html = '<div class="split-wrap">';
  html += '<div class="split-label">\u8cbb\u7528\u5206\u914d</div>';
  html += '<div class="split-tip">\u9ede\u9078\u8cbb\u7528\u5340\u584a\uff0c\u518d\u9ede\u4e0b\u65b9\u6210\u54e1\u982d\u50cf\u6307\u5b9a\u8ca0\u64d4\u4eba</div>';
  // Blocks
  html += '<div class="split-blocks" id="ef-split-blocks">';
  members.forEach(function(m,i){
    var mc = mcolor(i);
    var b = _splitBlocks[m.id]||{totalAmt:0,slices:[]};
    var rem = splitBlockRem(m.id);
    var isDone = rem<=0 && b.slices.length>0;
    html += '<div class="split-block'+(isDone?' done':'')+'" data-mid="'+m.id+'" id="sb-'+m.id+'" onclick="onSplitBlockClick(\''+m.id+'\')">'+
      '<div class="sb-name" style="color:'+mc.color+'">'+esc(m.name)+'</div>'+
      '<div class="sb-amt" style="color:'+mc.text+'">'+(total?fmtExp(b.totalAmt):'¥0')+'</div>'+
      (isDone?'<div class="sb-tag" style="color:#7bed9f">&#10003; \u5206\u914d\u5b8c</div>':
       rem>0&&rem<b.totalAmt?'<div class="sb-tag" style="color:var(--accent)">\u5269 '+fmtExp(rem)+'</div>':
       '<div class="sb-tag" style="color:#c8b89a">\u672a\u5206\u914d</div>')+
    '</div>';
  });
  html += '</div>';
  // Divider + heads
  html += '<div class="split-divider"></div>';
  html += '<div class="split-label">\u7531\u8ab0\u8ca0\u64d4</div>';
  html += '<div class="split-members" id="ef-split-members">';
  members.forEach(function(m,i){
    var mc = mcolor(i);
    var amt = splitPayerTotal(m.id);
    var isTarget = _expSplitSelected && _expSplitSelected!==m.id;
    html += '<div class="split-head'+(isTarget?' target-active':'')+'" data-mid="'+m.id+'" onclick="onSplitHeadClick(\''+m.id+'\')" id="sh-'+m.id+'">'+
      '<div class="split-av" style="background:'+mc.bg+';color:'+mc.color+';border-color:'+(amt>0?mc.color:'transparent')+'">'+m.name[0]+'</div>'+
      '<div class="split-nm" style="color:'+mc.color+'">'+esc(m.name)+'</div>'+
      '<div class="split-amt" style="color:'+(amt>0?mc.color:'#5a7390')+'">'+(amt>0?fmtExp(amt):'—')+'</div>'+
    '</div>';
  });
  html += '</div>';
  // Result summary
  var unalloc = members.reduce(function(s,m){return s+splitBlockRem(m.id);},0);
  if(unalloc>0){
    html += '<div style="font-size:11px;color:#ff6b6b;padding:4px 0">\u26a0 \u5c1a\u6709 '+fmtExp(unalloc)+' \u672a\u5206\u914d</div>';
  }
  html += '</div>';
  return html;
}

function buildPersonalArea(exp){
  var personalType = exp?exp.personalType:'self';
  var html = '<div style="padding:0 16px 8px">';
  html += '<div class="fl" style="margin-bottom:8px">\u6027\u8cea</div>';
  html += '<div style="display:flex;gap:8px;margin-bottom:12px">'+
    '<button class="share-btn'+(personalType==='self'?' sel':'')+'" onclick="selPersonalType(\'self\')">\u500b\u4eba\u81ea\u7528</button>'+
    '<button class="share-btn'+(personalType==='proxy'?' sel':'')+'" onclick="selPersonalType(\'proxy\')">\u4ee3\u8cfc</button>'+
  '</div>';
  if(personalType==='proxy'){
    html += '<div class="fl">\u4ee3\u8cfc\u660e\u7d30</div>';
    var items = exp&&exp.proxyItems?exp.proxyItems:[];
    html += '<div id="ef-proxy-list">';
    items.forEach(function(item,i){
      html += buildProxyItemRow(item,i);
    });
    html += '</div>';
    html += '<button onclick="addProxyItem()" style="width:100%;padding:8px;border:1px dashed var(--border2);border-radius:8px;background:none;color:#c8b89a;font-size:12px;cursor:pointer;margin-top:4px">+ \u65b0\u589e\u4ee3\u8cfc\u9805\u76ee</button>';
  }
  html += '</div>';
  return html;
}

function buildProxyItemRow(item,i){
  var members = tripMembers();
  return '<div class="proxy-item" data-pidx="'+i+'" id="pi-'+i+'">'+
    '<input class="fi fi-sm" placeholder="\u9805\u76ee\u540d\u7a31" value="'+ea(item.name||'')+'" style="flex:2" oninput="_expDirty=true">'+
    '<select class="fsel" style="flex:1;font-size:11px;padding:6px 8px" onchange="_expDirty=true">'+
      members.map(function(m){ return '<option value="'+m.id+'"'+(item.forId===m.id?' selected':'')+'>'+esc(m.name)+'</option>'; }).join('')+
    '</select>'+
    '<input class="fi fi-sm" type="number" placeholder="\u91d1\u984d" value="'+ea(item.amount||'')+'" style="flex:1" oninput="_expDirty=true">'+
    '<button class="proxy-del" onclick="removeProxyItem('+i+')">\u00d7</button>'+
  '</div>';
}

function onSplitBlockClick(mid){
  var rem = splitBlockRem(mid);
  _expSplitSelected = (_expSplitSelected===mid||rem<=0) ? null : mid;
  refreshSplitUI();
}

function onSplitHeadClick(pid){
  if(!_expSplitSelected) return;
  var mid = _expSplitSelected;
  var rem = splitBlockRem(mid);
  if(rem<=0){ _expSplitSelected=null; refreshSplitUI(); return; }
  showSplitPopup(mid, pid, rem);
}

function showSplitPopup(mid, pid, remaining){
  var members = tripMembers();
  var pidx = members.findIndex(function(m){return m.id===pid;});
  var midx = members.findIndex(function(m){return m.id===mid;});
  var mc = mcolor(pidx>=0?pidx:0);
  var bmc = mcolor(midx>=0?midx:0);
  var cur = (document.getElementById('ef-currency')||{value:'JPY'}).value;
  var RATIOS=[{l:'\u5168\u90e8',r:1},{l:'½',r:.5},{l:'⅓',r:1/3},{l:'¼',r:.25},{l:'⅔',r:2/3},{l:'¾',r:.75}];
  var tm = members[pidx]||{name:'?'}, bm = members[midx]||{name:'?'};
  var ov = document.createElement('div');
  ov.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.7);display:flex;align-items:flex-end;justify-content:center;z-index:500';
  ov.onclick=function(e){if(e.target===ov)ov.remove();};
  var box = document.createElement('div');
  box.style.cssText='background:#1e2d3d;border-radius:18px 18px 0 0;width:100%;max-width:420px;padding:18px 16px 28px';
  box.innerHTML='<div style="font-size:14px;font-weight:700;color:#e0d4c0;margin-bottom:3px">'+esc(bm.name)+' \u7684\u8cbb\u7528 \u2192 <span style="color:'+mc.color+'">'+esc(tm.name)+'</span>\u8ca0\u64d4</div>'+
    '<div style="font-size:12px;color:#c8b89a;margin-bottom:14px">\u53ef\u5206\u914d\uff1a'+fmtAmt(remaining,cur)+'</div>'+
    '<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px" id="sp-ratios"></div>'+
    '<div style="display:flex;gap:8px;margin-bottom:8px">'+
      '<input type="number" id="sp-custom" placeholder="\u81ea\u8a02\u91d1\u984d" inputmode="numeric" style="flex:1;background:#162030;border:1px solid rgba(255,255,255,.2);border-radius:8px;color:#f0e6d3;font-size:15px;padding:8px 12px;outline:none" oninput="checkSplitCustom('+remaining+')">'+
      '<button onclick="applySplitCustom(\''+mid+'\',\''+pid+'\','+remaining+')" style="padding:8px 14px;border-radius:8px;background:rgba(232,184,75,.15);border:1.5px solid var(--accent);color:var(--accent);font-size:13px;font-weight:700;cursor:pointer">\u78ba\u5b9a</button>'+
    '</div>'+
    '<div id="sp-warn" style="font-size:11px;color:#ff6b6b;min-height:16px;margin-bottom:8px"></div>'+
    '<button onclick="this.closest(\'div[style*=fixed]\').remove()" style="width:100%;padding:9px;border-radius:8px;background:none;border:1px solid rgba(255,255,255,.15);color:#c8b89a;font-size:13px;cursor:pointer">\u53d6\u6d88</button>';
  var rg = box.querySelector('#sp-ratios');
  RATIOS.forEach(function(r){
    var amt=Math.round(remaining*r.r);
    var btn=document.createElement('button');
    btn.style.cssText='padding:10px 4px;border-radius:9px;font-size:13px;font-weight:700;cursor:pointer;border:1.5px solid rgba(255,255,255,.15);background:#162030;color:#f0e6d3;text-align:center';
    btn.innerHTML='<div style="font-size:15px">'+r.l+'</div><div style="font-size:10px;color:#c8b89a;margin-top:2px">'+fmtAmt(amt,cur)+'</div>';
    btn.onclick=function(){applySplitRatio(mid,pid,amt,remaining,ov);};
    rg.appendChild(btn);
  });
  ov.appendChild(box);
  document.body.appendChild(ov);
}

function checkSplitCustom(remaining){
  var v=parseInt(document.getElementById('sp-custom').value)||0;
  var w=document.getElementById('sp-warn');
  if(w) w.textContent=v>remaining?'\u8d85\u904e\u53ef\u5206\u914d\u91d1\u984d':'';
}
function applySplitRatio(mid,pid,amt,remaining,ov){
  _splitBlocks[mid].slices.push({pid:pid,amt:amt,locked:false});
  if(ov) ov.remove();
  var newRem=splitBlockRem(mid);
  if(newRem<=0) _expSplitSelected=null;
  refreshSplitUI(); _expDirty=true;
}
function applySplitCustom(mid,pid,remaining){
  var v=parseInt(document.getElementById('sp-custom').value)||0;
  if(v<=0){document.getElementById('sp-warn').textContent='\u8acb\u8f38\u5165\u91d1\u984d';return;}
  if(v>remaining){document.getElementById('sp-warn').textContent='\u8d85\u904e\u53ef\u5206\u914d\u91d1\u984d';return;}
  _splitBlocks[mid].slices.push({pid:pid,amt:v,locked:true});
  document.querySelector('div[style*=fixed]').remove();
  var newRem=splitBlockRem(mid);
  if(newRem<=0) _expSplitSelected=null;
  refreshSplitUI(); _expDirty=true;
}

function refreshSplitAmounts(){
  var total=parseInt((document.getElementById('ef-amount')||{value:'0'}).value)||0;
  var members=tripMembers();
  if(!members.length)return;
  // Only reinit if blocks are all unassigned
  var anyAssigned=Object.keys(_splitBlocks).some(function(mid){return _splitBlocks[mid].slices.length>0;});
  if(!anyAssigned) initSplitBlocks(total,members);
  // Just update totalAmt proportionally if no slices
  refreshSplitUI();
}

function refreshSplitUI(){
  var members=tripMembers();
  var shareType=(document.getElementById('sb-shared')||{}).classList&&document.getElementById('sb-shared').classList.contains('sel')?'shared':'personal';
  if(shareType!=='shared')return;
  var area=document.getElementById('ef-share-area');
  if(area) area.innerHTML=buildSplitArea(members,null);
}

function selExpCat(cat){
  document.querySelectorAll('.cat-btn').forEach(function(b){b.classList.toggle('sel',b.dataset.cat===cat);});
  _expDirty=true;
}
function selExpPayer(mid){
  var members=tripMembers();
  document.querySelectorAll('#ef-payer-row .member-chip').forEach(function(c){
    var i=members.findIndex(function(m){return m.id===c.dataset.mid;});
    var mc=mcolor(i>=0?i:0);
    var isSel=c.dataset.mid===mid;
    c.classList.toggle('sel',isSel);
    c.style.borderColor=isSel?mc.color:'';
    c.style.background=isSel?mc.bg:'';
    c.style.color=isSel?mc.color:'';
  });
  _expDirty=true;
}
function selShareType(t){
  document.getElementById('sb-shared').classList.toggle('sel',t==='shared');
  document.getElementById('sb-personal').classList.toggle('sel',t==='personal');
  var members=tripMembers();
  document.getElementById('ef-share-area').innerHTML=t==='shared'?buildSplitArea(members,null):buildPersonalArea(null);
  _expDirty=true;
}
function selPersonalType(t){
  document.querySelectorAll('.share-btn').forEach(function(b){
    if(b.textContent.includes('\u500b\u4eba')||b.textContent.includes('\u4ee3\u8cfc'))
      b.classList.toggle('sel',b.textContent.includes(t==='self'?'\u500b\u4eba':'\u4ee3\u8cfc'));
  });
  document.getElementById('ef-share-area').innerHTML=buildPersonalArea(null);
  _expDirty=true;
}
function addProxyItem(){
  var list=document.getElementById('ef-proxy-list'); if(!list)return;
  var idx=list.querySelectorAll('.proxy-item').length;
  var div=document.createElement('div');
  div.innerHTML=buildProxyItemRow({name:'',forId:'',amount:''},idx);
  list.appendChild(div.firstChild);
  _expDirty=true;
}
function removeProxyItem(i){
  var el=document.getElementById('pi-'+i); if(el)el.remove(); _expDirty=true;
}

function fmtExp(n){
  var cur=(document.getElementById('ef-currency')||{value:'JPY'}).value;
  return fmtAmt(n,cur);
}
function fmtAmt(n,cur){
  n=Math.round(n);
  if(cur==='JPY')return'\xA5'+n.toLocaleString();
  if(cur==='TWD')return'NT$'+n.toLocaleString();
  return'$'+n.toLocaleString();
}

function collectExpense(){
  var cat=(document.querySelector('.cat-btn.sel')||{dataset:{cat:'other'}}).dataset.cat;
  var desc=(document.getElementById('ef-desc')||{value:''}).value.trim();
  var amount=parseFloat((document.getElementById('ef-amount')||{value:'0'}).value)||0;
  var currency=(document.getElementById('ef-currency')||{value:'JPY'}).value;
  var paidBy='';
  var payerEl=document.querySelector('#ef-payer-row .member-chip.sel');
  if(payerEl) paidBy=payerEl.dataset.mid;
  var shareType=document.getElementById('sb-shared').classList.contains('sel')?'shared':'personal';
  var splits=[];
  if(shareType==='shared'){
    var members=tripMembers();
    members.forEach(function(m){
      splits.push({mid:m.id,slices:(_splitBlocks[m.id]?_splitBlocks[m.id].slices:[])||[]});
    });
  }
  var personalType='self';
  var proxyItems=[];
  return {id:uid(),category:cat,desc:desc,amount:amount,currency:currency,
    paidBy:paidBy,shareType:shareType,splits:splits,personalType:personalType,proxyItems:proxyItems};
}

function saveExpense(){
  var ctx=_expCtx; if(!ctx)return;
  var exp=collectExpense();
  if(!exp.desc){alert('\u8acb\u8f38\u5165\u8cbb\u7528\u8aaa\u660e');return;}
  if(!exp.amount){alert('\u8acb\u8f38\u5165\u91d1\u984d');return;}
  var d=trip()&&trip().days?trip().days[ctx.dayIdx]:null; if(!d)return;
  if(ctx.source==='day'){
    if(!d.expenses)d.expenses=[];
    if(ctx.expIdx!==undefined)d.expenses[ctx.expIdx]=exp;
    else d.expenses.push(exp);
  } else if(ctx.source==='stop'){
    var stop=(d.stops||[])[ctx.stopIdx]; if(!stop)return;
    if(!stop.expenses)stop.expenses=[];
    if(ctx.expIdx!==undefined)stop.expenses[ctx.expIdx]=exp;
    else stop.expenses.push(exp);
  }
  save(S.trips); _expDirty=false;
  goBack('sc-day'); renderDayTL();
}

function deleteExpense(){
  var ctx=_expCtx; if(!ctx)return;
  var d=trip()&&trip().days?trip().days[ctx.dayIdx]:null; if(!d)return;
  if(ctx.source==='day'&&ctx.expIdx!==undefined){
    d.expenses.splice(ctx.expIdx,1);

    var stop=(d.stops||[])[ctx.stopIdx]; if(stop)stop.expenses.splice(ctx.expIdx,1);

// 從地點的 importFare 設定自動建立/更新費用表
function importStopExpenses(d, stop) {
  if (!d || !stop) return;
  if (!d.expenses) d.expenses = [];

  // ── 交通費用（transit routes 中 planned 且 importFare=true）──
  var transit = stop.transit;
  if (transit && transit.routes) {
    var planned = transit.routes.find(function(r){ return r.tag === 'planned'; });
    if (planned && planned.importFare && planned.fare && planned.fare > 0) {
      var sourceId = stop.id + '_transit';
      var cat = classifyTransport(planned);
      var title = esc(transit.fromPlace||stop.name||'') + ' → ' + esc(transit.toPlace||'') + '（' + cat.label + '）';
      var payer = members_findById(planned.payerId);
      upsertExpense(d, sourceId, {
        sourceId: sourceId,
        category: 'transport',
        desc: title,
        amount: planned.fare,
        currency: planned.fareCurrency || 'JPY',
        payMethod: planned.payMethod || '',
        paidBy: planned.payerId || '',
        splitType: 'shared',
        splits: []
      });
    } else {
      // importFare=false 或無費用：移除已帶入的費用
      removeExpenseBySourceId(d, stop.id + '_transit');
    }
  }

  // ── 住宿費用 ──
  if (stop.type === 'hotel' && stop.hotel) {
    var hotel = stop.hotel;
    if (hotel.importFare && hotel.amount && hotel.amount > 0) {
      var hotelSourceId = stop.id + '_hotel';
      upsertExpense(d, hotelSourceId, {
        sourceId: hotelSourceId,
        category: 'hotel',
        desc: stop.name || '住宿費',
        amount: hotel.amount,
        currency: hotel.currency || 'JPY',
        payMethod: hotel.payMethod || '',
        paidBy: hotel.payerId || '',
        splitType: 'shared',
        splits: []
      });
    } else {
      removeExpenseBySourceId(d, stop.id + '_hotel');
    }
  }
}

// 新增或更新費用（以 sourceId 為唯一鍵）
function upsertExpense(d, sourceId, expData) {
  if (!d.expenses) d.expenses = [];
  var idx = d.expenses.findIndex(function(e){ return e.sourceId === sourceId; });
  if (idx >= 0) {
    // 更新金額/幣別/付款資訊，保留已設定的分配
    var existing = d.expenses[idx];
    existing.amount = expData.amount;
    existing.currency = expData.currency;
    existing.payMethod = expData.payMethod;
    existing.paidBy = expData.paidBy;
    existing.title = expData.title;
    existing.category = expData.category;
  } else {
    d.expenses.push(Object.assign({ id: uid() }, expData));
  }
}

// 移除帶入的費用（importFare 取消時）
function removeExpenseBySourceId(d, sourceId) {
  if (!d.expenses) return;
  d.expenses = d.expenses.filter(function(e){ return e.sourceId !== sourceId; });
}

// 輔助：by member id
function members_findById(id) {
  var members = tripMembers();
  return members.find(function(m){ return m.id === id; }) || null;
}


// 一次性補跑：掃描所有地點，補建 importFare 費用記錄
function migrateImportFareOnce() {
  var MIGRATE_KEY = 'travel_import_fare_migrated_v2';
  if (localStorage.getItem(MIGRATE_KEY)) return; // 已跑過
  var t = trip(); if (!t) return;
  var changed = false;
  (t.days || []).forEach(function(d) {
    (d.stops || []).forEach(function(stop) {
      // 交通
      var transit = stop.transit;
      if (transit && transit.routes) {
        var planned = transit.routes.find(function(r){ return r.tag === 'planned'; });
        if (planned && planned.importFare && planned.fare && planned.fare > 0) {
          importStopExpenses(d, stop);
          changed = true;
        }
      }
      // 住宿
      if (stop.type === 'hotel' && stop.hotel && stop.hotel.importFare && stop.hotel.amount > 0) {
        importStopExpenses(d, stop);
        changed = true;
      }
    });
  });
  if (changed) save(S.trips);
  localStorage.setItem(MIGRATE_KEY, '1');
}

}


function onChangeCalcDuration(ri){
  var depEl=document.getElementById('tp-v-srd-'+ri+'-dep');
  var arrEl=document.getElementById('tp-v-srd-'+ri+'-arr');
  if(!depEl||!arrEl||!depEl.value||!arrEl.value)return;
  var dep=depEl.value.split(':'), arr=arrEl.value.split(':');
  var depMin=parseInt(dep[0])*60+parseInt(dep[1]);
  var arrMin=parseInt(arr[0])*60+parseInt(arr[1]);
  var diff=arrMin-depMin;
  if(diff<0)diff+=1440; // cross midnight
  var durEl=document.querySelector('[data-ri="'+ri+'"][data-field="duration"]');
  setStopRouteField(ri,'duration',diff);
  var fmt=document.getElementById('dur-fmt-'+ri);if(fmt)fmt.textContent=fmtDuration(diff);
  _stopDirty=true;
}

var _ttSelectorMulti = false;   // 是否為多選模式

 // 當前正在編輯的 stop index

function openTimetableSelector() {

  _ttSelectorStopIdx = S.stopIdx;

// 渲染班次選擇卡片（當天所有班次）
function renderTimetableSelector(d) {
  var body = document.getElementById('timetable-selector-body');
  if (!body) return;
  var t = trip();
  var schedules = (t && t.timetables) || [];
  // 動態計算當天日期（優先用 S.dayIdx，備用 indexOf）
  var t2 = trip();
  var dayDate = '';
  if (t2 && t2.startDate) {
    var dayIdx = (S.dayIdx !== null && S.dayIdx !== undefined) ? S.dayIdx : (t2.days ? t2.days.indexOf(d) : -1);
    if (dayIdx >= 0) {
      var dd2 = new Date(t2.startDate);
      dd2.setDate(dd2.getDate() + dayIdx);
      dayDate = dd2.getFullYear() + '-' +
        String(dd2.getMonth()+1).padStart(2,'0') + '-' +
        String(dd2.getDate()).padStart(2,'0');
    }
  }

  // 篩選當天班次（有日期就比對，無日期的全部顯示）
  var filtered = schedules.filter(function(s) {
    if (!s.date) return true;
    return s.date === dayDate;
  });

  if (!filtered.length) {
    body.innerHTML = '<div style="padding:32px 20px;text-align:center;color:#c8b89a;font-size:14px">' +
      '當天無匯入班次。<br><br>' +
      '<button onclick="goBack(\u0027sc-timetable-selector\u0027);openTimetable();" style="padding:10px 20px;background:rgba(110,198,240,.15);border:1px solid rgba(110,198,240,.3);border-radius:8px;color:#6ec6f0;font-size:13px;cursor:pointer">\u524d\u5f80\u532f\u5165\u73ed\u6b21</button>' +
      '</div>';
    return;
  }

  var isMulti = _ttSelectorMulti || false;

  // 建立已選 timetableIdx → tag 的對照表
  var stop2 = _ttSelectorStopIdx !== null ? ((d && d.stops || [])[_ttSelectorStopIdx]) : null;
  var existRoutes = (stop2 && stop2.transit && stop2.transit.routes) || [];
  var selectedMap = {}; // origIdx -> tag label
  var plannedCount = 0, backupCount = 0;
  existRoutes.forEach(function(r) {
    // 找對應的 timetable index（用 departTime+from+to 比對）
    if (!r.legs || !r.legs.length) return;
    schedules.forEach(function(s, si) {
      var match = (s.departTime === r.departTime && s.arriveTime === r.arriveTime);
      if (match) {
        if (r.tag === 'planned') {
          selectedMap[si] = '已選 ★預定';
        } else {
          backupCount++;
          selectedMap[si] = '已選 候補' + backupCount;
        }
      }
    });
  });

  var html = '<div style="padding:12px 16px 0">' +
    '<div style="font-size:12px;color:#c8b89a;margin-bottom:12px">' + (isMulti ? '可複選班次，選好後點「套用」' : '選擇要套用到此段交通的班次：') + '</div>';

  filtered.forEach(function(s, idx) {

    var origIdx = schedules.indexOf(s);
    // 建立 legs 詳細資訊
    var legsHtml = '';
    if (s.legs && s.legs.length) {
      s.legs.forEach(function(leg, li) {
        var legLine = leg.line_name || '';
        var legDest = leg.destination_for || '';
        var legDep = leg.departure_station || '';
        var legArr = leg.arrival_station || '';
        var legDepTime = leg.departure_time || '';
        var legArrTime = leg.arrival_time || '';
        var legDepPlatform = leg.departure_platform || '';
        var legArrPlatform = leg.arrival_platform || '';
        var isDirect = leg.is_through_service ? '直通' : '';
        legsHtml += '<div style="margin-top:8px;padding-top:8px;border-top:1px solid var(--border)">' +
          '<div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:3px">' +
            '<div style="font-size:11px;color:#c8b89a">&#9312;</div>'.replace('&#9312;', '&#' + (9311+li+1) + ';') +
            '<div style="font-size:12px;font-weight:600;color:#e0d4c0">' + esc(legLine) + '</div>' +
            (legDest ? '<div style="font-size:11px;color:#c8b89a">(' + esc(legDest) + ')</div>' : '') +
            (isDirect ? '<div style="font-size:10px;color:#7bed9f;background:rgba(123,237,159,.1);border:1px solid rgba(123,237,159,.3);padding:1px 6px;border-radius:4px">直通</div>' : '') +
          '</div>' +
          '<div style="font-size:11px;color:#c8b89a;padding-left:14px">' +
            esc(legDep) + (legDepPlatform ? '（' + esc(legDepPlatform) + '）' : '') + ' ' + esc(legDepTime) +
            ' → ' + esc(legArr) + (legArrPlatform ? '（' + esc(legArrPlatform) + '）' : '') + ' ' + esc(legArrTime) +
          '</div>' +
        '</div>';
      });
    }

    // IC/現金票價分開顯示（-1 視為無資料）
    var fareHtml = '';
    var sic = s.fare_ic && s.fare_ic > 0 ? s.fare_ic : 0;
    var stk = s.fare_ticket && s.fare_ticket > 0 ? s.fare_ticket : 0;
    if (sic && stk) fareHtml = '¥' + sic + '（IC）/ ¥' + stk + '（現金）';
    else if (sic) fareHtml = '¥' + sic + '（IC）';
    else if (s.fare && s.fare > 0) fareHtml = '¥' + esc(String(s.fare));

    var isSelected = _ttSelectedIdxs && _ttSelectedIdxs.indexOf(origIdx) >= 0;
    var alreadyTag = selectedMap[origIdx] || null;

    html += '<div ' + (isDisabled ? '' : 'onclick="toggleTimetableSelect(' + origIdx + ')"') + ' style="background:' + (isDisabled ? 'var(--bg2)' : 'var(--bg3)') + ';border:2px solid ' + (isDisabled ? 'var(--border)' : isSelected ? '#6ec6f0' : 'rgba(110,198,240,.25)') + ';border-radius:12px;padding:14px 16px;margin-bottom:10px;' + (isDisabled ? 'opacity:.45' : 'cursor:pointer') + ';position:relative">' +
      (alreadyTag ? '<div style="position:absolute;top:10px;right:12px;font-size:10px;padding:2px 7px;border-radius:6px;background:rgba(110,198,240,.15);color:#6ec6f0;border:1px solid rgba(110,198,240,.3)">' + alreadyTag + '</div>' : '') +
      (!isDisabled && isSelected ? '<div style="position:absolute;top:10px;right:12px;width:18px;height:18px;background:#6ec6f0;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;color:#0f1923">✓</div>' : '') +
      '<div style="font-size:11px;color:#c8b89a;margin-bottom:6px">' + cat2.icon + ' ' + cat2.label + '</div>' +
      // 標題行：出發→到達 + 乘換
      '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">' +
        '<div style="font-size:13px;font-weight:700;color:#e0d4c0">' + esc(s.from || '') + ' → ' + esc(s.to || '') + '</div>' +
        (s.transfers !== undefined ? '<div style="font-size:11px;color:#c8b89a">乘換 ' + s.transfers + ' 次</div>' : '') +
      '</div>' +
      // 時間 + 所需時間
      '<div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:4px">' +
        '<div style="font-size:16px;font-weight:700;color:#6ec6f0">' + esc(s.departTime || '') + ' → ' + esc(s.arriveTime || '') + '</div>' +
        (s.duration ? '<div style="font-size:12px;color:#c8b89a">' + esc(s.duration) + '</div>' : '') +
      '</div>' +
      // 票價
      (fareHtml ? '<div style="font-size:12px;color:#c8b89a;margin-bottom:2px">' + fareHtml + '</div>' : '') +
      // Legs 詳情
      legsHtml +
    '</div>';
  });

  html += '</div>';
  // 套用按鈕（多選模式）
  if (_ttSelectorMulti) {
    html += '<div style="padding:12px 16px"><button onclick="applyMultiTimetable()" style="width:100%;padding:12px;background:var(--accent);border:none;border-radius:var(--radius-sm);color:#0f1923;font-size:14px;font-weight:700;cursor:pointer">套用已選方案</button></div>';
  }
  body.innerHTML = html;
}


// 切換班次選取狀態（多選模式）
function toggleTimetableSelect(origIdx) {
  if (!_ttSelectorMulti) {

    applyTimetable(origIdx);

  // 多選模式：toggle
  var pos = _ttSelectedIdxs.indexOf(origIdx);

    _ttSelectedIdxs.splice(pos, 1);

    _ttSelectedIdxs.push(origIdx);

}

// 執行解析匯入
async function doTimetableImport() {
  var t = trip(); if (!t) return;
  var textInput = document.getElementById('tt-text-input').value.trim();
  var btn = document.querySelector('#sc-timetable-import .btn-primary');
  if (btn) { btn.textContent = '解析中…'; btn.disabled = true; }

  try {
    var result;
    if (_ttFile) {
      // 圖片或 PDF → base64 → Gemini
      var b64 = await new Promise(function(res, rej) {
        var r = new FileReader();
        r.onload = function() { res(r.result.split(',')[1]); };
        r.onerror = rej;
        r.readAsDataURL(_ttFile);
      });
      alert('圖片/PDF 匯入目前不支援，請改用 AI 整理後的 JSON 文字貼上。');
      return;
    } else if (textInput) {
      // 先嘗試直接解析 JSON（如 AI 預先整理好的格式）
      try {
        var parsed = JSON.parse(textInput);
        // 支援 {routes:[...]} 或 {schedules:[...]} 兩種格式
        if (parsed.schedules) {
          result = { stat: 'OK', schedules: parsed.schedules };
        } else if (parsed.routes) {
          // 將 routes 格式轉換為 schedules 格式
          result = { stat: 'OK', schedules: parsed.routes.map(function(r) {
            var firstLeg = (r.legs || [])[0] || {};
            var lastLeg = (r.legs || []).slice(-1)[0] || {};
            return {
              from: firstLeg.departure_station || '',
              to: lastLeg.arrival_station || '',
              departTime: r.departure_time || firstLeg.departure_time || '',
              arriveTime: r.arrival_time || lastLeg.arrival_time || '',
              trainName: (r.legs || []).map(function(l){return l.line_name||'';}).filter(Boolean).join(' → '),
              duration: r.duration_minutes ? r.duration_minutes + '分' : '',
              fare: r.fare ? (r.fare.ic_yen || r.fare.ticket_yen || '') : '',
              fare_ic: r.fare && r.fare.ic_yen > 0 ? r.fare.ic_yen : '',
              fare_ticket: r.fare && r.fare.ticket_yen > 0 ? r.fare.ticket_yen : '',
              date: (parsed.search_meta && parsed.search_meta.search_departure_date) || '',
              transfers: r.transfers || 0,
              legs: r.legs || []
            };
          })};
        } else {
          throw new Error('未知格式');
        }
      } catch(jsonErr) {
        // 非 JSON 格式：提示使用者先用 AI 整理
        alert('請貼上 JSON 格式的班次資料。\n可使用 AI（如 ChatGPT/Gemini）將 Navitime 時刻表整理成 JSON 後再貼入。');
        return;
      }
    } else {
      alert('請選擇檔案或貼上文字');
      return;
    }

    if (!result || result.stat !== 'OK' || !result.schedules || !result.schedules.length) {
      alert('解析失敗：' + (result && result.error ? result.error : '無法取得班次資料'));
      return;
    }

    // 合併到行程的 timetables 陣列
    if (!t.timetables) t.timetables = [];
    // 去重複：以 from+to+departTime+date 為唯一鍵
    var existing = t.timetables.map(function(s){
      return (s.from||'')+'|'+(s.to||'')+'|'+(s.departTime||'')+'|'+(s.date||'');
    });
    var added = 0;
    result.schedules.forEach(function(s) {
      var key = (s.from||'')+'|'+(s.to||'')+'|'+(s.departTime||'')+'|'+(s.date||'');
      if (existing.indexOf(key) < 0) {
        t.timetables.push(s);
        existing.push(key);
        added++;
      }
    });
    save(S.trips);
    alert(added > 0 ? '成功匯入 ' + added + ' 筆班次' + (result.schedules.length - added > 0 ? '，略過 ' + (result.schedules.length - added) + ' 筆重複' : '') : '所有班次已存在，無新增');
    goBack('sc-timetable');
    renderTimetable();
  } catch(e) {
    alert('匯入失敗：' + e.message);
  } finally {
    if (btn) { btn.textContent = '解析匯入'; btn.disabled = false; }
  }
}


// 從路線名稱判斷交通工具類別
function classifyTransport(s) {
  // 優先用 legs[0].mode（手動路線）
  var legMode = s.legs && s.legs[0] ? s.legs[0].mode || '' : '';
  var modeMap = {
    walk:     { icon: '🚶', label: '步行' },
    shuttle:  { icon: '🚐', label: '接送車' },
    car:      { icon: '🚗', label: '私家車' },
    taxi:     { icon: '🚕', label: '計程車' },
    ferry:    { icon: '⛴️', label: '渡輪' },
    flight:   { icon: '✈️', label: '航班' },
  };
  if (modeMap[legMode]) return modeMap[legMode];
  // 用路線名稱判斷（匯入班次）
  var orig = (s.trainName || '') + ' ' + (s.legs && s.legs[0] ? (s.legs[0].line_name || '') : '');
  if (/高速バス|高速巴士|highwaybus/i.test(orig)) return { icon: '🚌', label: '高速巴士' };
  if (/新幹線|はやぶさ|のぞみ|こまち|やまびこ|つばさ|かがやき|はくたか|あさま/i.test(orig)) return { icon: '🚄', label: '新幹線' };
  if (/特急|limited express/i.test(orig)) return { icon: '🚆', label: '特急' };
  if (/快速/i.test(orig)) return { icon: '🚆', label: '快速電車' };
  if (/地下鉄|地鐵|subway|metro/i.test(orig)) return { icon: '🚇', label: '地鐵' };
  if (/バス|巴士|bus/i.test(orig)) return { icon: '🚌', label: '巴士' };
  if (/空港線|airport/i.test(orig)) return { icon: '🚃', label: '機場線' };
  if (/モノレール|monorail/i.test(orig)) return { icon: '🚝', label: '單軌列車' };
  if (/フェリー|ferry|渡輪/i.test(orig)) return { icon: '⛴️', label: '渡輪' };
  if (legMode === 'bus') return { icon: '🚌', label: '巴士' };
  if (legMode === 'shinkansen') return { icon: '🚄', label: '新幹線' };
  if (legMode === 'train') return { icon: '🚃', label: '電車' };
  return { icon: '🚃', label: '電車' };
}

// 渲染班次列表
function renderTimetable() {
  var t = trip();
  var body = document.getElementById('timetable-body');
  if (!body) return;
  var schedules = (t && t.timetables) || [];
  var now = new Date();

  if (!schedules.length) {
    body.innerHTML = '<div style="padding:32px 20px;text-align:center;color:#c8b89a;font-size:14px">尚無班次，點右上角「匯入」新增</div>';
    return;
  }

  // 依出發時間排序
  var sorted = schedules.slice().sort(function(a, b) {
    return (a.departTime || '').localeCompare(b.departTime || '');
  });

  var html = '<div style="padding:12px 16px 0">';
  sorted.forEach(function(s, idx) {
    // 判斷班次是否已過
    var isPast = false;
    if (s.date && s.departTime) {
      var depDt = new Date(s.date + 'T' + s.departTime);
      isPast = depDt < now;
    }

    // fare 顯示
    var fareStr = '';
    var fareIc = s.fare_ic && s.fare_ic > 0 ? s.fare_ic : 0;
    var fareTk = s.fare_ticket && s.fare_ticket > 0 ? s.fare_ticket : 0;
    if (fareIc && fareTk) fareStr = '¥' + fareIc + '（IC）/ ¥' + fareTk + '（現金）';
    else if (fareIc) fareStr = '¥' + fareIc + '（IC）';
    else if (s.fare && s.fare > 0) fareStr = '¥' + s.fare;
    // legs 摘要
    var legsSummary = '';
    if (s.legs && s.legs.length) {
      legsSummary = '<div style="margin-top:6px">';
      s.legs.forEach(function(leg, li) {
        legsSummary += '<div style="font-size:11px;color:#c8b89a;margin-top:2px">' +
          '&#' + (9311+li+1) + '; ' + esc(leg.line_name||'') +
          (leg.destination_for ? '（' + esc(leg.destination_for) + '）' : '') +
          (leg.is_through_service ? ' <span style="color:#7bed9f">直通</span>' : '') + ' ' +
          esc(leg.departure_station||'') + (leg.departure_platform ? '（' + esc(leg.departure_platform) + '）' : '') +
          ' → ' + esc(leg.arrival_station||'') + (leg.arrival_platform ? '（' + esc(leg.arrival_platform) + '）' : '') +
        '</div>';
      });
      legsSummary += '</div>';
    }
    var cat1 = classifyTransport(s);
    html += '<div style="background:var(--bg3);border:1px solid ' + (isPast ? 'var(--border)' : 'rgba(110,198,240,.3)') + ';border-radius:12px;padding:14px 16px;margin-bottom:10px;opacity:' + (isPast ? '.55' : '1') + '">' +
      '<div style="font-size:11px;color:#c8b89a;margin-bottom:6px">' + cat1.icon + ' ' + cat1.label + '</div>' +
      '<div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:6px">' +
        '<div style="font-size:13px;font-weight:700;color:#e0d4c0">' + esc(s.from || '') + ' → ' + esc(s.to || '') + '</div>' +
        '<button onclick="deleteTimetable(' + idx + ')" style="background:none;border:none;color:#c8b89a;font-size:16px;cursor:pointer;padding:0 0 0 8px">&times;</button>' +
      '</div>' +
      '<div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap">' +
        '<div style="font-size:15px;font-weight:700;color:' + (isPast ? '#c8b89a' : '#6ec6f0') + '">' + esc(s.departTime || '') + ' → ' + esc(s.arriveTime || '') + '</div>' +
        (s.duration ? '<div style="font-size:12px;color:#c8b89a">' + esc(s.duration) + '</div>' : '') +
        (s.transfers !== undefined ? '<div style="font-size:11px;color:#c8b89a">乘換 ' + s.transfers + ' 次</div>' : '') +
      '</div>' +
      (fareStr ? '<div style="font-size:12px;color:#c8b89a;margin-top:3px">' + fareStr + '</div>' : '') +
      legsSummary +
      (s.date ? '<div style="font-size:11px;color:#c8b89a;margin-top:4px">' + esc(s.date) + '</div>' : '') +
      (isPast ? '<div style="margin-top:8px;display:flex;gap:8px">' +
        '<button onclick="openNavitime(\'' + encodeURIComponent(s.from||'') + '\',\'' + encodeURIComponent(s.to||'') + '\')" style="flex:1;padding:8px;background:rgba(110,198,240,.12);border:1px solid rgba(110,198,240,.3);border-radius:8px;color:#6ec6f0;font-size:12px;cursor:pointer">連結 NAVITime</button>' +
      '</div>' : '') +
    '</div>';
  });
  html += '</div>';
  body.innerHTML = html;
}

// 刪除班次
function deleteTimetable(idx) {
  var t = trip(); if (!t || !t.timetables) return;
  // 找到排序後對應的原始 index
  var sorted = t.timetables.slice().sort(function(a, b) {
    return (a.departTime || '').localeCompare(b.departTime || '');
  });
  var target = sorted[idx];
  var origIdx = t.timetables.indexOf(target);
  if (origIdx < 0) return;
  if (!confirm('刪除此班次？')) return;
  t.timetables.splice(origIdx, 1);
  save(S.trips);
  renderTimetable();
}

// 開啟 NAVItime（自動判斷手機/PC）
function openNavitime(from, to) {
  var isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
  var f = decodeURIComponent(from), t2 = decodeURIComponent(to);
  var url;
  if (isMobile) {
    url = 'https://transfer.navitime.biz/5931bus/smart/transfer/Top?startName=' +
      encodeURIComponent(f) + '&goalName=' + encodeURIComponent(t2);
  } else {
    url = 'https://transfer.navitime.biz/5931bus/pc/transfer/Top?startName=' +
      encodeURIComponent(f) + '&goalName=' + encodeURIComponent(t2);
  }
  window.open(url, '_blank');
}

renderList();
initDayMode();
migrateImportFareOnce();

</script>
