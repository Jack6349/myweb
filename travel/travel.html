<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✈️</text></svg>">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0f1923">
<title>旅行行程</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0f1923;--bg2:#162030;--bg3:#1e2d3d;--bg4:#243447;
  --accent:#e8b84b;--accent2:#f0cc7a;
  --text:#e8edf2;--text2:#e0d4c0;--text3:#c8b89a;
  --border:rgba(255,255,255,.08);--border2:rgba(255,255,255,.14);
  --success:#4caf82;--danger:#ff6b6b;--info:#6ec6f0;
  --font:'Noto Sans TC',sans-serif;
  --radius:14px;--radius-sm:8px;
  --hdr:56px;--nav:64px;
  --sb:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:var(--font);overflow:hidden;}
button,input,select,textarea{font-family:var(--font);}
a{text-decoration:none;color:inherit;}

/* ── SCREENS ── */
.screen{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;
  transform:translateX(100%);transition:transform .28s cubic-bezier(.4,0,.2,1);z-index:10;}
.screen.active{transform:translateX(0);}

/* ── HEADER ── */
.hdr{height:var(--hdr);background:var(--bg2);border-bottom:1px solid var(--border);
  display:flex;align-items:center;padding:0 8px 0 4px;gap:4px;flex-shrink:0;}
.hdr-back{background:none;border:none;color:var(--text);cursor:pointer;padding:8px;display:flex;align-items:center;}
.hdr-title{font-size:17px;font-weight:700;flex:1;padding:0 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.hdr-sub{font-size:11px;color:#c8b89a;}
.hdr-btn{background:none;border:none;color:#e0d4c0;cursor:pointer;padding:8px;display:flex;align-items:center;}
.hdr-action{background:none;border:none;color:var(--info);cursor:pointer;font-size:13px;font-weight:600;padding:8px 10px;}
.hdr-action.primary{color:var(--accent);}
.hdr-action.danger{color:var(--danger);}

/* ── BODY ── */
.body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;}

/* ── BOTTOM BAR ── */
.bottom-bar{flex-shrink:0;padding:12px 16px calc(12px + var(--sb));
  background:var(--bg2);border-top:1px solid var(--border);display:flex;gap:8px;}

/* ── CARD ── */
.card{background:var(--bg3);border-radius:var(--radius);border:1px solid var(--border);
  margin:0 16px 10px;overflow:hidden;cursor:pointer;transition:border-color .15s;}
.card:active{opacity:.85;}
.card-pad{padding:14px 16px;}
.card-top{display:flex;align-items:center;gap:12px;}
.card-icon{width:44px;height:44px;border-radius:11px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.card-info{flex:1;min-width:0;}
.card-title{font-size:15px;font-weight:700;}
.card-sub{font-size:12px;color:#e0d4c0;margin-top:2px;}
.card-chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px;padding-top:10px;border-top:1px solid var(--border);}
.chip{font-size:11px;padding:2px 8px;border-radius:20px;background:var(--bg4);color:#e0d4c0;}
.chip.green{color:#7bed9f;background:rgba(123,237,159,.12);}
.chip.yellow{color:var(--accent);background:rgba(232,184,75,.12);}
.chip.blue{color:var(--info);background:rgba(110,198,240,.12);}
.chip.red{color:var(--danger);background:rgba(255,107,107,.12);}

/* ── SECTION ── */
.sec{font-size:11px;font-weight:700;color:#c8b89a;letter-spacing:.8px;
  text-transform:uppercase;padding:16px 16px 8px;}

/* ── TIME LINE (stops & segments) ── */
.tl{padding:8px 16px 80px;}
.tl-stop{display:flex;gap:10px;margin-bottom:0;}
.tl-stop-left{width:52px;flex-shrink:0;display:flex;flex-direction:column;align-items:flex-end;padding-top:10px;}
.tl-stop-time{font-size:11px;font-weight:600;color:#c8b89a;text-align:right;line-height:1.4;}
.tl-stop-time .arr{color:#e0d4c0;}
.tl-stop-time .dep{color:#f5d87a;}
.tl-stop-right{flex:1;min-width:0;}
.tl-stop-card{background:var(--bg3);border-radius:var(--radius-sm);border:1px solid var(--border);
  padding:10px 12px;margin-bottom:0;cursor:pointer;transition:border-color .15s;}
.tl-stop-card:active{opacity:.85;}
.tl-stop-card.anchor{border-color:rgba(232,184,75,.5);background:linear-gradient(135deg,rgba(232,184,75,.08),var(--bg3));}
.tl-stop-card.hotel{border-color:rgba(110,198,240,.4);background:linear-gradient(135deg,rgba(110,198,240,.08),var(--bg3));}
.tl-stop-name{font-size:14px;font-weight:700;}
.tl-stop-sub{font-size:11px;color:#c8b89a;margin-top:2px;}
.anchor-badge{font-size:9px;font-weight:800;color:var(--accent);
  background:rgba(232,184,75,.15);border:1px solid rgba(232,184,75,.3);
  padding:1px 5px;border-radius:3px;margin-left:6px;vertical-align:middle;}

/* ── SEGMENT ── */
.tl-seg{display:flex;gap:10px;margin:0;}
.tl-seg-left{width:52px;flex-shrink:0;display:flex;flex-direction:column;align-items:center;padding:0;}
.tl-seg-line{width:2px;background:var(--border2);flex:1;min-height:8px;border-radius:1px;}
.tl-seg-right{flex:1;min-width:0;padding:4px 0 4px;}
.tl-seg-card{background:var(--bg4);border-radius:var(--radius-sm);border:1px solid var(--border);
  padding:8px 12px;cursor:pointer;}
.tl-seg-card:active{opacity:.85;}
.tl-seg-empty{padding:8px 12px;border:1px dashed rgba(110,198,240,.3);border-radius:var(--radius-sm);
  color:var(--info);font-size:12px;cursor:pointer;text-align:center;}
.tl-seg-summary{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
.tl-seg-time{font-size:12px;font-weight:600;color:var(--text);}
.tl-seg-dur{font-size:11px;color:#c8b89a;}
.tl-seg-tag{font-size:9px;font-weight:700;padding:1px 5px;border-radius:3px;}
.tag-planned{color:#7bed9f;background:rgba(123,237,159,.15);}
.tag-backup{color:#c8b89a;background:var(--bg3);}
.tag-last{color:#ff7070;background:rgba(255,112,112,.12);}
.tl-seg-legs{margin-top:6px;border-top:1px solid var(--border);padding-top:6px;}
.tl-leg-row{display:flex;gap:8px;align-items:flex-start;padding:3px 0;font-size:11px;color:#e0d4c0;}
.tl-leg-icon{font-size:13px;flex-shrink:0;width:18px;text-align:center;}
.tl-leg-info{flex:1;min-width:0;}
.tl-leg-line{font-weight:600;color:var(--text);}
.tl-leg-detail{color:#c8b89a;margin-top:1px;}
.tl-add-stop{margin:4px 0 4px 62px;padding:7px 12px;border:1px dashed rgba(110,198,240,.3);
  border-radius:var(--radius-sm);font-size:12px;color:var(--info);cursor:pointer;
  background:none;width:calc(100% - 62px);text-align:center;}
.tl-add-top{margin:0 0 8px 62px;padding:6px 12px;border:1px dashed rgba(110,198,240,.3);
  border-radius:var(--radius-sm);font-size:11px;color:#9dd4f0;cursor:pointer;
  background:none;width:calc(100% - 62px);text-align:center;}

/* ── FORM ── */
.fs{margin:0 16px 14px;}
.fl{font-size:11px;font-weight:700;color:#c8b89a;letter-spacing:.5px;
  text-transform:uppercase;margin-bottom:6px;}
.fi{width:100%;background:var(--bg3);border:1px solid var(--border2);border-radius:var(--radius-sm);
  color:var(--text);font-size:15px;padding:11px 14px;outline:none;transition:border-color .15s;}
.fi:focus{border-color:var(--info);}
.fi::placeholder{color:#c8b89a;}
.fi-sm{font-size:13px;padding:8px 12px;}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.fsel{width:100%;background:var(--bg3);border:1px solid var(--border2);border-radius:var(--radius-sm);
  color:var(--text);font-size:15px;padding:11px 14px;outline:none;appearance:none;}
.fta{width:100%;background:var(--bg3);border:1px solid var(--border2);border-radius:var(--radius-sm);
  color:var(--text);font-size:14px;padding:11px 14px;outline:none;resize:none;line-height:1.6;}
.fhint{font-size:11px;color:#c8b89a;margin-top:4px;}
.fdiv{height:1px;background:var(--border);margin:4px 16px 14px;}

/* ── STOP TYPE SELECTOR ── */
.stop-types{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:0 16px 14px;}
.stype-btn{padding:8px 4px;border-radius:8px;border:1px solid var(--border2);
  background:var(--bg3);cursor:pointer;text-align:center;transition:all .15s;}
.stype-btn.sel{border-color:var(--accent);background:rgba(232,184,75,.12);}
.stype-icon{font-size:18px;line-height:1.3;}
.stype-label{font-size:9px;color:#c8b89a;margin-top:2px;}
.stype-btn.sel .stype-label{color:var(--accent);}

/* ── LEG EDITOR ── */
.leg-item{background:var(--bg4);border-radius:var(--radius-sm);padding:10px 12px;margin-bottom:8px;border:1px solid var(--border);}
.leg-hdr{display:flex;align-items:center;gap:8px;margin-bottom:8px;}
.leg-mode-sel{background:var(--bg3);border:1px solid var(--border2);border-radius:6px;
  color:var(--text);font-size:12px;padding:4px 8px;flex:1;}
.leg-del{background:none;border:none;color:#c8b89a;cursor:pointer;font-size:18px;padding:0 4px;}

/* ── BUTTONS ── */
.btn{width:100%;padding:13px;border-radius:var(--radius-sm);font-size:15px;font-weight:700;
  cursor:pointer;border:none;transition:opacity .15s;}
.btn:active{opacity:.7;}
.btn-primary{background:var(--accent);color:#000;}
.btn-secondary{background:var(--bg3);border:1px solid var(--border2);color:#e0d4c0;}
.btn-danger{background:rgba(255,107,107,.15);border:1px solid rgba(255,107,107,.3);color:var(--danger);}
.btn-info{background:rgba(110,198,240,.15);border:1px solid rgba(110,198,240,.3);color:var(--info);}
.btn-sm{padding:7px 14px;font-size:13px;width:auto;}


/* ── TIME SCROLL PICKER ── */
.tp-wrap{display:flex;align-items:center;justify-content:center;gap:0;
  background:var(--bg3);border:1px solid var(--border2);border-radius:var(--radius-sm);
  overflow:hidden;height:44px;cursor:pointer;position:relative;}
.tp-wrap:focus-within{border-color:var(--info);}
.tp-display{display:flex;align-items:center;justify-content:center;
  font-size:15px;font-weight:600;color:var(--text);width:100%;height:100%;
  user-select:none;gap:2px;}
.tp-display.empty{color:#c8b89a;font-weight:400;}
.tp-colon{color:#c8b89a;margin:0 2px;}
.tp-clear{background:none;border:none;color:#c8b89a;cursor:pointer;
  padding:0 10px;font-size:16px;flex-shrink:0;}

/* Picker Modal */
.tpm-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:500;
  display:flex;align-items:flex-end;justify-content:center;
  opacity:0;pointer-events:none;transition:opacity .2s;}
.tpm-overlay.open{opacity:1;pointer-events:auto;}
.tpm-box{background:var(--bg2);border-radius:20px 20px 0 0;width:100%;max-width:400px;
  padding-bottom:env(safe-area-inset-bottom,0px);
  transform:translateY(100%);transition:transform .3s cubic-bezier(.4,0,.2,1);}
.tpm-overlay.open .tpm-box{transform:translateY(0);}
.tpm-hdr{display:flex;align-items:center;justify-content:space-between;
  padding:14px 20px 10px;border-bottom:1px solid var(--border);}
.tpm-title{font-size:15px;font-weight:700;color:#e0d4c0;}
.tpm-confirm{background:none;border:none;color:var(--accent);
  font-size:15px;font-weight:700;cursor:pointer;padding:4px 0;}
.tpm-cancel{background:none;border:none;color:#c8b89a;
  font-size:14px;cursor:pointer;padding:4px 0;}
.tpm-cols{display:flex;align-items:center;justify-content:center;gap:0;padding:8px 20px 20px;}
.tpm-col{position:relative;height:200px;overflow:hidden;flex:1;}
.tpm-list{overflow-y:scroll;height:100%;scroll-snap-type:y mandatory;
  -webkit-overflow-scrolling:touch;scrollbar-width:none;}
.tpm-list::-webkit-scrollbar{display:none;}
.tpm-item{height:40px;display:flex;align-items:center;justify-content:center;
  font-size:22px;font-weight:600;color:#c8b89a;
  scroll-snap-align:center;cursor:pointer;transition:color .1s,font-size .1s;}
.tpm-item.active{color:var(--text);font-size:26px;}
.tpm-sel-bar{position:absolute;top:50%;left:0;right:0;transform:translateY(-50%);
  height:40px;background:rgba(255,255,255,.06);border-radius:8px;
  pointer-events:none;border-top:1px solid var(--border2);border-bottom:1px solid var(--border2);}
.tpm-colon{font-size:26px;font-weight:700;color:#e0d4c0;padding:0 8px;align-self:center;}


/* ── AUTOCOMPLETE ── */
.ac-list{position:absolute;left:0;right:0;top:calc(100% + 2px);z-index:300;
  background:var(--bg2);border:1px solid var(--border2);border-radius:var(--radius-sm);
  max-height:220px;overflow-y:auto;box-shadow:0 4px 16px rgba(0,0,0,.5);}
.ac-item{padding:10px 14px;cursor:pointer;font-size:13px;border-bottom:1px solid var(--border);}
.ac-item:last-child{border-bottom:none;}
.ac-item:hover,.ac-item:active{background:var(--bg3);}
.ac-main{font-weight:600;color:var(--text);}
.ac-sub{font-size:11px;color:#c8b89a;margin-top:1px;}
/* ── ROUTE RESULT ── */
.rr-card{margin:0 16px 10px;background:var(--bg3);border-radius:var(--radius);
  border:1px solid var(--border);overflow:hidden;cursor:pointer;}
.rr-card:active{opacity:.85;}
.rr-card.selected{border-color:var(--accent);background:linear-gradient(135deg,rgba(232,184,75,.08),var(--bg3));}
.rr-top{padding:12px 14px;display:flex;align-items:center;gap:8px;}
.rr-time{font-size:15px;font-weight:700;}
.rr-dur{font-size:12px;color:#c8b89a;}
.rr-meta{margin-left:auto;font-size:11px;color:#c8b89a;text-align:right;}
.rr-legs{padding:4px 14px 12px;border-top:1px solid var(--border);}
.rr-leg{display:flex;gap:8px;padding:5px 0;border-bottom:1px solid var(--border);font-size:11px;}
.rr-leg:last-child{border-bottom:none;}
.rr-leg-icon{font-size:14px;flex-shrink:0;width:20px;text-align:center;margin-top:1px;}
.rr-leg-line{font-weight:600;color:var(--text);}
.rr-leg-detail{color:#c8b89a;margin-top:1px;}


/* ── EXPENSE ── */
.cat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:0 16px 14px;}
.cat-btn{padding:10px 4px;border-radius:10px;border:1.5px solid var(--border2);
  background:var(--bg3);cursor:pointer;text-align:center;transition:all .15s;}
.cat-btn.sel{border-color:var(--accent);background:rgba(232,184,75,.12);}
.cat-icon{font-size:20px;line-height:1.3;}
.cat-label{font-size:10px;color:#c8b89a;margin-top:3px;}
.cat-btn.sel .cat-label{color:var(--accent);}
.member-chip{display:flex;align-items:center;gap:6px;padding:8px 12px;
  border-radius:10px;border:1.5px solid var(--border2);background:var(--bg3);
  cursor:pointer;transition:all .15s;font-size:13px;font-weight:600;}
.member-chip.sel{border-color:var(--accent);background:rgba(232,184,75,.12);color:var(--accent);}
.share-type-row{display:flex;gap:8px;margin:0 16px 14px;}
.share-btn{flex:1;padding:9px;border-radius:8px;font-size:12px;font-weight:600;
  cursor:pointer;border:1.5px solid var(--border2);background:var(--bg3);color:#c8b89a;transition:all .15s;}
.share-btn.sel{border-color:var(--accent);color:var(--accent);background:rgba(232,184,75,.1);}
/* Split blocks */
.split-wrap{padding:0 16px 8px;}
.split-blocks{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:10px;}
.split-block{width:72px;height:68px;border-radius:12px;display:flex;flex-direction:column;
  align-items:center;justify-content:center;cursor:pointer;transition:all .2s;
  border:2px solid rgba(255,255,255,.12);background:#162030;position:relative;user-select:none;}
.split-block:active{transform:scale(.95);}
.split-block.sel{transform:scale(1.08);box-shadow:0 0 0 3px var(--accent);}
.split-block.done{opacity:.6;}
.sb-name{font-size:11px;font-weight:700;margin-bottom:2px;}
.sb-amt{font-size:10px;}
.sb-tag{font-size:9px;margin-top:2px;}
.split-members{display:flex;gap:8px;justify-content:center;margin-bottom:8px;flex-wrap:wrap;}
.split-head{display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;
  transition:all .15s;width:60px;user-select:none;}
.split-av{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;
  justify-content:center;font-size:13px;font-weight:700;border:2px solid transparent;transition:all .2s;}
.split-head.target-active .split-av{box-shadow:0 0 0 3px rgba(232,184,75,.5);border-color:var(--accent);}
.split-nm{font-size:10px;font-weight:600;}
.split-amt{font-size:10px;font-weight:700;}
.split-divider{border-top:1px solid rgba(255,255,255,.08);margin:4px 0 10px;}
.split-label{font-size:11px;font-weight:700;color:#c8b89a;letter-spacing:.5px;margin-bottom:6px;}
.split-tip{font-size:11px;color:#c8b89a;padding:7px 10px;border-radius:7px;
  background:rgba(232,184,75,.06);border:1px solid rgba(232,184,75,.15);margin-bottom:8px;}
/* Proxy items */
.proxy-item{display:flex;gap:8px;align-items:center;background:var(--bg4);
  border-radius:8px;padding:8px 10px;margin-bottom:6px;}
.proxy-del{background:none;border:none;color:#5a7390;cursor:pointer;font-size:16px;padding:0 2px;flex-shrink:0;}


/* ── REPORT ── */
.report-tab{flex:1;padding:10px 4px;background:none;border:none;font-size:13px;font-weight:600;
  color:#c8b89a;cursor:pointer;border-bottom:2px solid transparent;transition:all .15s;}
.report-tab.sel{color:var(--accent);border-bottom-color:var(--accent);}
.report-section{margin:14px 16px 0;}
.report-card{background:var(--bg3);border-radius:var(--radius);border:1px solid var(--border);
  overflow:hidden;margin-bottom:10px;}
.report-card-hdr{padding:10px 14px;background:var(--bg4);display:flex;align-items:center;
  justify-content:space-between;gap:8px;}
.report-card-hdr-left{display:flex;align-items:center;gap:8px;}
.report-row{display:flex;align-items:center;justify-content:space-between;
  padding:9px 14px;border-top:1px solid var(--border);font-size:13px;}
.report-row-left{display:flex;align-items:center;gap:8px;flex:1;min-width:0;}
.report-cat-icon{font-size:15px;flex-shrink:0;}
.report-desc{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.report-sub{font-size:11px;color:#c8b89a;margin-top:1px;}
.report-amt{font-size:13px;font-weight:700;flex-shrink:0;margin-left:8px;}
.report-total-bar{display:flex;justify-content:space-between;align-items:center;
  padding:12px 16px;background:var(--bg4);border-radius:var(--radius);
  margin:0 16px 10px;border:1px solid var(--border);}
.currency-section{margin:0 16px 14px;}
.currency-hdr{display:flex;justify-content:space-between;align-items:center;
  padding:8px 0;border-bottom:1px solid var(--border);margin-bottom:8px;}
.currency-name{font-size:12px;font-weight:700;color:#c8b89a;letter-spacing:.5px;}
.currency-total{font-size:15px;font-weight:800;color:var(--accent);}
.member-report-hdr{display:flex;align-items:center;gap:10px;padding:12px 14px;}
.member-report-av{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;
  justify-content:center;font-size:12px;font-weight:700;flex-shrink:0;}
.empty-report{text-align:center;padding:40px 16px;color:#c8b89a;font-size:13px;}

/* ── EMPTY ── */
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:60px 32px;gap:14px;text-align:center;}
.empty-icon{font-size:48px;opacity:.4;}
.empty-title{font-size:17px;font-weight:700;color:#e0d4c0;}
.empty-sub{font-size:13px;color:#c8b89a;line-height:1.6;}

/* ── FAB ── */
.fab{position:fixed;bottom:calc(20px + var(--sb));right:16px;width:52px;height:52px;
  border-radius:50%;background:var(--accent);border:none;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 4px 16px rgba(0,0,0,.4);z-index:40;transition:transform .15s;}
.fab:active{transform:scale(.92);}

/* ── MODAL ── */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:200;
  display:flex;align-items:flex-end;opacity:0;pointer-events:none;transition:opacity .25s;}
.overlay.open{opacity:1;pointer-events:auto;}
.modal{background:var(--bg2);border-radius:20px 20px 0 0;width:100%;
  max-height:90vh;overflow-y:auto;padding-bottom:var(--sb);
  transform:translateY(100%);transition:transform .3s cubic-bezier(.4,0,.2,1);}
.overlay.open .modal{transform:translateY(0);}
.modal-hdr{padding:16px 20px;display:flex;align-items:center;justify-content:space-between;
  border-bottom:1px solid var(--border);}
.modal-title{font-size:17px;font-weight:700;}
.modal-x{background:none;border:none;color:#c8b89a;cursor:pointer;font-size:22px;line-height:1;}

/* ── STATUS BAR ── */
.status-bar{margin:12px 16px;padding:14px 16px;
  background:linear-gradient(135deg,rgba(232,184,75,.15),rgba(36,52,71,.8));
  border-radius:var(--radius);border:1px solid rgba(232,184,75,.3);cursor:pointer;}
.status-day{font-size:32px;font-weight:800;color:var(--accent);letter-spacing:-1px;}
.status-name{font-size:13px;color:#e0d4c0;margin-top:2px;}
.status-remain{font-size:12px;color:var(--success);margin-top:4px;font-weight:600;}

/* ── DAY LIST CARD ── */
.day-card{margin:0 16px 8px;background:var(--bg3);border-radius:var(--radius);
  border:1px solid var(--border);overflow:hidden;cursor:pointer;transition:border-color .15s;}
.day-card:active{opacity:.85;}
.day-card.today{border-color:rgba(123,237,159,.4);}
.day-card-hdr{padding:12px 14px;display:flex;align-items:center;gap:10px;}
.day-badge{width:40px;height:40px;border-radius:10px;background:var(--bg4);
  display:flex;flex-direction:column;align-items:center;justify-content:center;flex-shrink:0;}
.day-badge.today{background:rgba(123,237,159,.15);border:1px solid rgba(123,237,159,.3);}
.day-d{font-size:10px;font-weight:700;color:#c8b89a;}
.day-n{font-size:16px;font-weight:800;line-height:1;}
.day-card.today .day-n{color:#7bed9f;}
.day-info{flex:1;min-width:0;}
.day-title-text{font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.day-date{font-size:11px;color:#c8b89a;margin-top:1px;}
.day-preview{padding:0 14px 10px;display:flex;gap:6px;flex-wrap:wrap;}
.prev-chip{font-size:11px;color:#e0d4c0;display:flex;align-items:center;gap:3px;}

/* ── PC ── */
@media(min-width:768px){
  .screen{flex-direction:row;}
  .pc-side{width:320px;border-right:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden;}

  .overlay{align-items:center;}
  .modal{max-width:540px;margin:0 auto;border-radius:20px;max-height:85vh;}
}
@keyframes spin{to{transform:rotate(360deg);}}
.spin{animation:spin .8s linear infinite;}

<script>
var GAS = 'https://script.google.com/macros/s/AKfycbz8j18olygkPUIsqXEUptyrt7XwDQWEwOcoz81nrLvHCE3HJrDindFnCZ4344o4QT8N1w/exec';

var STORE_KEY = 'travel_v2';

// ════ TIME SCROLL PICKER ════
var _tpmCallback = null;
var _tpmH = 0, _tpmM = 0;

function tpmOpen(currentVal, title, callback) {
  var parts = (currentVal||'').split(':');
  _tpmH = parseInt(parts[0])||0;
  _tpmM = parseInt(parts[1])||0;
  _tpmCallback = callback;
  document.getElementById('tpm-title').textContent = title||'選擇時間';
  // Build hour list (0-23)
  var hList = document.getElementById('tpm-hours');
  var mList = document.getElementById('tpm-mins');
  hList.innerHTML = '<div style="height:80px"></div>' +
    Array.from({length:24},function(_,i){
      return '<div class="tpm-item'+(i===_tpmH?' active':'')+'" data-v="'+i+'">'+
        String(i).padStart(2,'0')+'</div>';
    }).join('') +
    '<div style="height:80px"></div>';
  mList.innerHTML = '<div style="height:80px"></div>' +
    Array.from({length:60},function(_,i){
      return '<div class="tpm-item'+(i===_tpmM?' active':'')+'" data-v="'+i+'">'+
        String(i).padStart(2,'0')+'</div>';
    }).join('') +
    '<div style="height:80px"></div>';
  // Scroll to selected
  setTimeout(function(){
    tpmScrollTo(hList, _tpmH);
    tpmScrollTo(mList, _tpmM);
    tpmInitScroll(hList, 'h');
    tpmInitScroll(mList, 'm');
  }, 50);
  document.getElementById('tpm-overlay').classList.add('open');
}

function tpmScrollTo(list, val) {
  list.scrollTop = val * 40;
}

function tpmInitScroll(list, type) {
  list.addEventListener('scroll', function() {
    var idx = Math.round(list.scrollTop / 40);
    idx = Math.max(0, Math.min(type==='h'?23:59, idx));
    if (type==='h') _tpmH = idx; else _tpmM = idx;
    // Update active
    list.querySelectorAll('.tpm-item').forEach(function(el){
      el.classList.toggle('active', parseInt(el.dataset.v)===idx);
    });
  }, {passive:true});
}

function tpmOpenById(wrap) {
  var safeId = wrap.dataset.tpid;
  var label = wrap.dataset.label;
  var onChangeFn = wrap.dataset.onchange;
  var valEl = document.getElementById('tp-v-'+safeId);
  var curVal = valEl ? valEl.value : '';
  tpmOpen(curVal, label, function(v) {
    if (valEl) valEl.value = v;
    var dispEl = document.getElementById('tp-d-'+safeId);
    if (dispEl) { dispEl.textContent = v; dispEl.className = 'tp-display'; }
    if (onChangeFn) { try { eval(onChangeFn); } catch(e){} }
    // Auto-calc duration for route dep/arr pickers (and airport flight dep/arr)
    if(safeId==='sf-flight-dep'||safeId==='sf-flight-arr'){
      var fdepEl=document.getElementById('tp-v-sf-flight-dep');
      var farrEl=document.getElementById('tp-v-sf-flight-arr');
      var srd0dep=document.getElementById('tp-v-srd-0-dep');
      var srd0arr=document.getElementById('tp-v-srd-0-arr');
      if(fdepEl&&srd0dep) srd0dep.value=fdepEl.value;
      if(farrEl&&srd0arr) srd0arr.value=farrEl.value;
      try { onChangeCalcDuration(0); } catch(e){}
    }
    var calcMatch = safeId.match(/^srd-(\d+)-(dep|arr)$/);
    if(calcMatch) { try { onChangeCalcDuration(parseInt(calcMatch[1])); } catch(e){} }
    // Auto-sync route/leg fields from ID pattern
    // rd-{ri}-dep/arr  or  lg-{ri}_{li}-dep/arr
    var rdm = safeId.match(/^rd-(\d+)-(dep|arr)$/);
    var lgm = safeId.match(/^lg-(\d+)_(\d+)-(dep|arr)$/);
    if (rdm) {
      var field = rdm[2]==='dep'?'departTime':'arriveTime';
      setRouteField(parseInt(rdm[1]), field, v);
    } else if (lgm) {
      var field2 = lgm[3]==='dep'?'departTime':'arriveTime';
      setLegField(parseInt(lgm[1]), parseInt(lgm[2]), field2, v);
    }
    _stopDirty = true; _segDirty = true;
  });
}

        '</div>'+

      '</div>';

// ════ DAY TIMELINE ════
function renderDayTL(){
  var d=day(); if(!d)return;
  var stops=d.stops||[];
  var isLastDay=trip()&&S.dayIdx===trip().days.length-1;
  var html='';
  html+='<button class="tl-add-top" onclick="addStopAt(0)">\uff0b \u5728\u6700\u524d\u65b0\u589e\u5730\u9ede</button>';

  stops.forEach(function(stop,i){
    var transit=stop.transit||null;
    var isLast=i===stops.length-1;
    // Get arrive time from previous stop's transit
    var prevArrTime='';
    if(i>0){
      var prevTransit=(stops[i-1].transit)||null;
      var prevRoute=prevTransit?getPlannedRoute(prevTransit):null;
      if(prevRoute) prevArrTime=prevRoute.arriveTime||'';
    }
    // Get depart time from this stop's transit
    var depTime='';
    var plannedRoute=transit?getPlannedRoute(transit):null;
    if(plannedRoute) depTime=plannedRoute.departTime||'';

    // STOP CARD
    html+='<div class="tl-stop">';
    html+='<div class="tl-stop-left"><div class="tl-stop-time">';
    if(prevArrTime) html+='<div class="arr">'+prevArrTime+'\u5230</div>';
    if(depTime&&depTime!==prevArrTime) html+='<div class="dep">'+depTime+'\u767c</div>';
    if(!prevArrTime&&!depTime) html+='<div style="color:#c8b89a">--</div>';
    html+='</div></div>';
    html+='<div class="tl-stop-right">';
    html+='<div class="tl-stop-card'+(stop.anchor?' anchor':'')+(stop.type==='hotel'?' hotel':'')+'" data-stopidx="'+i+'" onclick="openStopByEl(this)">';
    html+='<div class="tl-stop-name">'+stopTypeIcon(stop.type)+' '+esc(stop.name||'\uff08\u672a\u547d\u540d\uff09')+(stop.anchor?'<span class="anchor-badge">\u9328\u9ede</span>':'')+' </div>';
    if(stop.note) html+='<div class="tl-stop-sub">'+esc(stop.note)+'</div>';
    html+='</div>';

    // TRANSIT display (below stop card, above next stop)
    if(!isLast || (isLastDay&&isLast)){
      if(transit&&plannedRoute&&plannedRoute.legs&&plannedRoute.legs.length){
        html+='<div class="tl-seg-card" data-stopidx="'+i+'" onclick="openStopByEl(this)" style="margin-top:6px">';
        html+='<div class="tl-seg-summary">';
        html+='<span class="tl-seg-time">'+(plannedRoute.departTime||'')+' \u2192 '+(plannedRoute.arriveTime||'')+'</span>';
        if(plannedRoute.duration) html+='<span class="tl-seg-dur">'+fmtDuration(plannedRoute.duration)+'</span>';
        if(plannedRoute.transfers>0) html+='<span class="tl-seg-dur">\u63db\u4e58'+plannedRoute.transfers+'\u6b21</span>';
        html+='<span class="tl-seg-tag tag-planned">\u9810\u5b9a</span>';
        if(transit.routes&&transit.routes.length>1) html+='<span class="tl-seg-dur">'+transit.routes.length+'\u65b9\u6848</span>';
        html+='</div>';
        // Legs summary
        html+='<div class="tl-seg-legs">';
        plannedRoute.legs.forEach(function(leg){
          html+='<div class="tl-leg-row">'+
            '<div class="tl-leg-icon">'+legModeIcon(leg.mode)+'</div>'+
            '<div class="tl-leg-info">'+
              (leg.line?'<div class="tl-leg-line">'+esc(leg.line)+'</div>':'')+
              '<div class="tl-leg-detail">'+
                (leg.fromStop?esc(leg.fromStop):'')+
                (leg.toStop?' \u2192 '+esc(leg.toStop):'')+
                (leg.departTime?' '+leg.departTime:'')+
                (leg.platform?' \u30fb '+esc(leg.platform):'')+
                (leg.numStops?' \u30fb '+leg.numStops+'\u7ad9':'')+
              '</div>'+
            '</div>'+
          '</div>';
        });
        html+='</div></div>';
      } else if(!isLast){
        // Empty transit placeholder
        var nextStop=stops[i+1];
        html+='<div class="tl-seg-empty" data-stopidx="'+i+'" onclick="openStopByEl(this)" style="margin-top:6px">'+
          '\ud83d\udd0d '+esc(stop.name||'')+'\u2192'+esc(nextStop?nextStop.name||'':'')+'\u3000\u9ede\u6b64\u8a2d\u5b9a\u4ea4\u901a\u65b9\u5f0f</div>';
      }
    }
    html+='</div></div>';
    html+='<button class="tl-add-stop" onclick="addStopAt('+(i+1)+')">\uff0b \u65b0\u589e\u5730\u9ede</button>';
  });

  if(stops.length===0){
    html+='<div class="empty" style="padding:40px 16px">'+
      '<div class="empty-icon">\ud83d\udccd</div>'+
      '<div class="empty-title">\u5c1a\u7121\u5730\u9ede</div>'+
      '<div class="empty-sub">\u9ede\u4e0a\u65b9\u6309\u9215\u65b0\u589e\u7b2c\u4e00\u500b\u5730\u9ede</div>'+
    '</div>';
  }
  document.getElementById('day-tl').innerHTML=html;
}

function getPlannedRoute(transit){
  if(!transit||!transit.routes||!transit.routes.length) return null;
  return transit.routes.find(function(r){return r.tag==='planned';})||transit.routes[0];
}

// ── Transit data helpers (operating on current stop being edited) ──
function getEditingTransit(){
  var stopBody=document.getElementById('stop-body');
  // Read current from/to
  var from=(document.getElementById('sf-transit-from')||{value:''}).value;
  var to=(document.getElementById('sf-transit-to')||{value:''}).value;
  // Get existing transit from stop if editing
  var stop=S.stopIdx!==null?((day().stops||[])[S.stopIdx]):null;
  var transit=stop?stop.transit:null;
  if(!transit) transit={fromPlace:from,toPlace:to,routes:[]};
  return transit;
}
function _refreshTransitRoutes(){
  var transit=getEditingTransit();
  var html='';
  if(!transit.routes||!transit.routes.length){
    html='<div style="margin:0 16px 12px;padding:12px;background:var(--bg4);border-radius:var(--radius-sm);font-size:12px;color:#c8b89a;text-align:center">\u5c1a\u7121\u8def\u7dda\u65b9\u6848</div>';
  } else {
    transit.routes.forEach(function(r,ri){ html+=renderRouteEditor(r,ri); });
  }
  var el=document.getElementById('sf-transit-routes');
  if(el) el.innerHTML=html;
}
function setStopRouteTag(ri,tag){
  var stop=S.stopIdx!==null?((day().stops||[])[S.stopIdx]):null;
  if(!stop||!stop.transit||!stop.transit.routes[ri])return;
  stop.transit.routes[ri].tag=tag; save(S.trips); _stopDirty=true;
}
function setStopRouteField(ri,field,val){
  var stop=S.stopIdx!==null?((day().stops||[])[S.stopIdx]):null;
  if(stop&&stop.transit&&stop.transit.routes[ri]){
    stop.transit.routes[ri][field]=val; save(S.trips);
  }
  // Also update in _tempRoutes for new stops
  if(!_tempRoutes) _tempRoutes={};
  if(!_tempRoutes[ri]) _tempRoutes[ri]={};
  _tempRoutes[ri][field]=val;
  _stopDirty=true;
}
function removeStopRoute(ri){
  var stop=S.stopIdx!==null?((day().stops||[])[S.stopIdx]):null;
  if(!stop||!stop.transit)return;
  stop.transit.routes.splice(ri,1); save(S.trips); _stopDirty=true; _refreshTransitRoutes();
}
function addManualRoute(){
  // 先開啟班次選擇器，若無班次再提供空白手填
  var d = day(); if(!d) return;
  var t = trip();
  var schedules = (t && t.timetables) || [];
  // 計算當天日期
  var dayDate = '';
  if (t && t.startDate && t.days) {
    var dayIdx = t.days.indexOf(d);
    if (dayIdx >= 0) {
      var dd2 = new Date(t.startDate);
      dd2.setDate(dd2.getDate() + dayIdx);
      dayDate = dd2.getFullYear() + '-' +
        String(dd2.getMonth()+1).padStart(2,'0') + '-' +
        String(dd2.getDate()).padStart(2,'0');
    }
  }
  var filtered = schedules.filter(function(s){ return !s.date || s.date === dayDate; });
  if (filtered.length > 0) {
    // 有班次：開啟多選模式選擇器
    _ttSelectorMulti = true;
    _ttSelectedIdxs = [];
    _ttSelectorStopIdx = S.stopIdx;
    renderTimetableSelector(d);
    goTo('sc-timetable-selector');
  } else {
    // 無班次：直接新增空白路線
    var stop=S.stopIdx!==null?((d.stops||[])[S.stopIdx]):null;
    if(!stop) return;
    if(!stop.transit) stop.transit={fromPlace:(document.getElementById('sf-transit-from')||{value:''}).value,toPlace:(document.getElementById('sf-transit-to')||{value:''}).value,routes:[]};
    stop.transit.routes.push({id:uid(),tag:'backup',departTime:'',arriveTime:'',duration:0,transfers:0,legs:[{mode:'train',fromStop:'',toStop:'',departTime:'',arriveTime:'',line:'',platform:''}]});
    save(S.trips); _stopDirty=true; _refreshTransitRoutes();
  }
}
function addStopLeg(ri){
  var stop=S.stopIdx!==null?((day().stops||[])[S.stopIdx]):null;
  if(!stop||!stop.transit||!stop.transit.routes[ri])return;
  if(!stop.transit.routes[ri].legs) stop.transit.routes[ri].legs=[];
  stop.transit.routes[ri].legs.push({mode:'walk',fromStop:'',toStop:'',departTime:'',arriveTime:'',line:'',platform:''});
  save(S.trips); _stopDirty=true; _refreshTransitRoutes();
}
function removeStopLeg(ri,li){
  var stop=S.stopIdx!==null?((day().stops||[])[S.stopIdx]):null;
  if(!stop||!stop.transit||!stop.transit.routes[ri])return;
  stop.transit.routes[ri].legs.splice(li,1); save(S.trips); _stopDirty=true; _refreshTransitRoutes();
}
function setStopLegField(ri,li,field,val){
  var stop=S.stopIdx!==null?((day().stops||[])[S.stopIdx]):null;
  if(!stop||!stop.transit||!stop.transit.routes[ri]||!stop.transit.routes[ri].legs[li])return;
  stop.transit.routes[ri].legs[li][field]=val; save(S.trips); _stopDirty=true;
}

// ── Sync time picker values back to transit before saving ──
function syncTransitTimePickers(){
  var routes=[];
  // Find all srd-{ri}-dep/arr pickers
  var idx=0;
  while(true){
    var depEl=document.getElementById('tp-v-srd-'+idx+'-dep');
    var arrEl=document.getElementById('tp-v-srd-'+idx+'-arr');
    if(!depEl&&!arrEl) break;
    routes.push({
      departTime: depEl?depEl.value:'',
      arriveTime: arrEl?arrEl.value:''
    });
    idx++;
  }
  return routes;
}

// ════ SAVE STOP ════
function saveStop(){
  var d=day(); if(!d)return;
  var type=(document.querySelector('.stype-btn.sel')||{dataset:{type:'transit'}}).dataset.type;
  var name=(document.getElementById('sf-name')||{value:''}).value.trim();
  if(!name){alert('\u8acb\u8f38\u5165\u5730\u9ede\u540d\u7a31');return;}
  var stop={
    id:(S.stopIdx!==null?(d.stops||[])[S.stopIdx]||{id:uid()}:{id:uid()}).id,
    type:type, name:name,
    anchor:!!(document.getElementById('sf-anchor')||{checked:false}).checked,
    note:(document.getElementById('sf-note')||{value:''}).value.trim(),
  };
  if(type==='hotel'){
    stop.hotel={
      checkIn:(document.getElementById('tp-v-sf-ci')||{value:''}).value||null,
      checkOut:(document.getElementById('tp-v-sf-co')||{value:''}).value||null,
      reservationNo:(document.getElementById('sf-resno')||{value:''}).value.trim(),
      amount:parseFloat((document.getElementById('sf-hamount')||{value:'0'}).value)||0,
      currency:(document.getElementById('sf-hcur')||{value:'JPY'}).value,
      meal:(document.getElementById('sf-hmeal')||{value:''}).value.trim(),
      phone:(document.getElementById('sf-hphone')||{value:''}).value.trim(),
      address:(document.getElementById('sf-haddr')||{value:''}).value.trim(),
    };
  }
  if(type==='airport'){
    stop.airport={
      flightNo:(document.getElementById('sf-flight')||{value:''}).value.trim(),
      terminal:(document.getElementById('sf-terminal')||{value:''}).value.trim(),
      airline:(document.getElementById('sf-airline')||{value:''}).value.trim(),
    };
  }
  // Save transit
  var fromEl=document.getElementById('sf-transit-from');
  var toEl=document.getElementById('sf-transit-to');
  if(fromEl&&toEl){
    var existingStop=S.stopIdx!==null?(d.stops||[])[S.stopIdx]:null;
    var existingTransit=existingStop?existingStop.transit:null;
    // Sync time picker values back to routes
    var routes=existingTransit?existingTransit.routes||[]:[];
    // Airport: use direct flight time inputs
    var flightDepEl=document.getElementById('tp-v-sf-flight-dep');
    var flightArrEl=document.getElementById('tp-v-sf-flight-arr');
    if(flightDepEl||flightArrEl){
      // Airport mode - create/update single route
      var flightDep=flightDepEl?flightDepEl.value:'';
      var flightArr=flightArrEl?flightArrEl.value:'';
      var existAirport=routes[0];
      var airlineVal=(document.getElementById('sf-airline')||{value:''}).value.trim();
      var flightNoVal=(document.getElementById('sf-flight')||{value:''}).value.trim();
      // Read fare/duration/importFare from DOM (route index 0)
      var fareEl0=document.getElementById('srd-fare-0');
      var fareCurEl0=document.getElementById('srd-farecur-0');
      var importEl0=document.getElementById('srd-import-0');
      // Auto-calc duration from flight dep/arr
      var calcDur=existAirport?existAirport.duration||0:0;
      if(flightDep&&flightArr){
        var dp=flightDep.split(':'),ap=flightArr.split(':');
        var dm=parseInt(dp[0])*60+parseInt(dp[1]),am=parseInt(ap[0])*60+parseInt(ap[1]);
        var dd=am-dm; if(dd<0)dd+=1440; calcDur=dd;
      }
      routes=[{
        id:existAirport?existAirport.id:uid(),
        tag:'planned',
        departTime:flightDep,
        arriveTime:flightArr,
        duration:calcDur,transfers:0,
        fare:fareEl0?parseFloat(fareEl0.value)||0:(existAirport?existAirport.fare||0:0),
        fareCurrency:fareCurEl0?fareCurEl0.value:(existAirport?existAirport.fareCurrency||'TWD':'TWD'),
        importFare:importEl0?importEl0.checked:(existAirport?existAirport.importFare||false:false),
        payMethod:(function(){var el=document.getElementById('srd-paymethod-0');return el?el.value:(existAirport?existAirport.payMethod||'':'');})(),
        legs:[{mode:'flight',fromStop:fromEl.value,toStop:toEl.value,
          departTime:flightDep,arriveTime:flightArr,
          line:airlineVal+(flightNoVal?' '+flightNoVal:''),platform:''}]
      }];
    } else {
      routes.forEach(function(r,ri){
        var depEl=document.getElementById('tp-v-srd-'+ri+'-dep');
        var arrEl=document.getElementById('tp-v-srd-'+ri+'-arr');
        if(depEl) r.departTime=depEl.value;
        if(arrEl) r.arriveTime=arrEl.value;
        // Sync fare, duration, fareCurrency, importFare from DOM
        var fareEl=document.getElementById('srd-fare-'+ri);
        var fareCurEl=document.getElementById('srd-farecur-'+ri);
        var importEl=document.getElementById('srd-import-'+ri);
        if(fareEl) r.fare=parseFloat(fareEl.value)||0;
        if(fareCurEl) r.fareCurrency=fareCurEl.value;
        if(importEl) r.importFare=importEl.checked;
        var pmEl=document.getElementById('srd-paymethod-'+ri);
        if(pmEl) r.payMethod=pmEl.value;
      });
    }
    stop.transit={
      fromPlace:fromEl.value.trim(),
      toPlace:toEl.value.trim(),
      routes:routes
    };
  } else {
    // Last stop - preserve existing transit if any
    var existingStop2=S.stopIdx!==null?(d.stops||[])[S.stopIdx]:null;
    if(existingStop2&&existingStop2.transit) stop.transit=existingStop2.transit;
  }

  if(!d.stops) d.stops=[];
  if(S.stopIdx!==null){
    d.stops[S.stopIdx]=stop;
  } else {
    var at=S.insertAt!==null?S.insertAt:d.stops.length;
    d.stops.splice(at,0,stop);
  }
  save(S.trips);
  _stopDirty=false;
  goBack('sc-day'); renderDayTL();
}

// ════ CLOUD SYNC ════
var SYNC_KEY = 'travel_sync_ts';

async function syncRead() {
  try {
    var res = await fetch(GAS + '?action=travel_read');
    var data = await res.json();
    if (!data || !data.data) return null;
    var remoteTs = data.updatedAt || '';
    var localTs = localStorage.getItem(SYNC_KEY) || '';
    if (!localTs || remoteTs > localTs) {
      // Remote is newer - update local
      localStorage.setItem(STORE_KEY, JSON.stringify(data.data));
      localStorage.setItem(SYNC_KEY, remoteTs);
      return data.data;
    }
    return null; // local is newer or same
  } catch(e) {
    console.log('sync read error:', e);
    return null;
  }
}

async function syncWrite(trips) {
  try {
    var ts = new Date().toISOString();
    localStorage.setItem(SYNC_KEY, ts);
    // POST + text/plain 避免 CORS preflight，GAS 以 e.postData.contents 接收
    await fetch(GAS, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain' },
      body: JSON.stringify({ action: 'travel_write', data: trips, updatedAt: ts })
    });
  } catch(e) {
    console.log('sync write error:', e);
  }
}

// Save with cloud sync
function save(trips){
  localStorage.setItem(STORE_KEY, JSON.stringify(trips));
  syncWrite(trips);
}


// Sync indicator
function showSyncStatus(msg, color) {
  var el = document.getElementById('sync-status');
  if (!el) return;
  el.textContent = msg;
  el.style.color = color || 'var(--text3)';
  setTimeout(function(){ if(el.textContent===msg) el.textContent=''; }, 3000);
}

  var members = [];
  list.querySelectorAll('[data-mid]').forEach(function(row){
    var input = row.querySelector('input');
    var name = input ? input.value.trim() : '';
    if(name) members.push({id: row.dataset.mid, name: name});
  });
  return members;
}


// ════ EXPENSE ════
var _expDirty = false;
var _expCtx = null;  // {source:'day'|'stop', dayIdx, stopIdx, expIdx}
var _expSplitSelected = null;  // block mid being assigned

var EXP_CATS = [
  {id:'transport', icon:'🚃', label:'交通'},
  {id:'hotel',     icon:'🏨', label:'住宿'},
  {id:'food',      icon:'🍽', label:'餐飲'},
  {id:'ticket',    icon:'🎫', label:'門票'},
  {id:'shopping',  icon:'🛍', label:'購物'},
  {id:'other',     icon:'📋', label:'其他'},
];

// Member colors (cycle)
var MCOLORS=[
  {color:'#6ec6f0',bg:'#1a3a50',text:'#9dd4f0'},
  {color:'#7bed9f',bg:'#1a3d28',text:'#a0e8b8'},
  {color:'#e8b84b',bg:'#3d2e10',text:'#f5d47a'},
  {color:'#ff9f9f',bg:'#3d1a1a',text:'#ffbbbb'},
  {color:'#c778e8',bg:'#2d1a3d',text:'#e0a0f8'},
  {color:'#f09060',bg:'#3d2010',text:'#f8b890'},
];
function mcolor(idx){ return MCOLORS[idx % MCOLORS.length]; }
function tripMembers(){ var t=trip(); return t&&t.members&&t.members.length?t.members:[]; }

// Split state
var _splitBlocks = {};  // {mid: {totalAmt, slices:[{pid,amt,locked}]}}

function initSplitBlocks(total, members){
  _splitBlocks = {};
  var n = members.length;
  var base = Math.floor(total/n);
  var rem = total - base*n;
  members.forEach(function(m,i){
    _splitBlocks[m.id] = {totalAmt: i===0?base+rem:base, slices:[]};
  });
}
function splitBlockUsed(mid){ return (_splitBlocks[mid].slices||[]).reduce(function(s,sl){return s+sl.amt;},0); }
function splitBlockRem(mid){ return _splitBlocks[mid].totalAmt - splitBlockUsed(mid); }
function splitPayerTotal(pid){
  var sum=0;
  Object.keys(_splitBlocks).forEach(function(mid){
    (_splitBlocks[mid].slices||[]).forEach(function(sl){if(sl.pid===pid)sum+=sl.amt;});
  });
  return sum;
}
function splitAllAssigned(){
  return Object.keys(_splitBlocks).every(function(mid){return splitBlockRem(mid)<=0;});
}

function openExpense(ctx){
  _expCtx = ctx;
  _expDirty = false;
  _expSplitSelected = null;
  var exp = getExpenseByCtx(ctx);
  document.getElementById('expense-hdr-title').textContent = exp ? '\u7de8\u8f2f\u8cbb\u7528' : '\u65b0\u589e\u8cbb\u7528';
  document.getElementById('expense-del-btn').style.display = exp ? 'block' : 'none';
  renderExpenseForm(exp);
  goTo('sc-expense');
}

function getExpenseByCtx(ctx){
  if(!ctx) return null;
  var d = trip()&&trip().days?trip().days[ctx.dayIdx]:null; if(!d)return null;
  if(ctx.source==='day'&&ctx.expIdx!==undefined) return (d.expenses||[])[ctx.expIdx]||null;
  if(ctx.source==='stop'&&ctx.stopIdx!==undefined&&ctx.expIdx!==undefined){
    var stop=(d.stops||[])[ctx.stopIdx]; return stop?(stop.expenses||[])[ctx.expIdx]||null:null;
  }
  return null;
}

function expenseBackConfirm(){
  if(_expDirty&&!confirm('\u78ba\u5b9a\u653e\u68c4\u4fee\u6539\uff1f'))return;
  goBack('sc-day');
}

  html += '<div class="fs"><div class="frow">'+
    '<div><div class="fl">\u91d1\u984d</div><input class="fi" type="number" id="ef-amount" placeholder="0" value="'+ea(exp&&exp.amount?exp.amount:'')+'" oninput="_expDirty=true;refreshSplitAmounts()"></div>'+
    '<div><div class="fl">\u5e63\u5225</div><select class="fsel" id="ef-currency" onchange="_expDirty=true">';

  members.forEach(function(m,i){

function buildSplitArea(members, exp){
  var total = parseInt((document.getElementById('ef-amount')||{value:'0'}).value)||0;
  if(members.length===0) return '<div style="padding:0 16px;font-size:12px;color:#c8b89a">\u8acb\u5148\u8a2d\u5b9a\u884c\u7a0b\u6210\u54e1</div>';
  var html = '<div class="split-wrap">';
  html += '<div class="split-label">\u8cbb\u7528\u5206\u6cfc</div>';
  html += '<div class="split-tip">\u9ede\u9078\u8cbb\u7528\u5340\u584a\uff0c\u518d\u9ede\u4e0b\u65b9\u6210\u54e1\u982d\u50cf\u6307\u5b9a\u8ca0\u64d4\u4eba</div>';
  // Blocks
  html += '<div class="split-blocks" id="ef-split-blocks">';
  members.forEach(function(m,i){
    var mc = mcolor(i);
    var b = _splitBlocks[m.id]||{totalAmt:0,slices:[]};
    var rem = splitBlockRem(m.id);
    var isDone = rem<=0 && b.slices.length>0;
    html += '<div class="split-block'+(isDone?' done':'')+'" data-mid="'+m.id+'" id="sb-'+m.id+'" onclick="onSplitBlockClick(\''+m.id+'\')">'+
      '<div class="sb-name" style="color:'+mc.color+'">'+esc(m.name)+'</div>'+
      '<div class="sb-amt" style="color:'+mc.text+'">'+(total?fmtExp(b.totalAmt):'¥0')+'</div>'+
      (isDone?'<div class="sb-tag" style="color:#7bed9f">&#10003; \u5206\u914d\u5b8c</div>':
       rem>0&&rem<b.totalAmt?'<div class="sb-tag" style="color:var(--accent)">\u5269 '+fmtExp(rem)+'</div>':
       '<div class="sb-tag" style="color:#c8b89a">\u672a\u5206\u914d</div>')+
    '</div>';
  });
  html += '</div>';
  // Divider + heads
  html += '<div class="split-divider"></div>';
  html += '<div class="split-label">\u7531\u8ab0\u8ca0\u64d4</div>';
  html += '<div class="split-members" id="ef-split-members">';
  members.forEach(function(m,i){
    var mc = mcolor(i);
    var amt = splitPayerTotal(m.id);
    var isTarget = _expSplitSelected && _expSplitSelected!==m.id;
    html += '<div class="split-head'+(isTarget?' target-active':'')+'" data-mid="'+m.id+'" onclick="onSplitHeadClick(\''+m.id+'\')" id="sh-'+m.id+'">'+
      '<div class="split-av" style="background:'+mc.bg+';color:'+mc.color+';border-color:'+(amt>0?mc.color:'transparent')+'">'+m.name[0]+'</div>'+
      '<div class="split-nm" style="color:'+mc.color+'">'+esc(m.name)+'</div>'+
      '<div class="split-amt" style="color:'+(amt>0?mc.color:'#5a7390')+'">'+(amt>0?fmtExp(amt):'—')+'</div>'+
    '</div>';
  });
  html += '</div>';
  // Result summary
  var unalloc = members.reduce(function(s,m){return s+splitBlockRem(m.id);},0);
  if(unalloc>0){
    html += '<div style="font-size:11px;color:#ff6b6b;padding:4px 0">\u26a0 \u5c1a\u6709 '+fmtExp(unalloc)+' \u672a\u5206\u914d</div>';
  }
  html += '</div>';
  return html;
}

function buildPersonalArea(exp){
  var personalType = exp?exp.personalType:'self';
  var html = '<div style="padding:0 16px 8px">';
  html += '<div class="fl" style="margin-bottom:8px">\u6027\u8cea</div>';
  html += '<div style="display:flex;gap:8px;margin-bottom:12px">'+
    '<button class="share-btn'+(personalType==='self'?' sel':'')+'" onclick="selPersonalType(\'self\')">\u500b\u4eba\u81ea\u7528</button>'+
    '<button class="share-btn'+(personalType==='proxy'?' sel':'')+'" onclick="selPersonalType(\'proxy\')">\u4ee3\u8cfc</button>'+
  '</div>';
  if(personalType==='proxy'){
    html += '<div class="fl">\u4ee3\u8cfc\u660e\u7d30</div>';

function buildProxyItemRow(item,i){

      members.map(function(m){ return '<option value="'+m.id+'"'+(item.forId===m.id?' selected':'')+'>'+esc(m.name)+'</option>'; }).join('')+
    '</select>'+
    '<input class="fi fi-sm" type="number" placeholder="\u91d1\u984d" value="'+ea(item.amount||'')+'" style="flex:1" oninput="_expDirty=true">'+
    '<button class="proxy-del" onclick="removeProxyItem('+i+')">\u00d7</button>'+
  '</div>';
}

function onSplitBlockClick(mid){
  var rem = splitBlockRem(mid);
  _expSplitSelected = (_expSplitSelected===mid||rem<=0) ? null : mid;
  refreshSplitUI();
}

function onSplitHeadClick(pid){
  if(!_expSplitSelected) return;
  var mid = _expSplitSelected;
  var rem = splitBlockRem(mid);
  if(rem<=0){ _expSplitSelected=null; refreshSplitUI(); return; }
  showSplitPopup(mid, pid, rem);
}

function showSplitPopup(mid, pid, remaining){
  var members = tripMembers();
  var pidx = members.findIndex(function(m){return m.id===pid;});
  var midx = members.findIndex(function(m){return m.id===mid;});
  var mc = mcolor(pidx>=0?pidx:0);
  var bmc = mcolor(midx>=0?midx:0);
  var cur = (document.getElementById('ef-currency')||{value:'JPY'}).value;
  var RATIOS=[{l:'\u5168\u90e8',r:1},{l:'½',r:.5},{l:'⅓',r:1/3},{l:'¼',r:.25},{l:'⅔',r:2/3},{l:'¾',r:.75}];
  var tm = members[pidx]||{name:'?'}, bm = members[midx]||{name:'?'};
  var ov = document.createElement('div');
  ov.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.7);display:flex;align-items:flex-end;justify-content:center;z-index:500';
  ov.onclick=function(e){if(e.target===ov)ov.remove();};
  var box = document.createElement('div');
  box.style.cssText='background:#1e2d3d;border-radius:18px 18px 0 0;width:100%;max-width:420px;padding:18px 16px 28px';
  box.innerHTML='<div style="font-size:14px;font-weight:700;color:#e0d4c0;margin-bottom:3px">'+esc(bm.name)+' \u7684\u8cbb\u7528 \u2192 <span style="color:'+mc.color+'">'+esc(tm.name)+'</span>\u8ca0\u64d4</div>'+
    '<div style="font-size:12px;color:#c8b89a;margin-bottom:14px">\u53ef\u5206\u914d\uff1a'+fmtAmt(remaining,cur)+'</div>'+
    '<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px" id="sp-ratios"></div>'+
    '<div style="display:flex;gap:8px;margin-bottom:8px">'+
      '<input type="number" id="sp-custom" placeholder="\u81ea\u8a02\u91d1\u984d" inputmode="numeric" style="flex:1;background:#162030;border:1px solid rgba(255,255,255,.2);border-radius:8px;color:#f0e6d3;font-size:15px;padding:8px 12px;outline:none" oninput="checkSplitCustom('+remaining+')">'+
      '<button onclick="applySplitCustom(\''+mid+'\',\''+pid+'\','+remaining+')" style="padding:8px 14px;border-radius:8px;background:rgba(232,184,75,.15);border:1.5px solid var(--accent);color:var(--accent);font-size:13px;font-weight:700;cursor:pointer">\u78ba\u5b9a</button>'+
    '</div>'+
    '<div id="sp-warn" style="font-size:11px;color:#ff6b6b;min-height:16px;margin-bottom:8px"></div>'+
    '<button onclick="this.closest(\'div[style*=fixed]\').remove()" style="width:100%;padding:9px;border-radius:8px;background:none;border:1px solid rgba(255,255,255,.15);color:#c8b89a;font-size:13px;cursor:pointer">\u53d6\u6d88</button>';
  var rg = box.querySelector('#sp-ratios');
  RATIOS.forEach(function(r){
    var amt=Math.round(remaining*r.r);
    var btn=document.createElement('button');
    btn.style.cssText='padding:10px 4px;border-radius:9px;font-size:13px;font-weight:700;cursor:pointer;border:1.5px solid rgba(255,255,255,.15);background:#162030;color:#f0e6d3;text-align:center';
    btn.innerHTML='<div style="font-size:15px">'+r.l+'</div><div style="font-size:10px;color:#c8b89a;margin-top:2px">'+fmtAmt(amt,cur)+'</div>';
    btn.onclick=function(){applySplitRatio(mid,pid,amt,remaining,ov);};
    rg.appendChild(btn);
  });
  ov.appendChild(box);
  document.body.appendChild(ov);
}

function checkSplitCustom(remaining){
  var v=parseInt(document.getElementById('sp-custom').value)||0;
  var w=document.getElementById('sp-warn');
  if(w) w.textContent=v>remaining?'\u8d85\u904e\u53ef\u5206\u914d\u91d1\u984d':'';
}
function applySplitRatio(mid,pid,amt,remaining,ov){
  _splitBlocks[mid].slices.push({pid:pid,amt:amt,locked:false});
  if(ov) ov.remove();
  var newRem=splitBlockRem(mid);
  if(newRem<=0) _expSplitSelected=null;
  refreshSplitUI(); _expDirty=true;
}
function applySplitCustom(mid,pid,remaining){
  var v=parseInt(document.getElementById('sp-custom').value)||0;
  if(v<=0){document.getElementById('sp-warn').textContent='\u8acb\u8f38\u5165\u91d1\u984d';return;}
  if(v>remaining){document.getElementById('sp-warn').textContent='\u8d85\u904e\u53ef\u5206\u914d\u91d1\u984d';return;}
  _splitBlocks[mid].slices.push({pid:pid,amt:v,locked:true});
  document.querySelector('div[style*=fixed]').remove();
  var newRem=splitBlockRem(mid);
  if(newRem<=0) _expSplitSelected=null;
  refreshSplitUI(); _expDirty=true;
}

function refreshSplitAmounts(){
  var total=parseInt((document.getElementById('ef-amount')||{value:'0'}).value)||0;
  var members=tripMembers();
  if(!members.length)return;
  // Only reinit if blocks are all unassigned
  var anyAssigned=Object.keys(_splitBlocks).some(function(mid){return _splitBlocks[mid].slices.length>0;});
  if(!anyAssigned) initSplitBlocks(total,members);
  // Just update totalAmt proportionally if no slices
  refreshSplitUI();
}

function refreshSplitUI(){
  var members=tripMembers();
  var shareType=(document.getElementById('sb-shared')||{}).classList&&document.getElementById('sb-shared').classList.contains('sel')?'shared':'personal';
  if(shareType!=='shared')return;
  var area=document.getElementById('ef-share-area');
  if(area) area.innerHTML=buildSplitArea(members,null);
}

function selExpCat(cat){
  document.querySelectorAll('.cat-btn').forEach(function(b){b.classList.toggle('sel',b.dataset.cat===cat);});
  _expDirty=true;
}
function selExpPayer(mid){
  var members=tripMembers();
  document.querySelectorAll('#ef-payer-row .member-chip').forEach(function(c){
    var i=members.findIndex(function(m){return m.id===c.dataset.mid;});
    var mc=mcolor(i>=0?i:0);
    var isSel=c.dataset.mid===mid;
    c.classList.toggle('sel',isSel);
    c.style.borderColor=isSel?mc.color:'';
    c.style.background=isSel?mc.bg:'';
    c.style.color=isSel?mc.color:'';
  });
  _expDirty=true;
}
function selShareType(t){
  document.getElementById('sb-shared').classList.toggle('sel',t==='shared');
  document.getElementById('sb-personal').classList.toggle('sel',t==='personal');
  var members=tripMembers();
  document.getElementById('ef-share-area').innerHTML=t==='shared'?buildSplitArea(members,null):buildPersonalArea(null);
  _expDirty=true;
}
function selPersonalType(t){
  document.querySelectorAll('.share-btn').forEach(function(b){
    if(b.textContent.includes('\u500b\u4eba')||b.textContent.includes('\u4ee3\u8cfc'))
      b.classList.toggle('sel',b.textContent.includes(t==='self'?'\u500b\u4eba':'\u4ee3\u8cfc'));

function addProxyItem(){
  var list=document.getElementById('ef-proxy-list'); if(!list)return;
  var idx=list.querySelectorAll('.proxy-item').length;
  var div=document.createElement('div');
  div.innerHTML=buildProxyItemRow({name:'',forId:'',amount:''},idx);
  list.appendChild(div.firstChild);
  _expDirty=true;

function removeProxyItem(i){
  var el=document.getElementById('pi-'+i); if(el)el.remove(); _expDirty=true;
}

function fmtExp(n){
  var cur=(document.getElementById('ef-currency')||{value:'JPY'}).value;
  return fmtAmt(n,cur);
}
function fmtAmt(n,cur){
  n=Math.round(n);
  if(cur==='JPY')return'\xA5'+n.toLocaleString();
  if(cur==='TWD')return'NT$'+n.toLocaleString();
  return'$'+n.toLocaleString();
}

function collectExpense(){
  var cat=(document.querySelector('.cat-btn.sel')||{dataset:{cat:'other'}}).dataset.cat;
  var desc=(document.getElementById('ef-desc')||{value:''}).value.trim();
  var amount=parseFloat((document.getElementById('ef-amount')||{value:'0'}).value)||0;
  var currency=(document.getElementById('ef-currency')||{value:'JPY'}).value;
  var paidBy='';
  var payerEl=document.querySelector('#ef-payer-row .member-chip.sel');
  if(payerEl) paidBy=payerEl.dataset.mid;
  var shareType=document.getElementById('sb-shared').classList.contains('sel')?'shared':'personal';
  var splits=[];
  if(shareType==='shared'){
    var members=tripMembers();
    members.forEach(function(m){
      splits.push({mid:m.id,slices:(_splitBlocks[m.id]?_splitBlocks[m.id].slices:[])||[]});
    });
  }
  var personalType='self';
  var proxyItems=[];
  return {id:uid(),category:cat,desc:desc,amount:amount,currency:currency,
    paidBy:paidBy,shareType:shareType,splits:splits,personalType:personalType,proxyItems:proxyItems};
}

function saveExpense(){
  var ctx=_expCtx; if(!ctx)return;
  var exp=collectExpense();
  if(!exp.desc){alert('\u8acb\u8f38\u5165\u8cbb\u7528\u8aaa\u660e');return;}
  if(!exp.amount){alert('\u8acb\u8f38\u5165\u91d1\u984d');return;}
  var d=trip()&&trip().days?trip().days[ctx.dayIdx]:null; if(!d)return;
  if(ctx.source==='day'){
    if(!d.expenses)d.expenses=[];
    if(ctx.expIdx!==undefined)d.expenses[ctx.expIdx]=exp;
    else d.expenses.push(exp);
  } else if(ctx.source==='stop'){
    var stop=(d.stops||[])[ctx.stopIdx]; if(!stop)return;
    if(!stop.expenses)stop.expenses=[];
    if(ctx.expIdx!==undefined)stop.expenses[ctx.expIdx]=exp;
    else stop.expenses.push(exp);
  }
  save(S.trips); _expDirty=false;
  goBack('sc-day'); renderDayTL();
}

function deleteExpense(){
  var ctx=_expCtx; if(!ctx)return;
  var d=trip()&&trip().days?trip().days[ctx.dayIdx]:null; if(!d)return;
  if(ctx.source==='day'&&ctx.expIdx!==undefined){
    d.expenses.splice(ctx.expIdx,1);
  } else if(ctx.source==='stop'&&ctx.expIdx!==undefined){
    var stop=(d.stops||[])[ctx.stopIdx]; if(stop)stop.expenses.splice(ctx.expIdx,1);
  }
  save(S.trips); _expDirty=false;
  goBack('sc-day'); renderDayTL();
}


function openDayExpense(){
  openExpense({source:'day', dayIdx:S.dayIdx});
}

var _reportTab = 'total';

function openExpenseReport(){
  var t = trip(); if(!t)return;

function setReportTab(tab){
  _reportTab = tab;
  ['total','person','day'].forEach(function(t){
    document.getElementById('rt-'+t).classList.toggle('sel', t===tab);
  });
  renderReport();

function getAllExpenses(){
  var t = trip(); if(!t) return [];
  var result = [];
  (t.days||[]).forEach(function(d, di){
    // Day-level expenses
    (d.expenses||[]).forEach(function(exp,ei){
      result.push(Object.assign({}, exp, {dayIdx:di, stopIdx:null, expIdx:ei, dayTitle:d.title||(di+1)+'\u65e5'}));
    });
    // Stop-level expenses
    (d.stops||[]).forEach(function(stop, si){
      (stop.expenses||[]).forEach(function(exp,ei){
        result.push(Object.assign({}, exp, {dayIdx:di, stopIdx:si, expIdx:ei,
          dayTitle:d.title||(di+1)+'\u65e5', stopName:stop.name||''}));
      });
    });
  });
  return result;
}

  if(_reportTab === 'total') body.innerHTML = renderTotalReport(exps, curs);
  else if(_reportTab === 'person') body.innerHTML = renderPersonReport(exps, members, curs);

}

function fmtReportAmt(n, cur){
  n = Math.round(n);
  if(cur==='JPY') return '\xA5'+n.toLocaleString();
  if(cur==='TWD') return 'NT$'+n.toLocaleString();
  return '$'+n.toLocaleString();
}


function onChangeCalcDuration(ri){
  var depEl=document.getElementById('tp-v-srd-'+ri+'-dep');
  var arrEl=document.getElementById('tp-v-srd-'+ri+'-arr');
  if(!depEl||!arrEl||!depEl.value||!arrEl.value)return;
  var dep=depEl.value.split(':'), arr=arrEl.value.split(':');
  var depMin=parseInt(dep[0])*60+parseInt(dep[1]);
  var arrMin=parseInt(arr[0])*60+parseInt(arr[1]);
  var diff=arrMin-depMin;
  if(diff<0)diff+=1440; // cross midnight
  var durEl=document.querySelector('[data-ri="'+ri+'"][data-field="duration"]');
  setStopRouteField(ri,'duration',diff);
  var fmt=document.getElementById('dur-fmt-'+ri);if(fmt)fmt.textContent=fmtDuration(diff);
  _stopDirty=true;
}

var _ttSelectorStopIdx = null;
var _ttSelectorMulti = false;   // 是否為多選模式
var _ttSelectedIdxs = [];        // 已選班次的 index 陣列
 // 當前正在編輯的 stop index

// 開啟班次選擇畫面（從地點編輯頁呼叫）
function openTimetableSelector() {
  var d = day(); if (!d) return;
  // 取得當前 stop index
  _ttSelectorStopIdx = S.stopIdx;
  var stop = (d.stops || [])[_ttSelectorStopIdx];

  // 單選模式
  _ttSelectorMulti = false;
  _ttSelectedIdxs = [];
  renderTimetableSelector(d);
  goTo('sc-timetable-selector');
}

// 關閉選擇器，返回地點編輯
function closeTimetableSelector() {
  goBack('sc-stop');
}

// 渲染班次選擇卡片（當天所有班次）
function renderTimetableSelector(d) {
  var body = document.getElementById('timetable-selector-body');
  if (!body) return;
  var t = trip();
  var schedules = (t && t.timetables) || [];
  // 動態計算當天日期（trip.startDate + day index）
  var t2 = trip();
  var dayDate = '';
  if (t2 && t2.startDate && t2.days) {
    var dayIdx = t2.days.indexOf(d);
    if (dayIdx >= 0) {
      var dd2 = new Date(t2.startDate);
      dd2.setDate(dd2.getDate() + dayIdx);
      dayDate = dd2.getFullYear() + '-' +
        String(dd2.getMonth()+1).padStart(2,'0') + '-' +
        String(dd2.getDate()).padStart(2,'0');
    }
  }

  // 篩選當天班次（有日期就比對，無日期的全部顯示）
  var filtered = schedules.filter(function(s) {
    if (!s.date) return true;
    return s.date === dayDate;
  });

  if (!filtered.length) {
    body.innerHTML = '<div style="padding:32px 20px;text-align:center;color:#c8b89a;font-size:14px">' +
      '當天無匯入班次。<br><br>' +
      '<button onclick="goBack(\u0027sc-timetable-selector\u0027);openTimetable();" style="padding:10px 20px;background:rgba(110,198,240,.15);border:1px solid rgba(110,198,240,.3);border-radius:8px;color:#6ec6f0;font-size:13px;cursor:pointer">\u524d\u5f80\u532f\u5165\u73ed\u6b21</button>' +
      '</div>';
    return;
  }

  var isMulti = _ttSelectorMulti || false;
  var html = '<div style="padding:12px 16px 0">' +
    '<div style="font-size:12px;color:#c8b89a;margin-bottom:12px">' + (isMulti ? '可複選班次，選好後點「套用」' : '選擇要套用到此段交通的班次：') + '</div>';

  filtered.forEach(function(s, idx) {
    // 找原始 index
    var origIdx = schedules.indexOf(s);
    // 建立 legs 詳細資訊
    var legsHtml = '';
    if (s.legs && s.legs.length) {
      s.legs.forEach(function(leg, li) {
        var legLine = leg.line_name || '';
        var legDest = leg.destination_for || '';
        var legDep = leg.departure_station || '';
        var legArr = leg.arrival_station || '';
        var legDepTime = leg.departure_time || '';
        var legArrTime = leg.arrival_time || '';
        var legDepPlatform = leg.departure_platform || '';
        var legArrPlatform = leg.arrival_platform || '';
        var isDirect = leg.is_through_service ? '直通' : '';
        legsHtml += '<div style="margin-top:8px;padding-top:8px;border-top:1px solid var(--border)">' +
          '<div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:3px">' +
            '<div style="font-size:11px;color:#c8b89a">&#9312;</div>'.replace('&#9312;', '&#' + (9311+li+1) + ';') +
            '<div style="font-size:12px;font-weight:600;color:#e0d4c0">' + esc(legLine) + '</div>' +
            (legDest ? '<div style="font-size:11px;color:#c8b89a">(' + esc(legDest) + ')</div>' : '') +
            (isDirect ? '<div style="font-size:10px;color:#7bed9f;background:rgba(123,237,159,.1);border:1px solid rgba(123,237,159,.3);padding:1px 6px;border-radius:4px">直通</div>' : '') +
          '</div>' +
          '<div style="font-size:11px;color:#c8b89a;padding-left:14px">' +
            esc(legDep) + (legDepPlatform ? '（' + esc(legDepPlatform) + '）' : '') + ' ' + esc(legDepTime) +
            ' → ' + esc(legArr) + (legArrPlatform ? '（' + esc(legArrPlatform) + '）' : '') + ' ' + esc(legArrTime) +
          '</div>' +
        '</div>';
      });
    }

    // IC/現金票價分開顯示
    var fareHtml = '';
    if (s.fare_ic && s.fare_ticket) {
      fareHtml = '¥' + s.fare_ic + '（IC）/ ¥' + s.fare_ticket + '（現金）';
    } else if (s.fare) {
      fareHtml = '¥' + esc(String(s.fare));
    }

    var isSelected = _ttSelectedIdxs && _ttSelectedIdxs.indexOf(origIdx) >= 0;
    html += '<div onclick="toggleTimetableSelect(' + origIdx + ')" style="background:var(--bg3);border:2px solid ' + (isSelected ? '#6ec6f0' : 'rgba(110,198,240,.25)') + ';border-radius:12px;padding:14px 16px;margin-bottom:10px;cursor:pointer;position:relative">' +
    (isSelected ? '      \'<div style="position:absolute;top:10px;right:12px;width:18px;height:18px;background:#6ec6f0;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;color:#0f1923">✓</div>\' +' : '') +
      // 標題行：出發→到達 + 乘換
      '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">' +
        '<div style="font-size:13px;font-weight:700;color:#e0d4c0">' + esc(s.from || '') + ' → ' + esc(s.to || '') + '</div>' +
        (s.transfers !== undefined ? '<div style="font-size:11px;color:#c8b89a">乘換 ' + s.transfers + ' 次</div>' : '') +
      '</div>' +
      // 時間 + 所需時間
      '<div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:4px">' +
        '<div style="font-size:16px;font-weight:700;color:#6ec6f0">' + esc(s.departTime || '') + ' → ' + esc(s.arriveTime || '') + '</div>' +
        (s.duration ? '<div style="font-size:12px;color:#c8b89a">' + esc(s.duration) + '</div>' : '') +
      '</div>' +
      // 票價
      (fareHtml ? '<div style="font-size:12px;color:#c8b89a;margin-bottom:2px">' + fareHtml + '</div>' : '') +
      // Legs 詳情
      legsHtml +
    '</div>';
  });

  html += '</div>';
  // 套用按鈕（多選模式）
  if (_ttSelectorMulti) {
    html += '<div style="padding:12px 16px"><button onclick="applyMultiTimetable()" style="width:100%;padding:12px;background:var(--accent);border:none;border-radius:var(--radius-sm);color:#0f1923;font-size:14px;font-weight:700;cursor:pointer">套用已選方案</button></div>';
  }
  body.innerHTML = html;
}


// 切換班次選取狀態（多選模式）
function toggleTimetableSelect(origIdx) {
  if (!_ttSelectorMulti) {
    // 單選模式：直接套用
    applyTimetable(origIdx);
    return;
  }
  // 多選模式：toggle
  var pos = _ttSelectedIdxs.indexOf(origIdx);
  if (pos >= 0) {
    _ttSelectedIdxs.splice(pos, 1);
  } else {
    _ttSelectedIdxs.push(origIdx);
  }
  renderTimetableSelector(day());
}

// 套用多選的班次（每筆各建立一個方案）
function applyMultiTimetable() {
  if (!_ttSelectedIdxs.length) { alert('請先選擇班次'); return; }
  var d = day(); if (!d) return;
  var stop = (d.stops || [])[_ttSelectorStopIdx];
  if (!stop) return;
  var t = trip();
  if (!stop.transit) stop.transit = {
    fromPlace: (document.getElementById('sf-transit-from') || {value:''}).value,
    toPlace: (document.getElementById('sf-transit-to') || {value:''}).value,
    routes: []
  };

  _ttSelectedIdxs.forEach(function(origIdx) {
    var s = t && t.timetables ? t.timetables[origIdx] : null;
    if (!s) return;
    stop.transit.routes.push({
      id: uid(),
      tag: 'planned',
      departTime: s.departTime || '',
      arriveTime: s.arriveTime || '',
      duration: s.duration ? parseInt(s.duration) || 0 : 0,
      transfers: s.transfers || 0,
      fare: s.fare ? parseFloat(s.fare) || 0 : 0,
      fareCurrency: 'JPY',
      importFare: false,
      legs: (s.legs && s.legs.length ? s.legs : [{
        departure_station: s.from, arrival_station: s.to,
        departure_time: s.departTime, arrival_time: s.arriveTime,
        line_name: s.trainName
      }]).map(function(l) {
        return {
          mode: 'train',
          fromStop: l.departure_station || s.from || '',
          toStop: l.arrival_station || s.to || '',
          departTime: l.departure_time || '',
          arriveTime: l.arrival_time || '',
          line: l.line_name || s.trainName || '',
          platform: l.departure_platform || '',
          arrPlatform: l.arrival_platform || '',
          headsign: l.destination_for || ''
        };
      })
    });
  });

  save(S.trips);
  _stopDirty = false;
  _ttSelectedIdxs = [];
  goBack('sc-stop');
  renderStopForm(stop, _ttSelectorStopIdx);
}

// 套用選擇的班次到地點路線方案
function applyTimetable(origIdx) {
  var d = day(); if (!d) return;
  var stop = (d.stops || [])[_ttSelectorStopIdx];
  if (!stop) return;
  var t = trip();
  var s = (t && t.timetables) ? t.timetables[origIdx] : null;
  if (!s) return;

  // 記錄選擇
  stop.selectedTimetableId = origIdx;

  // 同步建立路線方案
  if (!stop.transit) stop.transit = { fromPlace: s.from || '', toPlace: s.to || '', routes: [] };
  stop.transit.fromPlace = s.from || stop.transit.fromPlace;
  stop.transit.toPlace = s.to || stop.transit.toPlace;

  // 清除舊路線，加入新的
  stop.transit.routes = [{
    id: uid(),
    tag: 'planned',
    departTime: s.departTime || '',
    arriveTime: s.arriveTime || '',
    duration: s.duration ? parseInt(s.duration) || 0 : 0,
    transfers: s.transfers || 0,
    fare: s.fare ? parseFloat(s.fare) || 0 : 0,
    fareCurrency: 'JPY',
    importFare: false,
    legs: (s.legs && s.legs.length ? s.legs : [{
      departure_station: s.from, arrival_station: s.to,
      departure_time: s.departTime, arrival_time: s.arriveTime,
      line_name: s.trainName
    }]).map(function(l) {
      return {
        mode: 'train',
        fromStop: l.departure_station || s.from || '',
        toStop: l.arrival_station || s.to || '',
        departTime: l.departure_time || '',
        arriveTime: l.arrival_time || '',
        line: l.line_name || s.trainName || '',
        platform: l.departure_platform || '',
        arrPlatform: l.arrival_platform || '',
        headsign: l.destination_for || ''
      };
    })
  }];

  save(S.trips);
  _stopDirty = false;
  goBack('sc-stop');
  // 重新渲染地點編輯頁
  renderStopForm(stop, _ttSelectorStopIdx);
}

// 重新選擇（清除已選班次）
function resetTimetableSelection() {
  var d = day(); if (!d) return;
  var stop = (d.stops || [])[_ttSelectorStopIdx !== null ? _ttSelectorStopIdx : S.stopIdx];
  if (!stop) return;
  if (!confirm('清除已選班次並重新選擇？')) return;
  delete stop.selectedTimetableId;
  save(S.trips);
  renderTimetableSelector(d);
  goTo('sc-timetable-selector');
}

// ════ 班次管理 ════

var _ttFile = null;

// 開啟班次管理畫面
function openTimetable() {
  renderTimetable();
  goTo('sc-timetable');
}

// 開啟匯入畫面
function openTimetableImport() {
  document.getElementById('tt-file-input').value = '';
  document.getElementById('tt-file-preview').textContent = '點擊選擇截圖或 PDF（Navitime 時刻表）';
  document.getElementById('tt-text-input').value = '';
  _ttFile = null;
  goTo('sc-timetable-import');
}

// 選擇檔案後預覽
function onTimetableFileSelected(input) {
  var file = input.files[0];
  if (!file) return;
  _ttFile = file;
  document.getElementById('tt-file-preview').textContent = '已選擇：' + file.name;
}

// 執行解析匯入
async function doTimetableImport() {
  var t = trip(); if (!t) return;
  var textInput = document.getElementById('tt-text-input').value.trim();
  var btn = document.querySelector('#sc-timetable-import .btn-primary');
  if (btn) { btn.textContent = '解析中…'; btn.disabled = true; }

  try {
    var result;
    if (_ttFile) {
      // 圖片或 PDF → base64 → Gemini
      var b64 = await new Promise(function(res, rej) {
        var r = new FileReader();
        r.onload = function() { res(r.result.split(',')[1]); };
        r.onerror = rej;
        r.readAsDataURL(_ttFile);
      });
      alert('圖片/PDF 匯入目前不支援，請改用 AI 整理後的 JSON 文字貼上。');
      return;
    } else if (textInput) {
      // 先嘗試直接解析 JSON（如 AI 預先整理好的格式）
      try {
        var parsed = JSON.parse(textInput);
        // 支援 {routes:[...]} 或 {schedules:[...]} 兩種格式
        if (parsed.schedules) {
          result = { stat: 'OK', schedules: parsed.schedules };
        } else if (parsed.routes) {
          // 將 routes 格式轉換為 schedules 格式
          result = { stat: 'OK', schedules: parsed.routes.map(function(r) {
            var firstLeg = (r.legs || [])[0] || {};
            var lastLeg = (r.legs || []).slice(-1)[0] || {};
            return {
              from: firstLeg.departure_station || '',
              to: lastLeg.arrival_station || '',
              departTime: r.departure_time || firstLeg.departure_time || '',
              arriveTime: r.arrival_time || lastLeg.arrival_time || '',
              trainName: (r.legs || []).map(function(l){return l.line_name||'';}).filter(Boolean).join(' → '),
              duration: r.duration_minutes ? r.duration_minutes + '分' : '',
              fare: r.fare ? (r.fare.ic_yen || r.fare.ticket_yen || '') : '',
              fare_ic: r.fare ? (r.fare.ic_yen || '') : '',
              fare_ticket: r.fare ? (r.fare.ticket_yen || '') : '',
              date: (parsed.search_meta && parsed.search_meta.search_departure_date) || '',
              transfers: r.transfers || 0,
              legs: r.legs || []
            };
          })};
        } else {
          throw new Error('未知格式');
        }
      } catch(jsonErr) {
        // 非 JSON 格式：提示使用者先用 AI 整理
        alert('請貼上 JSON 格式的班次資料。\n可使用 AI（如 ChatGPT/Gemini）將 Navitime 時刻表整理成 JSON 後再貼入。');
        return;
      }
    } else {
      alert('請選擇檔案或貼上文字');
      return;
    }

    if (!result || result.stat !== 'OK' || !result.schedules || !result.schedules.length) {
      alert('解析失敗：' + (result && result.error ? result.error : '無法取得班次資料'));
      return;
    }

    // 合併到行程的 timetables 陣列
    if (!t.timetables) t.timetables = [];
    result.schedules.forEach(function(s) { t.timetables.push(s); });
    save(S.trips);
    alert('成功匯入 ' + result.schedules.length + ' 筆班次');
    goBack('sc-timetable');
    renderTimetable();
  } catch(e) {
    alert('匯入失敗：' + e.message);
  } finally {
    if (btn) { btn.textContent = '解析匯入'; btn.disabled = false; }
  }
}

// 渲染班次列表
function renderTimetable() {
  var t = trip();
  var body = document.getElementById('timetable-body');
  if (!body) return;
  var schedules = (t && t.timetables) || [];
  var now = new Date();

  if (!schedules.length) {
    body.innerHTML = '<div style="padding:32px 20px;text-align:center;color:#c8b89a;font-size:14px">尚無班次，點右上角「匯入」新增</div>';
    return;
  }

  // 依出發時間排序
  var sorted = schedules.slice().sort(function(a, b) {
    return (a.departTime || '').localeCompare(b.departTime || '');
  });

  var html = '<div style="padding:12px 16px 0">';
  sorted.forEach(function(s, idx) {
    // 判斷班次是否已過
    var isPast = false;
    if (s.date && s.departTime) {
      var depDt = new Date(s.date + 'T' + s.departTime);
      isPast = depDt < now;
    }

    // fare 顯示
    var fareStr = '';
    if (s.fare_ic && s.fare_ticket) fareStr = '¥' + s.fare_ic + '（IC）/ ¥' + s.fare_ticket + '（現金）';
    else if (s.fare) fareStr = '¥' + s.fare;
    // legs 摘要
    var legsSummary = '';
    if (s.legs && s.legs.length) {
      legsSummary = '<div style="margin-top:6px">';
      s.legs.forEach(function(leg, li) {
        legsSummary += '<div style="font-size:11px;color:#c8b89a;margin-top:2px">' +
          '&#' + (9311+li+1) + '; ' + esc(leg.line_name||'') +
          (leg.destination_for ? '（' + esc(leg.destination_for) + '）' : '') +
          (leg.is_through_service ? ' <span style="color:#7bed9f">直通</span>' : '') + ' ' +
          esc(leg.departure_station||'') + (leg.departure_platform ? '（' + esc(leg.departure_platform) + '）' : '') +
          ' → ' + esc(leg.arrival_station||'') + (leg.arrival_platform ? '（' + esc(leg.arrival_platform) + '）' : '') +
        '</div>';
      });
      legsSummary += '</div>';
    }
    html += '<div style="background:var(--bg3);border:1px solid ' + (isPast ? 'var(--border)' : 'rgba(110,198,240,.3)') + ';border-radius:12px;padding:14px 16px;margin-bottom:10px;opacity:' + (isPast ? '.55' : '1') + '">' +
      '<div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:6px">' +
        '<div style="font-size:13px;font-weight:700;color:#e0d4c0">' + esc(s.from || '') + ' → ' + esc(s.to || '') + '</div>' +
        '<button onclick="deleteTimetable(' + idx + ')" style="background:none;border:none;color:#c8b89a;font-size:16px;cursor:pointer;padding:0 0 0 8px">&times;</button>' +
      '</div>' +
      '<div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap">' +
        '<div style="font-size:15px;font-weight:700;color:' + (isPast ? '#c8b89a' : '#6ec6f0') + '">' + esc(s.departTime || '') + ' → ' + esc(s.arriveTime || '') + '</div>' +
        (s.duration ? '<div style="font-size:12px;color:#c8b89a">' + esc(s.duration) + '</div>' : '') +
        (s.transfers !== undefined ? '<div style="font-size:11px;color:#c8b89a">乘換 ' + s.transfers + ' 次</div>' : '') +
      '</div>' +
      (fareStr ? '<div style="font-size:12px;color:#c8b89a;margin-top:3px">' + fareStr + '</div>' : '') +
      legsSummary +
      (s.date ? '<div style="font-size:11px;color:#c8b89a;margin-top:4px">' + esc(s.date) + '</div>' : '') +
      (isPast ? '<div style="margin-top:8px;display:flex;gap:8px">' +
        '<button onclick="openNavitime(\'' + encodeURIComponent(s.from||'') + '\',\'' + encodeURIComponent(s.to||'') + '\')" style="flex:1;padding:8px;background:rgba(110,198,240,.12);border:1px solid rgba(110,198,240,.3);border-radius:8px;color:#6ec6f0;font-size:12px;cursor:pointer">連結 NAVITime</button>' +
      '</div>' : '') +
    '</div>';
  });
  html += '</div>';
  body.innerHTML = html;
}

// 刪除班次
function deleteTimetable(idx) {
  var t = trip(); if (!t || !t.timetables) return;
  // 找到排序後對應的原始 index
  var sorted = t.timetables.slice().sort(function(a, b) {
    return (a.departTime || '').localeCompare(b.departTime || '');
  });
  var target = sorted[idx];
  var origIdx = t.timetables.indexOf(target);
  if (origIdx < 0) return;
  if (!confirm('刪除此班次？')) return;
  t.timetables.splice(origIdx, 1);
  save(S.trips);
  renderTimetable();
}

// 開啟 NAVItime（自動判斷手機/PC）
function openNavitime(from, to) {
  var isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
  var f = decodeURIComponent(from), t2 = decodeURIComponent(to);
  var url;
  if (isMobile) {
    url = 'https://transfer.navitime.biz/5931bus/smart/transfer/Top?startName=' +
      encodeURIComponent(f) + '&goalName=' + encodeURIComponent(t2);
  } else {
    url = 'https://transfer.navitime.biz/5931bus/pc/transfer/Top?startName=' +
      encodeURIComponent(f) + '&goalName=' + encodeURIComponent(t2);
  }
  window.open(url, '_blank');
}
