<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="utf-8">
<title>持股成本補正驗證</title>
<link rel="stylesheet" href="css/app.css">
<style>body{padding:16px;background:var(--bg);color:var(--text)}h3{margin:20px 0 8px}</style>
</head>
<body>
<div id="out">執行中…</div>
<script src="js/cost-override.js"></script>
<script src="js/stream.js"></script>
<script>
// 直接跑真實的 loadBrokerPositionsFull（stream.js 原始碼，未改寫），只把券商 API 換成替身。
// 比較「舊寫法（該日總成本，逐筆各加一次）」與「新寫法（每股價 × 張數）」算出的總成本。
var DETAILS = {
  D1: [   // 00407A：6/23 銀行認購 4 張＋6 張（券商端 price=0），8/11 自行買進 5 張
    { date: '2026-06-23', quantity: 4, price: 0, last_price: 40423, pnl: 40423 },
    { date: '2026-06-23', quantity: 6, price: 0, last_price: 60634, pnl: 60634 },
    { date: '2026-08-11', quantity: 5, price: 47650, last_price: 50528, pnl: 2878 }
  ],
  D2: [{ date: '2026-05-02', quantity: 300, price: 6000000, last_price: 10242000, pnl: 4242000 }]
};
function basePositions() {
  return [
    { id: 'D1', code: '00407A', quantity: 15000, price: 0, pnl: 103935, direction: 'Buy' },
    { id: 'D2', code: '00918',  quantity: 300000, price: 20, pnl: 4242000, direction: 'Buy' }
  ];
}
var _POS = basePositions();
async function fetchBrokerPositions() { return JSON.parse(JSON.stringify(_POS)); }
async function fetchPositionDetail(id) { return JSON.parse(JSON.stringify(DETAILS[id] || [])); }
async function loadPortfolioFallback() { return []; }

function snap() {
  var p = _positions.filter(function (x) { return x.code === '00407A'; })[0];
  return { 總成本: _totalCost, '00407A均價': p ? +p.price.toFixed(4) : null,
           '00407A成本': p ? Math.round(p.price * p.quantity) : null,
           '00407A損益': p ? Math.round(p.pnl) : null };
}

(async function () {
  var o = document.getElementById('out');
  await coLoad();
  var lines = [];

  // 1. 現行程式（每股價 10.00）
  _POS = basePositions();
  await loadBrokerPositionsFull();
  var now = snap();

  // 2. 重現舊寫法：該日總成本 100,000，逐筆各加一次
  _POS = basePositions();
  var realCoGet = window.coGet;
  var oldAdd = 0;
  window.coGet = function () { return null; };            // 先關掉新邏輯
  await loadBrokerPositionsFull();
  (DETAILS.D1).forEach(function (d) { if (d.price === 0) oldAdd += 100000; });  // 舊式：每筆各加該日總成本
  var p0 = _positions.filter(function (x) { return x.code === '00407A'; })[0];
  var sumCost = DETAILS.D1.reduce(function (a, d) { return a + d.price; }, 0);
  var oldPrice = (sumCost + oldAdd) / p0.quantity;
  var old = { 總成本: _totalCost - Math.round(p0.price * p0.quantity) + Math.round(oldPrice * p0.quantity),
              '00407A均價': +oldPrice.toFixed(4),
              '00407A成本': Math.round(oldPrice * p0.quantity),
              '00407A損益': Math.round(103935 - oldAdd) };
  window.coGet = realCoGet;

  // 3. 完全不補正（券商原始值）
  _POS = basePositions();
  window.coGet = function () { return null; };
  await loadBrokerPositionsFull();
  var raw = snap();
  window.coGet = realCoGet;

  var k = ['總成本', '00407A成本', '00407A均價', '00407A損益'];
  var row = function (n, d) { return '<tr><td>' + n + '</td>' + k.map(function (x) {
    return '<td class="num">' + (typeof d[x] === 'number' ? d[x].toLocaleString('zh-TW') : '—') + '</td>'; }).join('') + '</tr>'; };
  o.innerHTML = '<h3>loadBrokerPositionsFull 實跑結果</h3><div class="inv-table-wrap"><table class="inv-table"><thead><tr><th>版本</th>' +
    k.map(function (x) { return '<th class="num">' + x + '</th>'; }).join('') + '</tr></thead><tbody>' +
    row('修正後（每股 10.00）', now) +
    row('修正前（該日總成本，重複加）', old) +
    row('完全不補正（券商原始）', raw) +
    '</tbody></table></div>' +
    '<div class="rs-note">總成本含 00918 替身 6,000,000。修正後 00407A 成本應為 40,000＋60,000＋47,650＝147,650。</div>';
})();
</script>
</body>
</html>
