function Y1(v){return B0-(v-e1[0])/(e1[1]-e1[0])*(B0-T);}

var aMax=Math.max.apply(null,D.aum.map(function(a){return a[1];}))*1.15;
function YA(v){return B2-v/aMax*(B2-B1);}
var s=[],esc=function(t){return String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;');};

function txt(x,y,t,c,sz,anch,wt){s.push('<text x="'+x+'" y="'+y+'" fill="'+c+'" font-size="'+(sz||11)+'" text-anchor="'+(anch||'start')+'"'+(wt?' font-weight="'+wt+'"':'')+'>'+esc(t)+'</text>');}

});

// x 軸月份刻度

});

// 滑鼠十字線

document.getElementById('nt').innerHTML=
 '<b>怎麼讀</b>：實線為價格型，起點設 100，直接讀累積漲跌 %；虛線為水準型，轉成 z-score（離自身均值幾個標準差），因為 VIX 與殖利率的意義是「現在幾度」不是「漲了幾 %」，用同一種正規化會誤導。'
 +'<br><b>月資料不連成折線</b>：除息畫成垂直線、月規模畫成柱狀。'+D.events.length+' 期除息中有 '+nz+' 期平準金 > 0（琥珀實線並標示占比），其餘為淡虛線。'
 +'月規模只有 '+D.aum.length+' 個點，連成折線會變成插值假象。'
 +'<br><b>兩條 '+D.code+' 線的距離＝累積配息</b>：含息總報酬 '+(D.gap.tr>=0?'+':'')+D.gap.tr+'%、價格 '+(D.gap.px>=0?'+':'')+D.gap.px+'%，'
