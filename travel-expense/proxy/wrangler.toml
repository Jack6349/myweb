name = "travel-expense-ocr-proxy"
main = "worker.js"
compatibility_date = "2024-01-01"

# 機密值不要寫在這個檔案裡（會進 git），一律用 CLI 設定：
#   wrangler secret put GEMINI_API_KEY
#   wrangler secret put APP_SECRET      （前端需帶同樣的值，見 README）

# 限制只有此網域的網頁能呼叫這支 Worker（Worker 內同時做伺服器端驗證，非僅 CORS 標頭）
[vars]
ALLOWED_ORIGIN = "https://jack6349.github.io"
